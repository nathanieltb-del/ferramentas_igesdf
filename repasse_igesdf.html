<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sistema de Repasses — IGESDF</title>
<style>
  :root {
    --blue: #1b94c2; --teal: #0ebcca; --lime: #bcd630; --yellow: #e6c200;
    --orange: #f36f21; --gray: #58585a; --ink: #1f2d33;
    --border: #e2e6e8; --bg: #f4f6f7; --muted: #8a9296;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: var(--font); color: var(--ink); background: var(--bg); }
  button, input, select, textarea { font-family: inherit; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #cfd6d8; border-radius: 4px; }

  .app { display: flex; height: 100vh; width: 100%; }

  /* Sidebar */
  .sidebar { width: 250px; min-width: 250px; background: #0f2733; color: #fff; display: flex; flex-direction: column; height: 100%; }
  .sidebar-header { padding: 22px 20px 16px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .sidebar-header img { width: 138px; display: block; }
  .sidebar-header .tag { font-size: 11px; color: #9db3bd; margin-top: 10px; letter-spacing: .04em; }
  .year-select-wrap { padding: 14px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .year-select-label { font-size: 10.5px; font-weight: 700; color: #7e93 9c; color: #7e939c; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
  select.year-select { width: 100%; padding: 8px 10px; border-radius: 7px; border: 1px solid #274453; background: #16333f;
    color: #fff; font-size: 14px; font-weight: 700; }
  .sidebar-nav { padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; flex: 1; overflow-y: auto; }
  .nav-btn { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: transparent;
    border: none; border-left: 3px solid transparent; color: #b7c6cc; border-radius: 6px; cursor: pointer;
    font-size: 13.5px; font-weight: 500; text-align: left; font-family: inherit; width: 100%; }
  .nav-btn.active { background: rgba(14,188,202,0.16); border-left-color: var(--teal); color: #fff; font-weight: 600; }
  .nav-btn svg { flex-shrink: 0; }
  .sidebar-footer { padding: 12px 20px 16px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 11px; color: #6f868f; }

  /* Main */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar { display: flex; align-items: flex-end; justify-content: space-between; padding: 22px 28px 16px;
    border-bottom: 1px solid var(--border); background: #fff; gap: 12px; flex-wrap: wrap; }
  .topbar h1 { font-size: 20px; font-weight: 700; color: var(--ink); margin: 0; }
  .topbar .subtitle { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .topbar .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .content { padding: 24px; overflow-y: auto; flex: 1; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 7px;
    font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; border: 1px solid; }
  .btn-sm { padding: 6px 10px; font-size: 12.5px; }
  .btn-primary { background: var(--blue); color: #fff; border-color: var(--blue); }
  .btn-ghost { background: #fff; color: var(--ink); border-color: #d7dcde; }
  .btn-danger { background: #fff; color: #c0432a; border-color: #f0c7ba; }
  .btn-dark { background: #0f2733; color: #fff; border-color: #0f2733; }
  .btn:disabled { opacity: .6; cursor: default; }

  /* KPI cards */
  .kpi-row { display: flex; gap: 14px; margin-bottom: 22px; flex-wrap: wrap; }
  .kpi-card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px;
    flex: 1; min-width: 190px; position: relative; overflow: hidden; }
  .kpi-card::before { content: ""; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--accent, var(--blue)); }
  .kpi-label { font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--gray); text-transform: uppercase;
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .kpi-value { font-family: var(--mono); font-size: 17px; letter-spacing: -.01em; overflow-wrap: anywhere; font-weight: 600; color: var(--ink); line-height: 1.1; }
  .kpi-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .kpi-cross { display: flex; align-items: center; gap: 14px; }
  .status-cross { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px; }
  .status-cross div { border-radius: 3px; background: #e7ebec; }

  /* Panels */
  .panel { background: #fff; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .panel-header { padding: 14px 18px; border-bottom: 1px solid var(--border); font-weight: 700; font-size: 13.5px; color: var(--ink); }
  .grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

  /* Pills */
  .pill { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 20px; white-space: nowrap; display: inline-block; }
  .pill-neutral { background: #eef1f2; color: var(--gray); }
  .pill-good { background: #eef7de; color: #5c7a0f; }
  .pill-warn { background: #fff6db; color: #8a6d00; }
  .pill-bad { background: #fde7dc; color: #b8480f; }
  .pill-info { background: #e3f4f8; color: #0f6f89; }

  /* Tables */
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  thead tr { background: #fbfcfc; text-align: left; }
  th { padding: 8px 12px; font-weight: 700; color: var(--muted); border-bottom: 1px solid var(--border);
    white-space: nowrap; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; }
  td { padding: 8px 12px; color: var(--ink); white-space: nowrap; border-bottom: 1px solid #f0f2f3; }
  tfoot td { font-weight: 700; }
  tfoot tr { background: #f6f8f9; }
  .mono { font-family: var(--mono); }
  .icon-btn { border: none; background: none; cursor: pointer; color: var(--muted); padding: 4px; }
  .icon-btn:hover { color: var(--ink); }
  .icon-btn.danger:hover { color: #c0432a; }

  /* Month accordion */
  .month-block { margin-bottom: 14px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: #fff; }
  .month-block-header { display: flex; align-items: center; justify-content: space-between; cursor: pointer;
    padding: 12px 16px; background: #f6f8f9; gap: 12px; flex-wrap: wrap; }
  .month-block-header.open { border-bottom: 1px solid var(--border); }
  .month-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .month-right { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .month-name { font-weight: 700; font-size: 14px; color: var(--ink); width: 110px; }
  .table-wrap { overflow-x: auto; }

  /* Inputs */
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .field-hint { font-size: 11px; color: var(--muted); }
  .input, select.input { width: 100%; padding: 8px 10px; border: 1px solid #d7dcde; border-radius: 6px; font-size: 13.5px; }
  .input-icon-wrap { position: relative; }
  .input-icon-wrap svg { position: absolute; left: 9px; top: 9px; color: var(--muted); }
  .input-icon-wrap input { padding-left: 28px; }

  /* Modal */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(15,39,51,0.45); display: flex; align-items: center;
    justify-content: center; z-index: 60; padding: 20px; }
  .modal { background: #fff; border-radius: 12px; width: 560px; max-width: 100%; max-height: 88vh; overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
  .modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .modal-title { font-weight: 700; font-size: 15px; color: var(--ink); }
  .modal-body { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-body .full { grid-column: 1 / -1; }
  .modal-footer { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .modal-note { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.5; }

  .center-msg { display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column;
    gap: 12px; color: var(--gray); text-align: center; padding: 20px; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13px; }

  /* Cadastro (Repasses Previstos) */
  .instrumento-card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin-bottom: 12px; }
  .instrumento-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .instrumento-title { font-weight: 700; font-size: 14.5px; color: var(--ink); }
  .instrumento-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .instrumento-actions { display: flex; gap: 6px; }
  .parcela-preview { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .parcela-chip { background: #f4f6f7; border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font-size: 11px; color: var(--gray); }
  .parcela-chip.recebido { background: #eef7de; border-color: #d7e8b0; color: #5c7a0f; }

  /* Parcela card dentro de Lançamentos */
  .parcela-card { border: 1px solid var(--border); border-radius: 8px; margin: 10px 16px; overflow: hidden; }
  .parcela-card-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px;
    background: #fbfcfc; gap: 10px; flex-wrap: wrap; }
  .parcela-card-title { font-weight: 600; font-size: 13px; color: var(--ink); }
  .parcela-card-meta { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .parcela-card-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 12px; }
  .lanc-subtable { padding: 0 14px 12px; }
  .lanc-subtable table { font-size: 12px; }
  .lanc-total-row td { font-weight: 700; border-top: 2px solid var(--border); background: #f4f6f7; color: var(--ink); }
  .parcela-metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 0 14px 12px; }
  .metric-block { min-width: 0; }
  .metric-label { font-size: 10.5px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 4px; }
  .metric-label .icon-btn { padding: 0; }
  .metric-value { font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--ink); margin-top: 2px; }
  .metric-sub { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .desconto-editor { margin: 0 14px 12px; padding: 10px 12px; background: #fbfcfc; border: 1px solid var(--border); border-radius: 8px; }
  .desconto-editor-title { font-size: 12px; font-weight: 700; margin-bottom: 8px; }
  .desconto-row { display: grid; grid-template-columns: 1fr 1fr 26px; gap: 6px; align-items: center; margin-bottom: 6px; }
  .desconto-row .input { padding: 5px 8px; font-size: 12.5px; }
  .desconto-editor-total { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 700; border-top: 1px solid var(--border); padding-top: 8px; margin-top: 4px; }
  .lanc-table input.mini, .lanc-table select.mini { width: 100%; padding: 4px 6px; font-size: 12px; border: 1px solid #d7dcde; border-radius: 4px; }
  .lanc-table tr.editing-row td, .lanc-table tr.new-row td { background: #fbfcfc; vertical-align: top; }
  .lanc-row-actions { display: flex; gap: 4px; opacity: 0; transition: opacity .1s; }
  .lanc-table tbody tr:hover .lanc-row-actions { opacity: 1; }
  .lanc-table tr.editing-row .lanc-row-actions, .lanc-table tr.new-row .lanc-row-actions { opacity: 1; }
  .lanc-add-row td { padding: 6px 8px; color: var(--blue); font-weight: 600; font-size: 12px; cursor: pointer; }
  .lanc-add-row td:hover { text-decoration: underline; }
  .lanc-empty { padding: 10px 14px; color: var(--muted); font-size: 12px; font-style: italic; }
  textarea.input { min-height: 64px; resize: vertical; }

  .type-new-row { display: flex; gap: 8px; align-items: center; }

  /* Filtros avançados */
  .filter-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; background: #fff;
    border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 18px; }
  .filter-field { display: flex; flex-direction: column; gap: 4px; min-width: 150px; }
  .filter-field label { font-size: 10.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }

  /* Cabeçalho de impressão (só aparece no PDF) */
  .rel-filtros { font-size: 12.5px; color: var(--gray); margin: 0 0 14px; padding: 9px 12px; background: #fff; border: 1px solid var(--border); border-left: 3px solid var(--blue); border-radius: 6px; line-height: 1.5; }
  .rel-filtros .rel-regra { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .print-header { display: none; }
  @media print {
    .print-header { display: flex !important; align-items: center; gap: 14px; padding-bottom: 14px; margin-bottom: 14px; border-bottom: 2px solid #1b94c2; }
    .print-header img { height: 46px; }
    .print-header .ph-title { font-size: 16px; font-weight: 700; color: #1f2d33; }
    .print-header .ph-sub { font-size: 11px; color: #58585a; }
    .filter-bar, .year-select-wrap { display: none !important; }
  }

  /* Demonstrativo (modelo padrão) — tabela larga com meses em coluna */
  @page { size: A4 landscape; margin: 10mm; }
  @media print {
    html, body { height: auto !important; background: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .app { display: block !important; height: auto !important; }
    .content { padding: 0 !important; }
    .panel, .demo-table-wrap, .table-wrap, .month-block { overflow: visible !important; }
    .kpi-row { gap: 8px !important; margin-bottom: 12px !important; }
    .kpi-card { min-width: 0 !important; flex: 1 1 22% !important; padding: 8px 10px !important; break-inside: avoid; }
    .kpi-value { font-size: 12px !important; }
    .kpi-label { font-size: 8px !important; }
    table { width: 100% !important; min-width: 0 !important; table-layout: auto; font-size: 8.5px !important; }
    table th, table td { padding: 4px 5px !important; white-space: normal !important; overflow-wrap: anywhere; }
    td.nw { white-space: nowrap !important; }
    table td.mono, table th, table .mono { white-space: nowrap !important; overflow-wrap: normal !important; }
    table.demo-table { font-size: 6.3px !important; }
    table.demo-table td:first-child { white-space: normal !important; }
    table.demo-table th, table.demo-table td { padding: 3px 2px !important; }
    table.demo-table th:first-child, table.demo-table td:first-child { position: static !important; width: 18%; }
    thead { display: table-header-group; }
    tfoot { display: table-row-group; }
    tr { break-inside: avoid; page-break-inside: avoid; }
    .panel, .rel-filtros { break-inside: auto; }
    .pill { font-size: 7.5px !important; padding: 1px 5px !important; }
    .parcela-preview { display: flex; flex-wrap: wrap; gap: 2px; }
    .parcela-chip { font-size: 7px !important; padding: 1px 4px !important; }
  }
  td.nw { white-space: nowrap; }
  .demo-table-wrap { overflow-x: auto; }
  table.demo-table { min-width: 1400px; }
  table.demo-table th, table.demo-table td { text-align: right; }
  table.demo-table th:first-child, table.demo-table td:first-child { text-align: left; position: sticky; left: 0; background: #fff; z-index: 1; min-width: 190px; }
  table.demo-table thead th:first-child { background: #fbfcfc; }
  tr.demo-row-bold td { font-weight: 700; }
  tr.demo-row-neg td { color: #b8480f; }
  tr.demo-row-total td { background: #f6f8f9; font-weight: 700; border-top: 2px solid var(--border); }
  .demo-resumo { max-width: 380px; margin-top: 20px; }
  .demo-resumo table td:first-child { color: var(--muted); }
  .demo-resumo table td:last-child { text-align: right; font-weight: 700; }
  .demo-resumo tr.destaque td { background: #e3f4f8; font-weight: 700; }

  /* Status de sincronização */
  .sync-status { padding: 8px 20px; font-size: 11px; color: #6f868f; display: flex; align-items: center; gap: 6px; border-top: 1px solid rgba(255,255,255,0.08); }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #6f868f; flex-shrink: 0; }
  .sync-dot.ok { background: var(--lime); }
  .sync-dot.error { background: var(--orange); }
  .sync-dot.syncing { background: var(--teal); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

  @media print {
    .sidebar, .no-print { display: none !important; }
    body, .app, .main, .content { height: auto !important; overflow: visible !important; }
  }
  @media (max-width: 720px) {
    .sidebar { position: fixed; z-index: 40; height: 100%; transform: translateX(-100%); transition: transform .2s; }
    .sidebar.open { transform: translateX(0); }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img id="logo-img" alt="IGESDF" />
      <div class="tag">SISTEMA DE REPASSES · CONTRATO DE GESTÃO SES-DF</div>
    </div>
    <div class="year-select-wrap">
      <div class="year-select-label">Exercício</div>
      <select class="year-select" id="year-select"></select>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sync-status" id="sync-status"></div>
    <div class="sidebar-footer">Instituto de Gestão Estratégica<br />de Saúde do Distrito Federal</div>
  </aside>
  <div class="main">
    <div id="topbar"></div>
    <div id="content" class="content"></div>
  </div>
</div>
<div id="modal-root"></div>

<script>
"use strict";

/* ============================ ÍCONES (SVG inline) ============================ */
const ICONS = {
  dashboard: '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
  table: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/>',
  bar: '<path d="M3 20V10M9 20V4M15 20v-7M21 20v-4"/>',
  calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
  layers: '<path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  trash: '<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/>',

  download: '<path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/>',
  sheet: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8M8 17h8M8 9h2"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  alert: '<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><path d="M12 9v4M12 17h.01"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  filetext: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M9 13h6M9 17h6M9 9h1"/>',
  undo: '<path d="M3 7v6h6"/><path d="M3 13a9 9 0 1 0 3-7.7L3 8"/>',
  minus: '<path d="M5 12h14"/>',

/* ============================ FORMATAÇÃO ============================ */
function esc(v) {
  if (v === null || v === undefined) return "";
  return String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function fmtCurrency(v) {
  if (v === null || v === undefined || isNaN(v)) return "—";
  return Number(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}
function fmtCurrencyCompact(v) {
  if (v === null || v === undefined || isNaN(v)) return "—";
  if (Math.abs(v) >= 1000000) return "R$ " + (v / 1000000).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " mi";
  return fmtCurrency(v);
}
function fmtPercent(v) {
  if (v === null || v === undefined || isNaN(v)) return "—";
  return (v * 100).toLocaleString("pt-BR", { maximumFractionDigits: 2 }) + "%";
}
function fmtDateBR(iso) {
  if (!iso) return "—";
  const parts = String(iso).split("-");
  if (parts.length !== 3) return esc(iso);
  return parts[2] + "/" + parts[1] + "/" + parts[0];
}
function pill(text, tone) {
  return '<span class="pill pill-' + (tone || "neutral") + '">' + esc(text) + "</span>";
}
function printHeader(title, subtitle) {
  return '<div class="print-header"><img src="' + LOGO_DATA_URI + '" alt="IGESDF"/><div>' +
    '<div class="ph-title">' + esc(title) + "</div>" +
    '<div class="ph-sub">' + esc(subtitle || "") + " · Emitido em " + esc(new Date().toLocaleDateString("pt-BR")) + "</div></div></div>";
}

/* ============================ MÁSCARA DE MOEDA (R$) ============================ */
function attachCurrencyMask(el, initialValue) {
  function setFromCents(cents) {
    const num = cents / 100;
    el.dataset.rawValue = String(num);
    el.value = num.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  }
  function centsFromValue(v) { return Math.round((Number(v) || 0) * 100); }
  setFromCents(centsFromValue(initialValue || 0));
  el.addEventListener("input", () => {
    const digits = el.value.replace(/\D/g, "");
    setFromCents(digits ? parseInt(digits, 10) : 0);
  });
  el.addEventListener("focus", () => { setTimeout(() => el.setSelectionRange(el.value.length, el.value.length), 0); });
}
function getCurrencyValue(el) { return Number(el.dataset.rawValue) || 0; }

/* ============================ DATAS ============================ */
function primeiroDiaUtil(ano, mes) {
  const d = new Date(ano, mes - 1, 1);
  const dow = d.getDay();
  if (dow === 6) d.setDate(d.getDate() + 2);
  else if (dow === 0) d.setDate(d.getDate() + 1);
  return d;
}
function dateToISO(d) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + day;
}
function isoToDate(iso) {
  const [y, m, d] = String(iso).split("-").map(Number);
  return new Date(y, (m || 1) - 1, d || 1);
}
function diasEntre(isoInicio, isoFim) {
  if (!isoInicio || !isoFim) return null;
  const ms = isoToDate(isoFim) - isoToDate(isoInicio);
  return Math.round(ms / 86400000);
}

/* ============================================================
   MODELO DE DADOS
   ------------------------------------------------------------
   Instrumento → gera Parcelas (uma por competência) → cada
   Parcela pode ter vários Lançamentos (recebimentos). Cada
   Lançamento tem Data, Valor Recebido, Fonte (com opção "Outro"
   em texto livre), Observações, e uma lista de Descontos
   (Estatutário / Custeio / Adiantamento / Outro).
   ============================================================ */

const DB_KEY_INSTRUMENTOS = "igesdf_instrumentos_v3";
const DB_KEY_PARCELAS = "igesdf_parcelas_v3";
const DB_KEY_TIPOS_CUSTOM = "igesdf_tipos_custom_v3";
const DB_KEY_ADIANTAMENTOS = "igesdf_adiantamentos_v3";
const DB_KEY_FONTES = "igesdf_fontes_v3";

/**
 * ==================== CONEXÃO COM GOOGLE SHEETS ====================
 * Cole aqui a URL do /exec depois de implantar o Code.gs como App da
 * Web. Enquanto estiver vazia, o sistema funciona 100% local
 * (localStorage) e a sincronização fica automaticamente desativada.
 */
const SHEETS_API_URL = "https://script.google.com/macros/s/AKfycbyrK0dWw3anO-Map1Ld6Q-Q6jepzquzrltNl9fOYMSf_MDqWYSGX7-LO4qTrwfhYTAQYQ/exec";
const SYNC_DEBOUNCE_MS = 2000;
const SYNC_INTERVAL_MS = 5 * 60 * 1000;

const db = {
  load() {
    let instrumentos = [], parcelas = [], tiposCustom = [], adiantamentos = [], fontes = null;
    try { instrumentos = JSON.parse(localStorage.getItem(DB_KEY_INSTRUMENTOS)) || []; } catch (e) {}
    try { parcelas = JSON.parse(localStorage.getItem(DB_KEY_PARCELAS)) || []; } catch (e) {}
    try { tiposCustom = JSON.parse(localStorage.getItem(DB_KEY_TIPOS_CUSTOM)) || []; } catch (e) {}
    try { adiantamentos = JSON.parse(localStorage.getItem(DB_KEY_ADIANTAMENTOS)) || []; } catch (e) {}
    try { fontes = JSON.parse(localStorage.getItem(DB_KEY_FONTES)); } catch (e) {}
    return { instrumentos, parcelas, tiposCustom, adiantamentos, fontes };
  },
  save(instrumentos, parcelas, tiposCustom, adiantamentos, fontes) {
    if (fontes) localStorage.setItem(DB_KEY_FONTES, JSON.stringify(fontes));
    localStorage.setItem(DB_KEY_ADIANTAMENTOS, JSON.stringify(adiantamentos || []));
    localStorage.setItem(DB_KEY_INSTRUMENTOS, JSON.stringify(instrumentos));
    localStorage.setItem(DB_KEY_PARCELAS, JSON.stringify(parcelas));
    localStorage.setItem(DB_KEY_TIPOS_CUSTOM, JSON.stringify(tiposCustom));
  },
};

function uid(prefix) {
  return (prefix || "id") + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function gerarParcelas(instrumento) {
  const parcelas = [];
  const valorParcela = Math.round((instrumento.valorTotal / instrumento.numParcelas) * 100) / 100;
  let ano = instrumento.anoInicio, mes = instrumento.mesInicio;
  let somaAlocada = 0;
  for (let i = 0; i < instrumento.numParcelas; i++) {
    const ehUltima = i === instrumento.numParcelas - 1;
    const valor = ehUltima ? Math.round((instrumento.valorTotal - somaAlocada) * 100) / 100 : valorParcela;
    somaAlocada += valor;
    parcelas.push({
      id: uid("parc"), instrumentoId: instrumento.id, ano: ano, mes: mes,
      valorPrevisto: valor, dataContrato: dateToISO(primeiroDiaUtil(ano, mes)), lancamentos: [], descontos: [],
    });
    mes++;
    if (mes > 12) { mes = 1; ano++; }
  }
  return parcelas;
}

function carregarEstado() {
  const d = db.load();
  state.instrumentos = d.instrumentos;
  state.parcelas = d.parcelas;
  state.tiposCustom = d.tiposCustom;
  state.adiantamentos = d.adiantamentos;
  state.fontes = Array.isArray(d.fontes) ? d.fontes : fontesPadrao();
  atualizarFonteOpcoes();
  reaplicarAdiantamentos();
  state.anoAtual = anoComDadosMaisRecente();
}
function persistir() {
  reaplicarAdiantamentos();
  atualizarFonteOpcoes();
  db.save(state.instrumentos, state.parcelas, state.tiposCustom, state.adiantamentos, state.fontes);
  agendarSync();
}
function tiposDisponiveis() { return TIPOS_INSTRUMENTO_BASE.concat(state.tiposCustom); }
function registrarTipoCustom(tipo) {
  if (!tipo) return;
  if (!tiposDisponiveis().includes(tipo)) { state.tiposCustom.push(tipo); persistir(); }
}

function anosDisponiveis() {
  const set = new Set(state.parcelas.map((p) => p.ano));
  set.add(new Date().getFullYear());
  return Array.from(set).sort((a, b) => a - b);
}
function anoComDadosMaisRecente() {
  const anos = Array.from(new Set(state.parcelas.map((p) => p.ano))).sort((a, b) => b - a);
  return anos.length ? anos[0] : new Date().getFullYear();
}

function parcelasDoAno(ano) { return state.parcelas.filter((p) => p.ano === ano); }
function instrumentoDe(parcela) { return state.instrumentos.find((i) => i.id === parcela.instrumentoId); }
function mesesDoAno(ano) {
  const porMes = {};
  for (let m = 1; m <= 12; m++) porMes[m] = [];
  parcelasDoAno(ano).forEach((p) => { if (porMes[p.mes]) porMes[p.mes].push(p); });
  return Object.keys(porMes).map((m) => ({ mes: Number(m), parcelas: porMes[m] }));
}
/** Instrumentos que têm ao menos uma parcela no ano informado (corrige o filtro por Exercício). */
function instrumentosDoAno(ano) {
  const ids = new Set(parcelasDoAno(ano).map((p) => p.instrumentoId));
  return state.instrumentos.filter((i) => ids.has(i.id));
}

/* ============================ LABELS (fonte/desconto "Outro") ============================ */
function fonteLabel(lancamento) {
  return lancamento.fonte === "Outro" ? (lancamento.fonteOutro || "Outro (não especificado)") : lancamento.fonte;
}
function descontoTipoLabel(d) {
  return d.tipo === "Outro" ? (d.tipoOutro || "Outro") : d.tipo;
}

/* ============================ TOTAIS / STATUS ============================
   Desconto agora é registrado por Parcela/Competência (não mais por Lançamento),
   categorizado (Estatutário/Custeio/Adiantamento/Outro).
   Valor Líquido a Receber = Repasse Previsto − Desconto.
   Cada Lançamento já registra o Valor Recebido em valor LÍQUIDO.
   Saldo = Valor Líquido a Receber − Σ(Valor Recebido). */
function descontoTotalParcela(p) { return (p.descontos || []).reduce((s, d) => s + (d.valor || 0), 0); }
function totaisParcela(p) {
  const lancs = p.lancamentos || [];
  const recebido = lancs.reduce((s, l) => s + (l.valorRecebido || 0), 0);
  const desconto = descontoTotalParcela(p);
  const liquido = (p.valorPrevisto || 0) - desconto;
  const saldo = liquido - recebido;
  let status = "pendente";
  if (lancs.length > 0) status = saldo > 0.005 ? "parcial" : "quitado";
  return { recebido, desconto, liquido, saldo, status };
}
function statusTone(status) { return status === "quitado" ? "good" : status === "parcial" ? "info" : "warn"; }
function statusLabel(status) { return status === "quitado" ? "Quitado" : status === "parcial" ? "Parcial" : "Pendente"; }
function pctLancamento(lancamento, parcela) {
  const liquido = (parcela.valorPrevisto || 0) - descontoTotalParcela(parcela);
  if (!liquido) return null;
  return (lancamento.valorRecebido || 0) / liquido;
}
function totaisMes(parcelasDoMes) {
  let previsto = 0, recebido = 0, desconto = 0;
  parcelasDoMes.forEach((p) => {
    previsto += p.valorPrevisto || 0;
    desconto += descontoTotalParcela(p);
    (p.lancamentos || []).forEach((l) => { recebido += l.valorRecebido || 0; });
  });
  const liquido = previsto - desconto;
  return { previsto, recebido, desconto, liquido, saldo: liquido - recebido };
}
function totaisAno(ano) { return totaisMes(parcelasDoAno(ano)); }

function fonteBreakdown(parcelasList) {
  const map = {};
  parcelasList.forEach((p) => (p.lancamentos || []).forEach((l) => {
    const key = fonteLabel(l);
    map[key] = (map[key] || 0) + (l.valorRecebido || 0);
  }));
  return Object.keys(map).map((fonte) => ({ fonte, total: map[fonte] }));
}
function descontoBreakdown(parcelasList) {
  const map = {};
  DESCONTO_TIPOS.forEach((t) => (map[t] = 0));
  parcelasList.forEach((p) => (p.descontos || []).forEach((d) => {
    map[d.tipo] = (map[d.tipo] || 0) + (d.valor || 0);
  }));
  return map;
}
const FONTE_COLOR_PALETTE = [COLORS.blue, COLORS.orange, COLORS.teal, COLORS.lime, COLORS.gray, COLORS.yellow];
function corDaFonte(fonte, listaFontes) {
  const idx = listaFontes.indexOf(fonte);
  return FONTE_COLOR_PALETTE[idx % FONTE_COLOR_PALETTE.length] || COLORS.gray;
}

/* ============================================================
   SINCRONIZAÇÃO COM GOOGLE SHEETS
   ============================================================ */
let syncTimer = null;
function agendarSync() {
  if (!SHEETS_API_URL) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(sincronizarAgora, SYNC_DEBOUNCE_MS);
}
function buildSyncPayload() {
  const lancamentosFlat = [];
  state.parcelas.forEach((p) => (p.lancamentos || []).forEach((l) => {
    lancamentosFlat.push(Object.assign({}, l, { parcelaId: p.id }));
  }));
  const parcelasFlat = state.parcelas.map((p) => ({
    id: p.id, instrumentoId: p.instrumentoId, ano: p.ano, mes: p.mes, valorPrevisto: p.valorPrevisto, dataContrato: p.dataContrato,
    descontos: p.descontos || [],
  }));
  return { instrumentos: state.instrumentos, parcelas: parcelasFlat, lancamentos: lancamentosFlat, tiposCustom: state.tiposCustom, adiantamentos: state.adiantamentos, fontes: state.fontes };
}
function setSyncStatus(kind, msg) {
  const el = document.getElementById("sync-status");
  if (!el) return;
  if (!SHEETS_API_URL) { el.innerHTML = ""; return; }
  el.innerHTML = '<span class="sync-dot ' + kind + '"></span>' + esc(msg);
}
async function sincronizarAgora() {
  if (!SHEETS_API_URL) return;
  setSyncStatus("syncing", "Sincronizando…");
  try {
    const res = await fetch(SHEETS_API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "syncAll", payload: buildSyncPayload() }),
    });
    const json = await res.json();
    if (json.error) throw new Error(json.error);
    setSyncStatus("ok", "Sincronizado às " + new Date().toLocaleTimeString("pt-BR").slice(0, 5));
  } catch (err) {
    setSyncStatus("error", "Falha ao sincronizar (dados salvos localmente)");
  }
}
async function carregarDeSheets() {
  if (!SHEETS_API_URL) return false;
  setSyncStatus("syncing", "Carregando da planilha…");
  try {
    const res = await fetch(SHEETS_API_URL + "?action=getDados", { method: "GET" });
    const json = await res.json();
    if (json.error) throw new Error(json.error);
    const data = json.data;
    if (!data || !data.instrumentos || !data.instrumentos.length) return false; // planilha vazia: mantém local/seed
    // Descontos vêm da planilha (coluna DescontosJSON). Se a planilha ainda não os tem (versão antiga do Code.gs),
    // preserva os descontos que já existem neste navegador, para não perdê-los.
    const locaisPorId = {};
    state.parcelas.forEach((p) => { locaisPorId[p.id] = p; });
    const parcelasComLancs = data.parcelas.map((p) => {
      const remotos = Array.isArray(p.descontos) ? p.descontos : [];
      const local = locaisPorId[p.id];
      const descontos = remotos.length ? remotos : (local && local.descontos ? local.descontos : []);
      return {
        ...p, descontos: descontos,
        lancamentos: data.lancamentos.filter((l) => l.parcelaId === p.id).map((l) => { const c = Object.assign({}, l); delete c.parcelaId; return c; }),
      };
    });
    state.instrumentos = data.instrumentos;
    state.parcelas = parcelasComLancs;
    state.tiposCustom = data.tiposCustom || [];
    state.adiantamentos = Array.isArray(data.adiantamentos) ? data.adiantamentos : state.adiantamentos;
    if (Array.isArray(data.fontes) && data.fontes.length) state.fontes = data.fontes;
    atualizarFonteOpcoes();
    reaplicarAdiantamentos();
    db.save(state.instrumentos, state.parcelas, state.tiposCustom, state.adiantamentos, state.fontes);
    setSyncStatus("ok", "Carregado da planilha");
    return true;
  } catch (err) {
    setSyncStatus("error", "Sem conexão com a planilha (usando dados locais)");
    return false;
  }
}

/* ============================ GRÁFICOS (SVG puro) ============================ */
/** series: [{key, label, color}]; data: [{mes, [key]: valor, ...}] */
function svgBarChart(data, series, width, height) {
  width = width || 640; height = height || 260;
  const padL = 56, padB = 40, padT = 10, padR = 10;
  const innerW = width - padL - padR, innerH = height - padT - padB;
  const maxVal = Math.max(1, ...data.flatMap((d) => series.map((s) => d[s.key] || 0)));
  const n = data.length || 1;
  const groupW = innerW / n;
  const gap = 2;
  const barW = Math.max(3, Math.min(16, (groupW * 0.75) / series.length - gap));
  let bars = "", labels = "", gridLines = "";
  const steps = 4;
  for (let i = 0; i <= steps; i++) {
    const y = padT + innerH - (innerH * i) / steps;
    const val = (maxVal * i) / steps;
    gridLines += '<line x1="' + padL + '" y1="' + y + '" x2="' + (width - padR) + '" y2="' + y + '" stroke="#eef1f2" stroke-width="1"/>';
    gridLines += '<text x="' + (padL - 8) + '" y="' + (y + 3) + '" font-size="9" fill="#8a9296" text-anchor="end">' + esc(fmtCurrencyCompact(val)) + "</text>";
  }
  const totalBarsW = series.length * barW + (series.length - 1) * gap;
  data.forEach((d, i) => {
    const cx = padL + groupW * i + groupW / 2;
    const startX = cx - totalBarsW / 2;
    series.forEach((s, si) => {
      const val = d[s.key] || 0;
      const h = maxVal > 0 ? (innerH * val) / maxVal : 0;
      const x = startX + si * (barW + gap);
      const y = padT + innerH - h;
      bars += '<rect x="' + x + '" y="' + y + '" width="' + barW + '" height="' + h + '" fill="' + s.color + '" rx="2"><title>' + esc(d.mes) + " — " + esc(s.label) + ": " + esc(fmtCurrency(val)) + '</title></rect>';
    });
    labels += '<text x="' + cx + '" y="' + (height - padB + 18) + '" font-size="10" fill="#8a9296" text-anchor="middle">' + esc(d.mes) + "</text>";
  });
  const legend = series.map((s) =>
    '<span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:' + s.color + ';margin-right:6px;"></span>' + esc(s.label) + "</span>"
  ).join("");
  return (
    '<svg viewBox="0 0 ' + width + " " + height + '" width="100%" height="' + height + '" role="img" aria-label="Gráfico por competência">' +
    gridLines + bars + labels + "</svg>" +
    '<div style="display:flex;gap:16px;margin-top:8px;font-size:12px;color:#58585a;flex-wrap:wrap;">' + legend + "</div>"
  );
}

function svgDonutChart(data, size) {
  size = size || 200;
  const r = size / 2 - 14, cx = size / 2, cy = size / 2;
  const circumference = 2 * Math.PI * r;
  const total = data.reduce((s, d) => s + d.total, 0) || 1;
  const listaFontes = data.map((d) => d.fonte);
  let offsetAcc = 0, circles = "";
  data.forEach((d) => {
    const frac = d.total / total;
    const dash = frac * circumference, gap = circumference - dash;
    const color = corDaFonte(d.fonte, listaFontes);
    circles += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="18" ' +
      'stroke-dasharray="' + dash + " " + gap + '" stroke-dashoffset="' + (-offsetAcc) + '" transform="rotate(-90 ' + cx + " " + cy + ')">' +
      "<title>" + esc(d.fonte) + " — " + esc(fmtCurrency(d.total)) + "</title></circle>";
    offsetAcc += dash;
  });
  if (!data.length) circles = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="#e7ebec" stroke-width="18"/>';
  return '<svg viewBox="0 0 ' + size + " " + size + '" width="100%" height="' + size + '" role="img" aria-label="Recebido por fonte">' + circles + "</svg>";
}

function parcelasFiltradasPainel() {
  const f = state.painelFiltros;
  return parcelasDoAno(state.anoAtual).filter((p) => {
    if (p.mes < f.mesIni || p.mes > f.mesFim) return false;
    if (f.instrumentoId && p.instrumentoId !== f.instrumentoId) return false;
    if (f.status && totaisParcela(p).status !== f.status) return false;
    return true;
  });
}
function lancamentosFiltradosPainel(parcelasFiltradas) {
  const f = state.painelFiltros;
  const out = [];
  parcelasFiltradas.forEach((p) => (p.lancamentos || []).forEach((l) => {
    if (f.fonte && fonteLabel(l) !== f.fonte) return;
    out.push({ p, l });
  }));
  return out;
}

/* ============================ VIEW: REPASSES PREVISTOS ============================ */
function renderPrevistosView(topbar, content) {
  topbar.innerHTML = topbarHtml(
    "Repasses Previstos — " + state.anoAtual,
    "Cadastre o Contrato de Gestão, Termos Aditivos, Repactuações ou Alterações — as parcelas mensais são geradas automaticamente",
    '<button class="btn btn-primary" id="btn-novo-instrumento" type="button">' + icon("plus", 14) + "Novo repasse previsto</button>"
  );

  const instrumentos = instrumentosDoAno(state.anoAtual).slice().sort((a, b) => (a.anoInicio - b.anoInicio) || (a.mesInicio - b.mesInicio));

  if (!instrumentos.length) {
    const existemOutros = state.instrumentos.length > 0;
    content.innerHTML = '<div class="panel"><div class="empty-state">' + icon("filetext", 28) +
      (existemOutros
        ? '<div style="margin-top:10px;">Nenhum repasse previsto com parcelas em <b>' + state.anoAtual + '</b>.<br/>Troque o Exercício na barra lateral ou cadastre um novo repasse para este ano.</div>'
        : '<div style="margin-top:10px;">Nenhum repasse previsto cadastrado ainda.<br/>Clique em "Novo repasse previsto" para começar — por exemplo, o Contrato de Gestão original ou um Termo Aditivo.</div>') +
      "</div></div>";
  } else {
    content.innerHTML = instrumentos.map((inst) => {
      const parcelas = state.parcelas.filter((p) => p.instrumentoId === inst.id).sort((a, b) => (a.ano - b.ano) || (a.mes - b.mes));
      let quitadas = 0;
      const chips = parcelas.map((p) => {
        const tp = totaisParcela(p);
        if (tp.status === "quitado") quitadas++;
        return '<span class="parcela-chip' + (tp.status === "quitado" ? " recebido" : "") + '">' + MONTH_SHORT[p.mes - 1] + "/" + p.ano + " · " + fmtCurrency(p.valorPrevisto) +
          (tp.status === "quitado" ? " ✓" : tp.status === "parcial" ? " ◐" : "") + "</span>";
      }).join("");
      const inicio = MONTH_SHORT[inst.mesInicio - 1] + "/" + inst.anoInicio;
      const ultima = parcelas[parcelas.length - 1];
      const fim = ultima ? MONTH_SHORT[ultima.mes - 1] + "/" + ultima.ano : inicio;

      return (
        '<div class="instrumento-card"><div class="instrumento-top"><div>' +
        '<div class="instrumento-title">' + esc(inst.descricao) + "</div>" +
        '<div class="instrumento-meta">' + esc(inst.tipo) + " · " + esc(inst.unidade || "—") + (inst.processoSei ? " · Processo " + esc(inst.processoSei) : "") + "</div>" +
        '<div class="instrumento-meta">' + esc(fmtCurrency(inst.valorTotal)) + " em " + inst.numParcelas + " parcela" + (inst.numParcelas === 1 ? "" : "s") +
        " · " + inicio + (fim !== inicio ? " a " + fim : "") + " · " + quitadas + "/" + parcelas.length + " quitada" + (parcelas.length === 1 ? "" : "s") + "</div>" +
        (inst.observacoes ? '<div class="instrumento-meta" style="margin-top:4px;font-style:italic;">' + esc(inst.observacoes) + "</div>" : "") +
        "</div><div class=\"instrumento-actions\">" +
        '<button class="icon-btn btn-edit-inst" data-id="' + inst.id + '" type="button" title="Editar">' + icon("pencil", 15) + "</button>" +
        '<button class="icon-btn danger btn-del-inst" data-id="' + inst.id + '" type="button" title="Excluir">' + icon("trash", 15) + "</button>" +
        "</div></div>" +
        '<div class="parcela-preview">' + chips + "</div></div>"
      );
    }).join("");
  }

  document.getElementById("btn-novo-instrumento").onclick = () => openInstrumentoModal(null);
  content.querySelectorAll(".btn-edit-inst").forEach((el) => el.addEventListener("click", () => openInstrumentoModal(state.instrumentos.find((i) => i.id === el.dataset.id))));
  content.querySelectorAll(".btn-del-inst").forEach((el) => el.addEventListener("click", () => {
    const inst = state.instrumentos.find((i) => i.id === el.dataset.id);
    const parcelas = state.parcelas.filter((p) => p.instrumentoId === inst.id);
    const comLancamentos = parcelas.filter((p) => (p.lancamentos || []).length > 0).length;
    const aviso = comLancamentos > 0 ? "\n\nATENÇÃO: " + comLancamentos + " parcela(s) já têm recebimentos registrados — esses recebimentos também serão apagados." : "";
    if (!confirm('Excluir "' + inst.descricao + '" e todas as suas ' + parcelas.length + " parcela(s)?" + aviso)) return;
    state.instrumentos = state.instrumentos.filter((i) => i.id !== inst.id);
    state.adiantamentos = state.adiantamentos.filter((a) => a.instrumentoId !== inst.id);
    state.parcelas = state.parcelas.filter((p) => p.instrumentoId !== inst.id);
    persistir();
    renderAll();
  }));
}

/* ============================ MODAL: NOVO/EDITAR INSTRUMENTO ============================ */
const TIPO_NOVO_VALUE = "__novo__";

function openInstrumentoModal(existing) {
  const anoPadrao = state.anoAtual || new Date().getFullYear();
  const form = existing ? Object.assign({}, existing) : {
    id: null, tipo: TIPOS_INSTRUMENTO_BASE[0], descricao: "", valorTotal: 0, anoInicio: anoPadrao, mesInicio: 1,
    numParcelas: 12, unidade: "", processoSei: "", observacoes: "",
  };
  const temLancamentos = existing && state.parcelas.some((p) => p.instrumentoId === existing.id && (p.lancamentos || []).length > 0);
  const tipos = tiposDisponiveis();

  const root = document.getElementById("modal-root");
  root.innerHTML =
    '<div class="modal-backdrop" id="modal-backdrop"><div class="modal">' +
    '<div class="modal-header"><div class="modal-title">' + (existing ? "Editar repasse previsto" : "Novo repasse previsto") + '</div>' +
    '<button class="icon-btn" id="modal-close" type="button">' + icon("x", 18) + "</button></div>" +
    '<div class="modal-body">' +
    field("Tipo", '<select class="input" id="f-tipo">' +
      tipos.map((t) => '<option' + (t === form.tipo ? " selected" : "") + ">" + esc(t) + "</option>").join("") +
      '<option value="' + TIPO_NOVO_VALUE + '">+ Cadastrar novo tipo…</option></select>' +
      '<div class="type-new-row" id="f-tipo-novo-wrap" style="display:none;margin-top:6px;"><input class="input" id="f-tipo-novo" placeholder="Digite o novo tipo"/></div>', { full: true }) +
    field("Descrição / Rótulo", '<input class="input" id="f-descricao" placeholder="ex: 63º Termo Aditivo" value="' + esc(form.descricao) + '"/>', { full: true }) +
    field("Valor Total (R$)", '<input class="input" type="text" inputmode="decimal" id="f-valor"/>') +
    field("Nº de Parcelas (meses)", '<input class="input" type="number" min="1" id="f-parcelas" value="' + esc(form.numParcelas) + '"/>') +
    field("Mês Inicial", '<select class="input" id="f-mes">' + MONTH_NAMES.map((n, i) => '<option value="' + (i + 1) + '"' + (i + 1 === form.mesInicio ? " selected" : "") + ">" + n + "</option>").join("") + "</select>") +
    field("Ano Inicial", '<input class="input" type="number" id="f-ano" value="' + esc(form.anoInicio) + '"/>') +
    field("Unidade / Contrato", '<input class="input" id="f-unidade" placeholder="ex: CONTRATO 001 - HB" value="' + esc(form.unidade) + '"/>') +
    field("Processo SEI", '<input class="input" id="f-processo" value="' + esc(form.processoSei) + '"/>') +
    field("Observações Gerais", '<textarea class="input" id="f-obs" placeholder="Notas, contexto, condições do instrumento...">' + esc(form.observacoes) + "</textarea>", { full: true }) +
    '<div class="field full" id="f-preview-wrap"></div>' +
    "</div>" +
    (temLancamentos ? '<div class="modal-note" style="padding:0 20px 12px;color:#b8480f;">Este item já tem parcelas com recebimentos registrados. Alterar valor, nº de parcelas, mês ou ano inicial vai <b>recriar todas as parcelas</b> e apagar os recebimentos já feitos.</div>' : "") +
    '<div class="modal-footer"><div></div>' +
    '<div style="display:flex;gap:8px;"><button class="btn btn-ghost" id="modal-cancel" type="button">Cancelar</button>' +
    '<button class="btn btn-primary" id="modal-save" type="button">' + icon("check", 14) + "Salvar</button></div></div>" +
    "</div></div>";

  const valorInput = document.getElementById("f-valor");
  attachCurrencyMask(valorInput, form.valorTotal);

  const tipoSelect = document.getElementById("f-tipo");
  const tipoNovoWrap = document.getElementById("f-tipo-novo-wrap");
  tipoSelect.addEventListener("change", () => { tipoNovoWrap.style.display = tipoSelect.value === TIPO_NOVO_VALUE ? "flex" : "none"; });

  function updatePreview() {
    const valor = getCurrencyValue(valorInput);
    const n = Math.max(1, Number(document.getElementById("f-parcelas").value) || 1);
    const mesIni = Number(document.getElementById("f-mes").value);
    const anoIni = Number(document.getElementById("f-ano").value);
    const porParcela = valor / n;
    let html = '<div class="field-label" style="margin-bottom:6px;">Prévia das parcelas (distribuição igual)</div><div class="parcela-preview">';
    let ano = anoIni, mes = mesIni;
    for (let i = 0; i < Math.min(n, 36); i++) {
      html += '<span class="parcela-chip">' + MONTH_SHORT[mes - 1] + "/" + ano + " · " + fmtCurrency(porParcela) + "</span>";
      mes++; if (mes > 12) { mes = 1; ano++; }
    }
    if (n > 36) html += '<span class="parcela-chip">+' + (n - 36) + " parcelas…</span>";
    html += "</div>";
    document.getElementById("f-preview-wrap").innerHTML = html;
  }
  ["f-parcelas", "f-mes", "f-ano"].forEach((id) => document.getElementById(id).addEventListener("input", updatePreview));
  valorInput.addEventListener("input", updatePreview);
  updatePreview();

  document.getElementById("modal-close").onclick = closeModal;
  document.getElementById("modal-cancel").onclick = closeModal;
  document.getElementById("modal-backdrop").addEventListener("click", (e) => { if (e.target.id === "modal-backdrop") closeModal(); });
  document.getElementById("modal-save").onclick = () => {
    let tipoFinal = document.getElementById("f-tipo").value;
    if (tipoFinal === TIPO_NOVO_VALUE) {
      tipoFinal = document.getElementById("f-tipo-novo").value.trim();
      if (!tipoFinal) { alert("Digite o novo tipo ou escolha um da lista."); return; }
      registrarTipoCustom(tipoFinal);
    }
    const novo = {
      id: form.id || uid("inst"),
      tipo: tipoFinal,
      descricao: document.getElementById("f-descricao").value.trim() || tipoFinal,
      valorTotal: getCurrencyValue(valorInput),
      numParcelas: Math.max(1, Number(document.getElementById("f-parcelas").value) || 1),
      mesInicio: Number(document.getElementById("f-mes").value),
      anoInicio: Number(document.getElementById("f-ano").value),
      unidade: document.getElementById("f-unidade").value,
      processoSei: document.getElementById("f-processo").value,
      observacoes: document.getElementById("f-obs").value,
    };
    if (novo.valorTotal <= 0) { alert("Informe um valor total maior que zero."); return; }

    if (form.id) {
      state.instrumentos = state.instrumentos.map((i) => (i.id === form.id ? novo : i));
      state.parcelas = state.parcelas.filter((p) => p.instrumentoId !== form.id);
    } else {
      state.instrumentos.push(novo);
    }
    state.parcelas = state.parcelas.concat(gerarParcelas(novo));
    persistir();
    closeModal();
    state.anoAtual = novo.anoInicio;
    state.view = "lancamentos";
    state.filters.lancMonthOpen = novo.anoInicio + "-" + novo.mesInicio;
    renderAll();
  };
}

/* ============================ VIEW: LANÇAMENTOS ============================ */
function renderLancamentosView(topbar, content) {
  topbar.innerHTML = topbarHtml(
    "Recebimentos — " + state.anoAtual,
    "Registre os recebimentos linha a linha (valor já líquido). O desconto é definido uma vez por competência, no card da parcela",
    '<div class="input-icon-wrap">' + icon("search", 14) +
      '<input class="input" id="lanc-search" style="width:240px;" placeholder="Buscar processo SEI, unidade..." value="' + esc(state.filters.lancQuery) + '"/></div>'
  );

  const meses = mesesDoAno(state.anoAtual);
  const q = state.filters.lancQuery.toLowerCase();

  if (!instrumentosDoAno(state.anoAtual).length) {
    content.innerHTML = '<div class="panel"><div class="empty-state">' + icon("filetext", 28) +
      '<div style="margin-top:10px;">Nenhuma parcela para lançar em ' + state.anoAtual + '.<br/>Cadastre um repasse previsto primeiro em <b>Repasses Previstos</b>.</div></div></div>';
    return;
  }

  content.innerHTML = meses.map((m) => {
    const key = state.anoAtual + "-" + m.mes;
    const open = state.filters.lancMonthOpen === key;
    let parcelas = m.parcelas.slice();
    if (q) parcelas = parcelas.filter((p) => {
      const inst = instrumentoDe(p) || {};
      return (inst.processoSei || "").toLowerCase().includes(q) || (inst.unidade || "").toLowerCase().includes(q) || (inst.descricao || "").toLowerCase().includes(q);
    });
    const t = totaisMes(m.parcelas);
    const pendentes = m.parcelas.filter((p) => totaisParcela(p).status === "pendente").length;

    const cards = parcelas.length ? parcelas.map((p) => parcelaCardHtml(p)).join("") : '<div class="lanc-empty">Nenhuma parcela nesta competência.</div>';

    return (
      '<div class="month-block"><div class="month-block-header' + (open ? " open" : "") + '" data-toggle="' + key + '">' +
      '<div class="month-left"><span class="month-name">' + MONTH_NAMES[m.mes - 1] + "</span>" +
      pill(m.parcelas.length + " parcela" + (m.parcelas.length === 1 ? "" : "s"), "neutral") +
      (pendentes > 0 ? pill(pendentes + " pendente" + (pendentes === 1 ? "" : "s"), "warn") : pill("tudo lançado", "good")) + "</div>" +
      '<div class="month-right"><span style="font-size:12.5px;color:#8a9296;">Previsto <b class="mono" style="color:#1f2d33;">' + esc(fmtCurrency(t.previsto)) + "</b></span>" +
      '<span style="font-size:12.5px;color:#8a9296;">Recebido <b class="mono" style="color:#1f2d33;">' + esc(fmtCurrency(t.recebido)) + "</b></span>" +
      (t.desconto > 0 ? '<span style="font-size:12.5px;color:#8a9296;">Desconto <b class="mono" style="color:#1f2d33;">' + esc(fmtCurrency(t.desconto)) + "</b></span>" : "") +
      "</div></div>" +
      (open ? '<div style="padding:6px 0 12px;">' + cards + "</div>" : "") +
      "</div>"
    );
  }).join("");

  wireLancamentosEvents(content);

  const search = document.getElementById("lanc-search");
  if (search) search.addEventListener("input", (e) => {
    state.filters.lancQuery = e.target.value; renderAll();
    const s2 = document.getElementById("lanc-search"); s2.focus(); s2.selectionStart = s2.value.length;
  });
}

/* ============================ ESTADO DE UI (não persistido) ============================ */
let uiDescontoOpenParcela = null;
let uiDescontoDraft = [];
let uiEditingLanc = null; // { parcelaId, lancId } | null

function metricBlock(label, value, opts) {
  opts = opts || {};
  return '<div class="metric-block"><div class="metric-label">' + esc(label) +
    (opts.editable ? '<button class="icon-btn btn-desconto-toggle" data-parcela="' + opts.parcelaId + '" type="button" title="Editar desconto">' + icon("pencil", 12) + "</button>" : "") +
    "</div>" +
    '<div class="metric-value">' + esc(value) + "</div>" +
    (opts.sub ? '<div class="metric-sub">' + esc(opts.sub) + "</div>" : "") +

}

function descontoEditorHtml(p) {
  const rows = uiDescontoDraft.map((d, idx) =>
    '<div class="desconto-row">' +
    '<select class="input mini desc-tipo" data-idx="' + idx + '">' + DESCONTO_TIPOS.map((t) => '<option' + (t === d.tipo ? " selected" : "") + ">" + t + "</option>").join("") + "</select>" +
    '<input class="input mini desc-valor-wrap" data-idx="' + idx + '" placeholder="Valor"/>' +
    '<button class="icon-btn danger btn-rm-desconto" data-idx="' + idx + '" type="button">' + icon("trash", 13) + "</button>" +
    "</div>" +
    (d.tipo === "Outro"
      ? '<div class="desconto-row" style="grid-template-columns:1fr 26px;margin-top:-4px;"><input class="input mini desc-tipo-outro" data-idx="' + idx + '" placeholder="Qual o tipo?" value="' + esc(d.tipoOutro || "") + '"/><span></span></div>'
      : "")
  ).join("");
  const total = uiDescontoDraft.reduce((s, d) => s + (d.valor || 0), 0);
  return '<div class="desconto-editor" id="desconto-editor-' + p.id + '">' +
    '<div class="desconto-editor-title">Descontos da competência (' + MONTH_NAMES[p.mes - 1] + "/" + p.ano + ")</div>" +
    '<div id="desconto-rows-' + p.id + '">' + (rows || '<div class="lanc-empty" style="padding:4px 0;">Nenhum desconto adicionado.</div>') + "</div>" +
    '<button class="btn btn-ghost btn-sm btn-add-desconto-tipo" data-parcela="' + p.id + '" type="button" style="margin-top:4px;">' + icon("plus", 12) + "Adicionar tipo</button>" +
    '<div class="desconto-editor-total"><span>Total desconto</span><span class="mono" id="desconto-total-' + p.id + '">' + esc(fmtCurrency(total)) + "</span></div>" +
    '<div style="display:flex;gap:8px;margin-top:10px;justify-content:flex-end;">' +
    '<button class="btn btn-ghost btn-sm btn-cancel-desconto" data-parcela="' + p.id + '" type="button">Cancelar</button>' +
    '<button class="btn btn-primary btn-sm btn-save-desconto" data-parcela="' + p.id + '" type="button">' + icon("check", 13) + "Salvar</button>" +
    "</div></div>";
}

function fonteSelectHtml(cls, value, extraAttr) {
  return '<select class="input mini ' + cls + '" ' + (extraAttr || "") + ">" +
    opcoesFonteHtml(value) + "</select>";
}

function parcelaCardHtml(p) {
  const inst = instrumentoDe(p) || {};
  const tp = totaisParcela(p);
  const lancs = (p.lancamentos || []).slice().sort((a, b) => (a.dataEfetivacao || "").localeCompare(b.dataEfetivacao || ""));
  let acumulado = 0;
  const lancsComSaldo = lancs.map((l) => { acumulado += l.valorRecebido || 0; return { l, saldoApos: tp.liquido - acumulado }; });

  const descontosResumo = (p.descontos || []).map((d) => descontoTipoLabel(d) + " " + fmtCurrency(d.valor)).join(" · ");
  const descontoOpen = uiDescontoOpenParcela === p.id;

  const bodyRows = lancsComSaldo.map(({ l, saldoApos }) => {
    const editing = uiEditingLanc && uiEditingLanc.parcelaId === p.id && uiEditingLanc.lancId === l.id;
    if (editing) {
      return '<tr class="editing-row" data-lanc="' + l.id + '">' +
        '<td><input class="mini" type="date" id="edit-data-' + l.id + '" value="' + esc(l.dataEfetivacao || "") + '"/></td>' +
        '<td><input class="mini" type="text" inputmode="decimal" id="edit-valor-' + l.id + '"/></td>' +
        '<td>' + fonteSelectHtml("edit-fonte-" + l.id, l.fonte, 'id="edit-fonte-' + l.id + '"') +
        '<input class="mini" id="edit-fonte-outro-' + l.id + '" placeholder="Qual fonte?" style="margin-top:4px;display:' + (l.fonte === "Outro" ? "block" : "none") + ';" value="' + esc(l.fonteOutro || "") + '"/></td>' +
        '<td class="mono">' + esc(fmtCurrency(saldoApos)) + "</td>" +
        '<td><div class="lanc-row-actions">' +
        '<button class="icon-btn btn-save-lanc" data-parcela="' + p.id + '" data-lanc="' + l.id + '" type="button" title="Salvar">' + icon("check", 14) + "</button>" +
        '<button class="icon-btn btn-cancel-lanc" type="button" title="Cancelar">' + icon("x", 14) + "</button>" +
        "</div></td></tr>";
    }
    return '<tr data-lanc="' + l.id + '">' +

function wireLancamentosEvents(content) {
  content.querySelectorAll("[data-toggle]").forEach((el) => el.addEventListener("click", () => {
    const key = el.dataset.toggle;
    state.filters.lancMonthOpen = state.filters.lancMonthOpen === key ? null : key;
    renderAll();
  }));

  /* ---- Fonte "Outro" toggles (linha nova e linha em edição) ---- */
  content.querySelectorAll("select[id^='novo-fonte-'], select[id^='edit-fonte-']").forEach((sel) => {
    sel.addEventListener("change", (e) => {
      const outroInput = document.getElementById(sel.id.replace("fonte-", "fonte-outro-"));
      if (outroInput) outroInput.style.display = e.target.value === "Outro" ? "block" : "none";
    });
  });
  /* ---- Máscara de moeda: linha nova ---- */
  content.querySelectorAll("input[id^='novo-valor-']").forEach((inp) => attachCurrencyMask(inp, 0));
  content.querySelectorAll("input[id^='edit-valor-']").forEach((inp) => {
    const lancId = inp.id.replace("edit-valor-", "");
    let val = 0;
    state.parcelas.forEach((p) => (p.lancamentos || []).forEach((l) => { if (l.id === lancId) val = l.valorRecebido || 0; }));
    attachCurrencyMask(inp, val);
  });

  /* ---- Adicionar lançamento (linha nova) ---- */
  content.querySelectorAll(".btn-novo-lanc-add").forEach((el) => el.addEventListener("click", (e) => {
    e.stopPropagation();
    const pid = el.dataset.parcela;
    const p = state.parcelas.find((pp) => pp.id === pid);
    const data = document.getElementById("novo-data-" + pid).value;
    if (!data) { alert("Informe a data de efetivação."); return; }
    const valorInput = document.getElementById("novo-valor-" + pid);
    const valor = getCurrencyValue(valorInput);
    if (!valor) { alert("Informe o valor recebido."); return; }
    const fonteSel = document.getElementById("novo-fonte-" + pid).value;
    const fonteOutro = fonteSel === "Outro" ? document.getElementById("novo-fonte-outro-" + pid).value : "";
    if (!p.lancamentos) p.lancamentos = [];
    p.lancamentos.push({ id: uid("lanc"), dataEfetivacao: data, valorRecebido: valor, fonte: fonteSel, fonteOutro });
    persistir();
    renderAll();
  }));

  /* ---- Editar lançamento (inline) ---- */
  content.querySelectorAll(".btn-editlanc").forEach((el) => el.addEventListener("click", (e) => {
    e.stopPropagation();
    uiEditingLanc = { parcelaId: el.dataset.parcela, lancId: el.dataset.lanc };
    renderAll();
  }));
  content.querySelectorAll(".btn-cancel-lanc").forEach((el) => el.addEventListener("click", (e) => {
    e.stopPropagation();
    uiEditingLanc = null;
    renderAll();
  }));
  content.querySelectorAll(".btn-save-lanc").forEach((el) => el.addEventListener("click", (e) => {
    e.stopPropagation();
    const pid = el.dataset.parcela, lid = el.dataset.lanc;
    const p = state.parcelas.find((pp) => pp.id === pid);
    const l = (p.lancamentos || []).find((ll) => ll.id === lid);
    const data = document.getElementById("edit-data-" + lid).value;
    if (!data) { alert("Informe a data de efetivação."); return; }
    const valor = getCurrencyValue(document.getElementById("edit-valor-" + lid));
    const fonteSel = document.getElementById("edit-fonte-" + lid).value;
    const fonteOutro = fonteSel === "Outro" ? document.getElementById("edit-fonte-outro-" + lid).value : "";
    l.dataEfetivacao = data; l.valorRecebido = valor; l.fonte = fonteSel; l.fonteOutro = fonteOutro;
    uiEditingLanc = null;
    persistir();
    renderAll();
  }));
  content.querySelectorAll(".btn-dellanc").forEach((el) => el.addEventListener("click", (e) => {
    e.stopPropagation();
    if (!confirm("Excluir este recebimento?")) return;
    const p = state.parcelas.find((pp) => pp.id === el.dataset.parcela);
    p.lancamentos = (p.lancamentos || []).filter((ll) => ll.id !== el.dataset.lanc);
    persistir(); renderAll();
  }));

  /* ---- Editor de desconto por parcela (inline, sem modal) ---- */
  content.querySelectorAll(".btn-desconto-toggle").forEach((el) => el.addEventListener("click", (e) => {
    e.stopPropagation();
    const pid = el.dataset.parcela;
    if (uiDescontoOpenParcela === pid) { uiDescontoOpenParcela = null; }
    else {
      const p = state.parcelas.find((pp) => pp.id === pid);
      uiDescontoDraft = (p.descontos || []).filter((d) => !d.adiantamentoId).map((d) => Object.assign({}, d));
      uiDescontoOpenParcela = pid;
    }
    renderAll();
  }));
  wireDescontoEditorInputs(content);
  content.querySelectorAll(".btn-add-desconto-tipo").forEach((el) => el.addEventListener("click", (e) => {
    e.stopPropagation();
    uiDescontoDraft.push({ id: uid("desc"), tipo: DESCONTO_TIPOS[0], tipoOutro: "", valor: 0 });
    renderAll();
  }));
  content.querySelectorAll(".btn-rm-desconto").forEach((el) => el.addEventListener("click", (e) => {
    e.stopPropagation();
    uiDescontoDraft.splice(Number(el.dataset.idx), 1);
    renderAll();
  }));
  content.querySelectorAll(".btn-cancel-desconto").forEach((el) => el.addEventListener("click", (e) => {
    e.stopPropagation();
    uiDescontoOpenParcela = null;
    renderAll();
  }));
  content.querySelectorAll(".btn-save-desconto").forEach((el) => el.addEventListener("click", (e) => {
    e.stopPropagation();
    const p = state.parcelas.find((pp) => pp.id === el.dataset.parcela);
    p.descontos = (p.descontos || []).filter((d) => d.adiantamentoId).concat(uiDescontoDraft.filter((d) => d.valor > 0));
    uiDescontoOpenParcela = null;
    persistir();
    renderAll();
  }));
}

function wireDescontoEditorInputs(content) {
  content.querySelectorAll(".desc-tipo").forEach((sel) => sel.addEventListener("change", (e) => {
    e.stopPropagation();
    uiDescontoDraft[Number(sel.dataset.idx)].tipo = e.target.value;
    renderAll();
  }));
  content.querySelectorAll(".desc-tipo-outro").forEach((inp) => inp.addEventListener("input", (e) => {
    e.stopPropagation();
    uiDescontoDraft[Number(inp.dataset.idx)].tipoOutro = e.target.value;
  }));
  content.querySelectorAll(".desc-valor-wrap").forEach((inp) => {
    const idx = Number(inp.dataset.idx);
    attachCurrencyMask(inp, uiDescontoDraft[idx].valor || 0);
    inp.addEventListener("input", () => {
      uiDescontoDraft[idx].valor = getCurrencyValue(inp);
      const total = uiDescontoDraft.reduce((s, d) => s + (d.valor || 0), 0);
      const pid = uiDescontoOpenParcela;
      const totalEl = document.getElementById("desconto-total-" + pid);
      if (totalEl) totalEl.textContent = fmtCurrency(total);
    });
  });
}


/* ============================================================
   ADIANTAMENTOS
   ------------------------------------------------------------
   Repasse recebido adiantado, que será descontado em competências
   futuras. O valor NÃO entra em "Recebimentos": fica só aqui.
   Cada compensação cria sozinha um desconto do tipo "Adiantamento"
   na competência escolhida (e reduz o valor líquido a receber dela).
   Saldo a compensar = Valor adiantado − Σ compensações.
   ============================================================ */
function adiantTotais(a) {
  const comps = a.compensacoes || [];
  const compensado = comps.reduce((s, c) => s + (c.valor || 0), 0);
  return { valor: a.valor || 0, compensado, saldo: (a.valor || 0) - compensado };
}
function adiantResumo() {
  const r = { valor: 0, compensado: 0, saldo: 0 };
  state.adiantamentos.forEach((a) => { const t = adiantTotais(a); r.valor += t.valor; r.compensado += t.compensado; r.saldo += t.saldo; });
  return r;
}
/** Recria, nas parcelas, os descontos "Adiantamento" a partir dos registros de adiantamento. */
function reaplicarAdiantamentos() {
  state.parcelas.forEach((p) => { if (p.descontos) p.descontos = p.descontos.filter((d) => !d.adiantamentoId); });
  state.adiantamentos.forEach((a) => (a.compensacoes || []).forEach((c) => {
    const p = state.parcelas.find((x) => x.instrumentoId === a.instrumentoId && x.ano === c.ano && x.mes === c.mes);
    if (!p || !(c.valor > 0)) return;
    if (!p.descontos) p.descontos = [];
    p.descontos.push({ id: "adi_" + a.id + "_" + c.ano + "_" + c.mes, tipo: "Adiantamento", tipoOutro: "", valor: c.valor, adiantamentoId: a.id });
  }));
}
function compKey(c) { return c.ano + "-" + String(c.mes).padStart(2, "0"); }

let uiAdiDraft = null; // { id, instrumentoId, data, fonte, fonteOutro, valor, observacao, compensacoes:[{ano,mes,valor}] }

function renderAdiantamentosView(topbar, content) {
  topbar.innerHTML = topbarHtml("Adiantamentos", "Repasses recebidos adiantados, que serão descontados em competências futuras",
    exportPdfBtn() + '<button class="btn btn-primary" id="btn-novo-adi" type="button">' + icon("plus", 14) + "Novo adiantamento</button>");
  const r = adiantResumo();
  const lista = state.adiantamentos.slice().sort((a, b) => (b.data || "").localeCompare(a.data || ""));
  const rows = lista.map((a) => {
    const t = adiantTotais(a);
    const inst = state.instrumentos.find((i) => i.id === a.instrumentoId) || {};
    const chips = (a.compensacoes || []).slice().sort((x, y) => compKey(x).localeCompare(compKey(y))).map((c) => {
      const existe = state.parcelas.some((p) => p.instrumentoId === a.instrumentoId && p.ano === c.ano && p.mes === c.mes);
      return '<span class="parcela-chip"' + (existe ? "" : ' style="border-color:#f0c7ba;color:#b8480f;" title="Não há parcela nesta competência"') + ">" + MONTH_SHORT[c.mes - 1] + "/" + c.ano + " · " + esc(fmtCurrency(c.valor)) + "</span>";
    }).join("");
    return "<tr><td>" + fmtDateBR(a.data) + "</td><td>" + esc(inst.descricao || "—") + "</td><td>" + pill(a.fonte === "Outro" ? (a.fonteOutro || "Outro") : a.fonte, "info") +
      '</td><td class="mono">' + esc(fmtCurrency(t.valor)) + '</td><td class="mono">' + esc(fmtCurrency(t.compensado)) +
      '</td><td class="mono" style="font-weight:600;">' + esc(fmtCurrency(t.saldo)) + "</td><td>" + (t.saldo <= 0.005 ? pill("Compensado", "good") : pill("A compensar", "warn")) +
      '</td><td><div class="parcela-preview">' + (chips || "—") + "</div></td><td>" + esc(a.observacao || "") + "</td>" +
      '<td class="no-print" style="white-space:nowrap;"><button class="icon-btn btn-edit-adi" data-id="' + a.id + '" type="button">' + icon("pencil", 14) +
      '</button><button class="icon-btn danger btn-del-adi" data-id="' + a.id + '" type="button">' + icon("trash", 14) + "</button></td></tr>";
  }).join("");

  content.innerHTML =
    printHeader("Adiantamentos de Repasse", REL_ENTIDADE) +
    '<div class="kpi-row">' +
    kpiCard("Total adiantado", fmtCurrency(r.valor), "", COLORS.blue, "download") +
    kpiCard("Já compensado (descontado)", fmtCurrency(r.compensado), "", COLORS.teal, "check") +
    kpiCard("Saldo a compensar", fmtCurrency(r.saldo), "", COLORS.orange, "alert") +
    "</div>" +
    '<div class="rel-filtros">Cada compensação cria sozinha um desconto do tipo <b>Adiantamento</b> na competência escolhida, e reduz o valor líquido a receber dela. ' +
    "O valor adiantado não aparece em Recebimentos.</div>" +
    '<div class="panel" style="overflow-x:auto;"><table><thead><tr><th>Data</th><th>Repasse</th><th>Fonte</th><th>Valor adiantado</th><th>Compensado</th><th>Saldo a compensar</th><th>Situação</th><th>Competências descontadas</th><th>Observação</th><th class="no-print"></th></tr></thead><tbody>' +
    (rows || '<tr><td colspan="10" class="empty-state">Nenhum adiantamento registrado. Use "Novo adiantamento".</td></tr>') + "</tbody>" +
    (lista.length ? '<tfoot><tr><td colspan="3">Total</td><td class="mono">' + esc(fmtCurrency(r.valor)) + '</td><td class="mono">' + esc(fmtCurrency(r.compensado)) + '</td><td class="mono">' + esc(fmtCurrency(r.saldo)) + '</td><td colspan="4"></td></tr></tfoot>' : "") +
    "</table></div>";

  document.getElementById("btn-novo-adi").onclick = () => abrirAdiantamentoModal(null);
  wirePrintButton();
  content.querySelectorAll(".btn-edit-adi").forEach((b) => b.onclick = () => abrirAdiantamentoModal(state.adiantamentos.find((a) => a.id === b.dataset.id)));
  content.querySelectorAll(".btn-del-adi").forEach((b) => b.onclick = () => {
    const a = state.adiantamentos.find((x) => x.id === b.dataset.id); if (!a) return;
    if (!confirm("Excluir este adiantamento de " + fmtCurrency(a.valor) + "? Os descontos criados por ele nas competências também serão removidos.")) return;
    state.adiantamentos = state.adiantamentos.filter((x) => x.id !== a.id);
    persistir(); renderAll();
  });
}

function parcelasDoInstrumento(instId) {
  return state.parcelas.filter((p) => p.instrumentoId === instId).sort((a, b) => (a.ano - b.ano) || (a.mes - b.mes));
}

function abrirAdiantamentoModal(existing) {
  const instPadrao = state.instrumentos.length ? state.instrumentos[0].id : "";
  uiAdiDraft = existing ? JSON.parse(JSON.stringify(existing)) : {
    id: null, instrumentoId: instPadrao, data: hojeISO(), fonte: FONTE_OPCOES[0], fonteOutro: "", valor: 0, observacao: "", compensacoes: [],
  };
  const d = uiAdiDraft;
  const root = document.getElementById("modal-root");
  root.innerHTML =
    '<div class="modal-backdrop" id="modal-backdrop"><div class="modal">' +
    '<div class="modal-header"><div class="modal-title">' + (existing ? "Editar adiantamento" : "Novo adiantamento") + '</div>' +
    '<button class="icon-btn" id="modal-close" type="button">' + icon("x", 18) + "</button></div>" +
    '<div class="modal-body">' +
    field("Repasse (contrato / termo aditivo)", '<select class="input" id="a-inst">' +
      state.instrumentos.map((i) => '<option value="' + i.id + '"' + (i.id === d.instrumentoId ? " selected" : "") + ">" + esc(i.descricao) + "</option>").join("") + "</select>", { full: true }) +
    field("Data do recebimento", '<input class="input" type="date" id="a-data" value="' + esc(d.data) + '"/>') +
    field("Fonte de Recurso", '<select class="input" id="a-fonte">' + opcoesFonteHtml(d.fonte) + "</select>" +
      '<input class="input" id="a-fonte-outro" placeholder="Qual fonte?" style="margin-top:6px;display:' + (d.fonte === "Outro" ? "block" : "none") + ';" value="' + esc(d.fonteOutro || "") + '"/>') +
    field("Valor adiantado (R$)", '<input class="input" type="text" inputmode="decimal" id="a-valor"/>') +
    field("Observações", '<input class="input" id="a-obs" placeholder="Ex.: adiantamento referente ao processo SEI..." value="' + esc(d.observacao || "") + '"/>') +
    '<div class="field full"><div class="field-label">Competências em que será descontado</div><div id="a-comps"></div>' +
    '<div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;"><button class="btn btn-ghost btn-sm" id="a-add" type="button">' + icon("plus", 12) + "Adicionar competência</button>" +
    '<button class="btn btn-ghost btn-sm" id="a-dividir" type="button">Dividir o saldo igualmente nas competências</button></div>' +
    '<div class="field-hint" id="a-resumo" style="margin-top:8px;"></div></div>' +
    "</div>" +
    '<div class="modal-footer"><div></div><div style="display:flex;gap:8px;"><button class="btn btn-ghost" id="modal-cancel" type="button">Cancelar</button>' +
    '<button class="btn btn-primary" id="modal-save" type="button">' + icon("check", 14) + "Salvar</button></div></div></div></div>";

  const valorInput = document.getElementById("a-valor");
  attachCurrencyMask(valorInput, d.valor);

  function opcoesCompetencia(sel) {
    return parcelasDoInstrumento(d.instrumentoId).map((p) => {
      const k = p.ano + "-" + String(p.mes).padStart(2, "0");
      return '<option value="' + k + '"' + (k === sel ? " selected" : "") + ">" + MONTH_NAMES[p.mes - 1] + "/" + p.ano + "</option>";
    }).join("");
  }
  function atualizaResumo() {
    const comp = d.compensacoes.reduce((s, c) => s + (c.valor || 0), 0);
    const saldo = (d.valor || 0) - comp;
    document.getElementById("a-resumo").innerHTML = "Compensado: <b>" + esc(fmtCurrency(comp)) + "</b> · Saldo a compensar: <b" + (saldo < -0.005 ? ' style="color:#c0432a;"' : "") + ">" + esc(fmtCurrency(saldo)) + "</b>" +
      (saldo < -0.005 ? " — as compensações passam do valor adiantado." : "");
  }
  function desenhaComps() {
    const box = document.getElementById("a-comps");
    box.innerHTML = d.compensacoes.length ? d.compensacoes.map((c, i) =>
      '<div class="desconto-row" style="grid-template-columns:1fr 1fr 26px;margin-bottom:6px;"><select class="input mini a-comp-sel" data-i="' + i + '">' + opcoesCompetencia(compKey(c)) + "</select>" +
      '<input class="input mini a-comp-val" data-i="' + i + '" placeholder="Valor"/>' +
      '<button class="icon-btn danger a-comp-rm" data-i="' + i + '" type="button">' + icon("trash", 13) + "</button></div>").join("")
      : '<div class="lanc-empty" style="padding:4px 0;">Nenhuma competência escolhida ainda.</div>';
    box.querySelectorAll(".a-comp-sel").forEach((s) => s.addEventListener("change", () => {
      const [ano, mes] = s.value.split("-").map(Number); const c = d.compensacoes[Number(s.dataset.i)]; c.ano = ano; c.mes = mes;
    }));
    box.querySelectorAll(".a-comp-val").forEach((inp) => {
      const c = d.compensacoes[Number(inp.dataset.i)];
      attachCurrencyMask(inp, c.valor || 0);
      inp.addEventListener("input", () => { c.valor = getCurrencyValue(inp); atualizaResumo(); });
    });
    box.querySelectorAll(".a-comp-rm").forEach((b) => b.onclick = () => { d.compensacoes.splice(Number(b.dataset.i), 1); desenhaComps(); atualizaResumo(); });
    atualizaResumo();
  }
  desenhaComps();
  valorInput.addEventListener("input", () => { d.valor = getCurrencyValue(valorInput); atualizaResumo(); });
  document.getElementById("a-fonte").addEventListener("change", (e) => { d.fonte = e.target.value; document.getElementById("a-fonte-outro").style.display = d.fonte === "Outro" ? "block" : "none"; });
  document.getElementById("a-inst").addEventListener("change", (e) => { d.instrumentoId = e.target.value; d.compensacoes = []; desenhaComps(); });
  document.getElementById("a-add").onclick = () => {
    const ps = parcelasDoInstrumento(d.instrumentoId);
    if (!ps.length) { alert("Este repasse não tem parcelas."); return; }
    const usadas = new Set(d.compensacoes.map(compKey));
    const base = ps.find((p) => !usadas.has(p.ano + "-" + String(p.mes).padStart(2, "0"))) || ps[0];
    d.compensacoes.push({ ano: base.ano, mes: base.mes, valor: 0 });
    desenhaComps();
  };
  document.getElementById("a-dividir").onclick = () => {
    const n = d.compensacoes.length;
    if (!n) { alert("Adicione as competências primeiro."); return; }
    const cents = Math.round((d.valor || 0) * 100), base = Math.floor(cents / n);
    d.compensacoes.forEach((c, i) => { c.valor = (i === n - 1 ? cents - base * (n - 1) : base) / 100; });
    desenhaComps();
  };
  document.getElementById("modal-close").onclick = closeModal;
  document.getElementById("modal-cancel").onclick = closeModal;

    d.data = document.getElementById("a-data").value;
    d.fonteOutro = document.getElementById("a-fonte-outro").value.trim();
    d.observacao = document.getElementById("a-obs").value.trim();
    d.valor = getCurrencyValue(valorInput);
    if (!d.instrumentoId) { alert("Cadastre um repasse previsto antes."); return; }
    if (!d.data) { alert("Informe a data do recebimento."); return; }
    if (!(d.valor > 0)) { alert("Informe o valor adiantado."); return; }
    if (d.fonte === "Outro" && !d.fonteOutro) { alert("Informe qual é a fonte."); return; }
    const comps = d.compensacoes.filter((c) => c.valor > 0);
    const chaves = comps.map(compKey);
    if (new Set(chaves).size !== chaves.length) { alert("Há competência repetida. Junte os valores em uma só linha."); return; }
    const soma = comps.reduce((s, c) => s + c.valor, 0);
    if (soma - d.valor > 0.005) { alert("As compensações (" + fmtCurrency(soma) + ") passam do valor adiantado (" + fmtCurrency(d.valor) + ")."); return; }
    const novo = { id: d.id || uid("adi"), instrumentoId: d.instrumentoId, data: d.data, fonte: d.fonte, fonteOutro: d.fonte === "Outro" ? d.fonteOutro : "", valor: d.valor, observacao: d.observacao, compensacoes: comps };
    if (d.id) state.adiantamentos = state.adiantamentos.map((a) => (a.id === d.id ? novo : a)); else state.adiantamentos.push(novo);
    persistir(); closeModal(); renderAll();
  };
}

/** Atualiza (no mesmo array) a lista usada nos seletores: fontes ativas + "Não informado" + "Outro". */
