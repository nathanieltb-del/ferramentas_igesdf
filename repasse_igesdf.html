/* ============================================================
   EXTRATO DE RECEBIMENTOS (estilo extrato bancário)
   ------------------------------------------------------------
   Lista cronológica de créditos, com saldo acumulado.
   Saldo anterior = tudo que foi recebido antes da data inicial.
   Saldo final = Saldo anterior + créditos do período.
   ============================================================ */
function extratoEntradas(f) {
  const out = [];
  state.parcelas.forEach((p) => (p.lancamentos || []).forEach((l) => {
    const inst = instrumentoDe(p) || {};
    if (f.instrumentoId && p.instrumentoId !== f.instrumentoId) return;
    if (f.fonte && fonteLabel(l) !== f.fonte) return;
    if (f.comp && f.comp !== p.ano + "-" + String(p.mes).padStart(2, "0")) return;
    out.push({ data: l.dataEfetivacao || "", hist: "Repasse recebido — " + (inst.descricao || "—"), comp: fmtCompetenciaTxt(p.mes, p.ano), fonte: fonteLabel(l), valor: l.valorRecebido || 0, sei: inst.processoSei || "" });
  }));
  if (f.incluirAdi && !f.comp) {
    state.adiantamentos.forEach((a) => {
      const inst = state.instrumentos.find((i) => i.id === a.instrumentoId) || {};
      if (f.instrumentoId && a.instrumentoId !== f.instrumentoId) return;
      const fl = a.fonte === "Outro" ? (a.fonteOutro || "Outro") : a.fonte;
      if (f.fonte && fl !== f.fonte) return;
      out.push({ data: a.data || "", hist: "Adiantamento recebido — " + (inst.descricao || "—") + (a.observacao ? " (" + a.observacao + ")" : ""), comp: "Adiantamento", fonte: fl, valor: a.valor || 0, sei: "" });
    });
  }
  return out.sort((a, b) => a.data.localeCompare(b.data) || a.hist.localeCompare(b.hist));
}

function textoParaNumero(t) {
  const m = String(t).replace(/ /g, " ").trim().match(/^(-)?R\$\s*(-)?([\d.]+),(\d{2})$/);
  if (!m) return null;
  const n = Number(m[3].replace(/\./g, "") + "." + m[4]);
  return (m[1] || m[2]) ? -n : n;
}
function exportarXLSX() {
  loadSheetJS(() => {
    const aoa = [];
    const t = document.querySelector("#content .print-header .ph-title");
    aoa.push([t ? t.textContent.trim() : "Relatório"]);
    aoa.push(["Instituto de Gestão Estratégica de Saúde do Distrito Federal — emitido em " + new Date().toLocaleDateString("pt-BR")]);
    const filtros = document.querySelector("#content .rel-filtros");

    kpis.forEach((k) => { const v = k.querySelector(".kpi-value").textContent; const n = textoParaNumero(v); aoa.push([k.querySelector(".kpi-label").textContent.trim(), n === null ? v : n]); });
    if (kpis.length) aoa.push([]);
    document.querySelectorAll("#content .panel").forEach((panel) => {
      const ph = panel.querySelector(".panel-header");
      if (ph && !ph.closest("table")) aoa.push([ph.innerText.replace(/\s*\n+\s*/g, "  ")]);
      panel.querySelectorAll("table").forEach((tb) => {
        [...tb.rows].forEach((tr) => {

          if (!cels.length) return;
          const linha = [];
          cels.forEach((c) => {

            const n = textoParaNumero(txt);
            linha.push(n === null ? (txt === "—" ? "" : txt) : n);
            for (let i = 1; i < (c.colSpan || 1); i++) linha.push("");
          });
          aoa.push(linha);
        });
      });
      aoa.push([]);
    });
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    const larg = [];
    aoa.forEach((r) => r.forEach((v, i) => { const l = typeof v === "number" ? 16 : Math.min(String(v).length + 2, 60); larg[i] = Math.max(larg[i] || 10, l); }));
    ws["!cols"] = larg.map((w) => ({ wch: w }));
    Object.keys(ws).forEach((k) => { if (k[0] !== "!" && ws[k].t === "n") ws[k].z = "#,##0.00"; });
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, (t ? t.textContent : "Relatório").replace(/[\\\/\?\*\[\]:]/g, " ").slice(0, 31));
    const base = (t ? t.textContent : "relatorio").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-zA-Z0-9]+/g, "_").replace(/^_|_$/g, "").toLowerCase().slice(0, 50);
    XLSX.writeFile(wb, base + "_" + hojeISO() + ".xlsx");
  });
}

/* ============================================================
   POSIÇÃO CONTÁBIL (DATA DE CORTE) — usada nos relatórios
   ------------------------------------------------------------
   Regra: a contabilidade é estática. Para a posição em uma data:
   • Previsto e Descontos entram por inteiro na sua competência.
   • Só entram como "Recebido" os recebimentos com data de
     efetivação ATÉ a data de corte.
   • Recebimentos feitos DEPOIS da data de corte aparecem à parte.
   • Saldo na data de corte = Previsto − Descontos − Recebido até o corte.
   ============================================================ */
function hojeISO() { return dateToISO(new Date()); }

function posParcela(p, f) {
  const lancs = (p.lancamentos || []).filter((l) => !f.fonte || fonteLabel(l) === f.fonte);
  let ate = 0, depois = 0, qtdAte = 0;
  lancs.forEach((l) => {
    const v = l.valorRecebido || 0;
    if (!l.dataEfetivacao || l.dataEfetivacao <= f.corte) { ate += v; qtdAte++; } else { depois += v; }
  });
  const previsto = p.valorPrevisto || 0;
  const desconto = descontoTotalParcela(p);
  const liquido = previsto - desconto;
  const saldo = liquido - ate;
  const status = qtdAte === 0 ? "pendente" : saldo > 0.005 ? "parcial" : "quitado";
  return { previsto, desconto, liquido, ate, depois, saldo, status };
}
function posSoma(parcelas, f) {
  const t = { previsto: 0, desconto: 0, liquido: 0, ate: 0, depois: 0, saldo: 0 };
  parcelas.forEach((p) => {
    const x = posParcela(p, f);
    t.previsto += x.previsto; t.desconto += x.desconto; t.liquido += x.liquido; t.ate += x.ate; t.depois += x.depois; t.saldo += x.saldo;
  });
  return t;
}
function parcelasRel(ano, f, mesUnico) {
  return parcelasDoAno(ano).filter((p) => {
    if (mesUnico) { if (p.mes !== mesUnico) return false; } else if (p.mes < f.mesIni || p.mes > f.mesFim) return false;
    if (f.instrumentoId && p.instrumentoId !== f.instrumentoId) return false;
    if (f.status && posParcela(p, f).status !== f.status) return false;
    return true;
  });
}

  }
  h += '<div class="filter-field"><label>Data de corte (posição em)</label><input class="input" type="date" id="rf-corte" value="' + esc(f.corte) + '"/></div>' +
    '<div class="filter-field"><label>Instrumento / Contrato</label><select class="input" id="rf-instrumento"><option value="">Todos</option>' +

function wireRelFilters() {

  bind("rf-mes", (v) => { state.filters.mensalMes = Number(v); });
  bind("rf-corte", (v) => { f.corte = v || hojeISO(); });
  bind("rf-instrumento", (v) => { f.instrumentoId = v; });
  bind("rf-fonte", (v) => { f.fonte = v; });
  bind("rf-status", (v) => { f.status = v; });
  bind("rf-mesini", (v) => { f.mesIni = Number(v); if (f.mesFim < f.mesIni) f.mesFim = f.mesIni; });
  bind("rf-mesfim", (v) => { f.mesFim = Number(v); if (f.mesIni > f.mesFim) f.mesIni = f.mesFim; });
  const fim = document.getElementById("rf-fim-ano"); if (fim) fim.onclick = () => { f.corte = state.anoAtual + "-12-31"; renderAll(); };
  const lim = document.getElementById("rf-limpar"); if (lim) lim.onclick = () => { state.relFiltros = { corte: hojeISO(), instrumentoId: "", fonte: "", status: "", mesIni: 1, mesFim: 12 }; renderAll(); };

/* ============================================================
   VIEW: IMPORTAÇÃO (Excel)
   ------------------------------------------------------------
   Carrega a biblioteca SheetJS via CDN sob demanda (só quando o
   usuário entra nesta tela) para não deixar o resto do sistema
   dependente de rede. Lê 3 abas (Repasses Previstos, Descontos,
   Recebimentos), valida linha a linha e só grava as válidas.
   ============================================================ */
let uiImportLibState = "idle"; // idle | loading | ready | erro
let uiImportData = null; // { previstos:[], descontos:[], lancamentos:[] } (linhas já validadas)
let uiImportResultado = null; // resumo pós-confirmação

function loadSheetJS(callback) {
  if (window.XLSX) { uiImportLibState = "ready"; callback(); return; }
  if (uiImportLibState === "loading") return;
  uiImportLibState = "loading";
  renderAll();
  const s = document.createElement("script");
  s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
  s.onload = () => { uiImportLibState = "ready"; callback(); };
  s.onerror = () => { uiImportLibState = "erro"; renderAll(); };
  document.head.appendChild(s);
}

function normStr(v) { return String(v === null || v === undefined ? "" : v).trim(); }
function normKey(v) { return normStr(v).toLowerCase(); }
function toNumber(v) {
  if (typeof v === "number") return v;
  if (!v) return NaN;
  let s = String(v).trim().replace(/[R$\s]/g, "");
  if (!s) return NaN;
  if (s.includes(",")) {
    // Formato BR: ponto = separador de milhar, vírgula = separador decimal (ex: "6.000.000,00")
    s = s.replace(/\./g, "").replace(",", ".");
  } else if (s.includes(".")) {
    // Sem vírgula: "6.000.000" (milhar, sem centavos) ou "1500.5" (decimal solto).
    const partes = s.split(".");
    const ultima = partes[partes.length - 1];
    if (partes.length > 2 || ultima.length === 3) s = partes.join(""); // trata pontos como milhar
  }
  return Number(s);
}
function parseCompetencia(v) {
  if (v instanceof Date) return { mes: v.getMonth() + 1, ano: v.getFullYear() };
  const s = normStr(v);
  const m = s.match(/^(\d{1,2})[\/\-](\d{4})$/);
  if (!m) return null;
  const mes = Number(m[1]), ano = Number(m[2]);
  if (mes < 1 || mes > 12) return null;
  return { mes, ano };
}
function parseDataCell(v) {
  if (v instanceof Date) return dateToISO(v);
  const s = normStr(v);
  const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if (!m) return null;
  const d = Number(m[1]), mo = Number(m[2]), y = Number(m[3]);
  if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
  return y + "-" + String(mo).padStart(2, "0") + "-" + String(d).padStart(2, "0");
}
function mesesRollover(mesInicio, anoInicio, numParcelas) {
  const out = [];
  let ano = anoInicio, mes = mesInicio;
  for (let i = 0; i < numParcelas; i++) {
    out.push({ mes, ano });
    mes++; if (mes > 12) { mes = 1; ano++; }
  }
  return out;
}

const COL_DESC_REPASSE = "Descrição do repasse";

function nomeArquivoBackup() { return "backup_repasses_" + hojeISO() + ".xlsx"; }
function fmtCompetenciaTxt(mes, ano) { return String(mes).padStart(2, "0") + "/" + ano; }
function fmtDataTxt(iso) { return iso ? fmtDateBR(iso) : ""; }

/** Monta as 3 abas no mesmo formato do modelo de importação. */

  ].concat(dados.descontos));
  const wsRecebimentos = XLSX.utils.aoa_to_sheet([

  ].concat(dados.adiantamentos || []));
  const wsFontes = XLSX.utils.aoa_to_sheet([["Fonte", "Conta / descrição", "Ativa (Sim/Não)"]].concat(dados.fontes || []));

  XLSX.utils.book_append_sheet(wb, wsFontes, "Fontes de Recurso");

}

      return [inst.descricao || "", fmtDataTxt(a.data), a.fonte === "Outro" ? (a.fonteOutro || "Outro") : a.fonte, a.valor, comps, a.observacao || ""];

/* ---------- Casamento da linha com o repasse (instrumento) e a parcela ---------- */
function instCandidatos(descKey, unidadeKey, virtuais) {
  const reais = state.instrumentos.filter((i) => descKey ? normKey(i.descricao) === descKey : normKey(i.unidade || i.descricao) === unidadeKey)
    .map((i) => ({ tipo: "real", inst: i }));
  const virt = virtuais.filter((v) => descKey ? normKey(v.row.descricao) === descKey : normKey(v.row.unidade || v.row.descricao) === unidadeKey)
    .map((v) => ({ tipo: "virtual", v }));
  return reais.concat(virt);
}
function resolverAlvo(row, virtuais) {
  const descKey = normKey(row.descRepasse), unidadeKey = normKey(row.unidade);
  if (!descKey && !unidadeKey) return { erro: "Informe a Descrição do repasse (ou a Unidade/Contrato)" };
  const cands = instCandidatos(descKey, unidadeKey, virtuais);
  if (!cands.length) return { erro: "Repasse não encontrado: " + (row.descRepasse || row.unidade) };
  if (cands.length > 1) return { erro: "Mais de um repasse com este nome (" + (row.descRepasse || row.unidade) + "). Preencha a coluna \"" + COL_DESC_REPASSE + "\" com o nome exato" };
  const c = cands[0];
  if (c.tipo === "real") {
    const p = state.parcelas.find((x) => x.instrumentoId === c.inst.id && x.mes === row.competencia.mes && x.ano === row.competencia.ano);
    return p ? { parcela: p } : { erro: "O repasse não tem parcela em " + fmtCompetenciaTxt(row.competencia.mes, row.competencia.ano) };
  }
  const existe = mesesRollover(c.v.row.mesInicial, c.v.row.anoInicial, c.v.row.numParcelas).some((m) => m.mes === row.competencia.mes && m.ano === row.competencia.ano);
  return existe ? { virtual: c.v } : { erro: "O repasse não tem parcela em " + fmtCompetenciaTxt(row.competencia.mes, row.competencia.ano) };
}
function pegaAba(wb, nomes) { for (const n of nomes) if (wb.Sheets[n]) return wb.Sheets[n]; return null; }

function parseArquivoImportacao(wb) {
  const previstos = [], descontos = [], lancamentos = [];
  const fontesImp = [];
  const shFontes = wb.Sheets["Fontes de Recurso"];
  if (shFontes) {
    XLSX.utils.sheet_to_json(shFontes, { defval: "" }).forEach((r, i) => {
      const nome = normStr(r["Fonte"]); const erros = [], avisos = [];
      if (!nome) erros.push("Nome da fonte vazio");
      let dup = false;
      if (nome && (state.fontes.some((x) => normKey(x.nome) === normKey(nome)) || fontesImp.some((x) => normKey(x.nome) === normKey(nome)))) { dup = true; avisos.push("Fonte já cadastrada — será ignorada"); }
      fontesImp.push({ linha: i + 2, nome, conta: normStr(r["Conta / descrição"]), ativa: normKey(r["Ativa (Sim/Não)"]) !== "não" && normKey(r["Ativa (Sim/Não)"]) !== "nao", dup, avisos, valid: erros.length === 0 && !dup, erros });
    });
  }

  const shPrevistos = wb.Sheets["Repasses Previstos"];
  if (shPrevistos) {
    XLSX.utils.sheet_to_json(shPrevistos, { defval: "" }).forEach((r, i) => {
      const linha = i + 2;
      const descricao = normStr(r["Descrição"]);
      const valorTotal = toNumber(r["Valor Total"]);
      const numParcelas = Math.round(toNumber(r["Nº de Parcelas"]));
      const mesInicial = Math.round(toNumber(r["Mês Inicial"]));
      const anoInicial = Math.round(toNumber(r["Ano Inicial"]));
      const unidade = normStr(r["Unidade/Contrato"]) || descricao;
      const tipo = normStr(r["Tipo"]) || TIPOS_INSTRUMENTO_BASE[0];
      const processoSei = normStr(r["Processo SEI"]);
      const observacoes = normStr(r["Observações"]);
      const erros = [], avisos = [];
      if (!descricao) erros.push("Descrição vazia");
      if (!(valorTotal > 0)) erros.push("Valor Total inválido");
      if (!(numParcelas >= 1)) erros.push("Nº de Parcelas inválido");
      if (!(mesInicial >= 1 && mesInicial <= 12)) erros.push("Mês Inicial inválido (use 1–12)");
      if (!(anoInicial >= 2000 && anoInicial <= 2100)) erros.push("Ano Inicial inválido");
      let dup = false;
      if (descricao && state.instrumentos.some((x) => normKey(x.descricao) === normKey(descricao))) { dup = true; avisos.push("Já existe um repasse com esta descrição — será ignorado"); }
      if (descricao && previstos.some((x) => normKey(x.descricao) === normKey(descricao))) { dup = true; avisos.push("Descrição repetida no arquivo — será ignorada"); }
      previstos.push({ linha, tipo, descricao, valorTotal, numParcelas, mesInicial, anoInicial, unidade, processoSei, observacoes, dup, avisos, valid: erros.length === 0 && !dup, erros });
    });
  }
  const virtuais = previstos.filter((p) => p.valid).map((row) => ({ row }));

  /* Duplicidade com multiplicidade: a n-ésima linha igual só é duplicada se já existirem n registros iguais. */
  const contagem = {};
  function ehDuplicado(chave, jaExistentes) {
    contagem[chave] = (contagem[chave] || 0) + 1;
    return contagem[chave] <= jaExistentes;
  }

  const shDescontos = wb.Sheets["Descontos"];
  if (shDescontos) {
    XLSX.utils.sheet_to_json(shDescontos, { defval: "" }).forEach((r, i) => {
      const linha = i + 2;
      const descRepasse = normStr(r[COL_DESC_REPASSE]);
      const unidade = normStr(r["Unidade/Contrato"]);
      const comp = parseCompetencia(r["Competência (MM/AAAA)"]);
      const tipoRaw = normStr(r["Tipo de Desconto"]);
      const valor = toNumber(r["Valor"]);
      const tipoMatch = DESCONTO_TIPOS.find((t) => normKey(t) === normKey(tipoRaw));
      const tipo = tipoMatch || "Outro";
      const tipoOutro = tipoMatch ? "" : tipoRaw;
      const erros = [], avisos = [];
      if (!comp) erros.push("Competência inválida (use MM/AAAA)");
      if (!(valor > 0)) erros.push("Valor inválido");
      if (!tipoRaw) erros.push("Tipo de Desconto vazio");
      const row = { linha, descRepasse, unidade, competencia: comp, tipo, tipoOutro, valor };
      let alvo = null, dup = false;
      if (comp) {
        alvo = resolverAlvo(row, virtuais);
        if (alvo.erro) erros.push(alvo.erro);
        else if (alvo.parcela && !erros.length) {
          const ja = (alvo.parcela.descontos || []).filter((d) => normKey(descontoTipoLabel(d)) === normKey(tipoOutro || tipo) && Math.abs(d.valor - valor) < 0.005).length;
          if (ehDuplicado("D|" + alvo.parcela.id + "|" + normKey(tipoOutro || tipo) + "|" + valor.toFixed(2), ja)) { dup = true; avisos.push("Desconto idêntico já cadastrado — será ignorado"); }
        }
      }
      descontos.push(Object.assign(row, { alvo, dup, avisos, valid: erros.length === 0 && !dup, erros }));
    });
  }

  const shRec = pegaAba(wb, ["Recebimentos", "Lançamentos"]); // aceita o nome antigo da aba
  if (shRec) {
    XLSX.utils.sheet_to_json(shRec, { defval: "" }).forEach((r, i) => {
      const linha = i + 2;
      const descRepasse = normStr(r[COL_DESC_REPASSE]);
      const unidade = normStr(r["Unidade/Contrato"]);
      const comp = parseCompetencia(r["Competência (MM/AAAA)"]);
      const dataEfetivacao = parseDataCell(r["Data de Efetivação"]);
      const valorRecebido = toNumber(r["Valor Recebido (líquido)"]);
      const fonteRaw = normStr(r["Fonte"]);
      const fonteMatch = fontesNomesTodos().concat(fontesImp.map((x) => x.nome)).find((f) => f && normKey(f) === normKey(fonteRaw));
      const fonte = fonteMatch || "Outro";
      const fonteOutro = fonteMatch ? "" : fonteRaw;
      const erros = [], avisos = [];
      if (!comp) erros.push("Competência inválida (use MM/AAAA)");
      if (!dataEfetivacao) erros.push("Data de Efetivação inválida (use DD/MM/AAAA)");
      if (!(valorRecebido > 0)) erros.push("Valor Recebido inválido");
      if (!fonteRaw) erros.push("Fonte vazia");
      const row = { linha, descRepasse, unidade, competencia: comp, dataEfetivacao, valorRecebido, fonte, fonteOutro };
      let alvo = null, dup = false;
      if (comp) {
        alvo = resolverAlvo(row, virtuais);
        if (alvo.erro) erros.push(alvo.erro);
        else if (alvo.parcela && !erros.length) {
          const ja = (alvo.parcela.lancamentos || []).filter((l) => l.dataEfetivacao === dataEfetivacao && Math.abs(l.valorRecebido - valorRecebido) < 0.005 && normKey(fonteLabel(l)) === normKey(fonteOutro || fonte)).length;
          if (ehDuplicado("R|" + alvo.parcela.id + "|" + dataEfetivacao + "|" + valorRecebido.toFixed(2) + "|" + normKey(fonteOutro || fonte), ja)) { dup = true; avisos.push("Recebimento idêntico já cadastrado — será ignorado"); }
        }
      }
      lancamentos.push(Object.assign(row, { alvo, dup, avisos, valid: erros.length === 0 && !dup, erros }));
    });
  }
  const adiantamentos = [];
  const shAdi = wb.Sheets["Adiantamentos"];
  if (shAdi) {
    XLSX.utils.sheet_to_json(shAdi, { defval: "" }).forEach((r, i) => {
      const linha = i + 2;
      const descRepasse = normStr(r[COL_DESC_REPASSE]);
      const data = parseDataCell(r["Data do recebimento"]);
      const fonteRaw = normStr(r["Fonte"]);
      const fonteMatch = fontesNomesTodos().concat(fontesImp.map((x) => x.nome)).find((f) => f && normKey(f) === normKey(fonteRaw));
      const fonte = fonteMatch || "Outro", fonteOutro = fonteMatch ? "" : fonteRaw;
      const valor = toNumber(r["Valor adiantado"]);
      const observacao = normStr(r["Observações"]);
      const erros = [], avisos = [];
      if (!descRepasse) erros.push("Descrição do repasse vazia");
      if (!data) erros.push("Data do recebimento inválida (use DD/MM/AAAA)");
      if (!(valor > 0)) erros.push("Valor adiantado inválido");
      if (!fonteRaw) erros.push("Fonte vazia");
      let alvo = null; const compensacoes = [];
      if (descRepasse) {
        const cands = instCandidatos(normKey(descRepasse), "", virtuais);
        if (!cands.length) erros.push("Repasse não encontrado: " + descRepasse);
        else if (cands.length > 1) erros.push("Mais de um repasse com este nome: " + descRepasse);
        else alvo = cands[0];
      }
      normStr(r["Compensações (MM/AAAA:valor; ...)"]).split(";").map((x) => x.trim()).filter(Boolean).forEach((trecho) => {
        const [c, v] = trecho.split(":").map((x) => x.trim());
        const comp = parseCompetencia(c), val = toNumber(v);
        if (!comp || !(val > 0)) { erros.push("Compensação inválida: \"" + trecho + "\" (use MM/AAAA:valor)"); return; }
        if (alvo) {
          const existe = alvo.tipo === "real"
            ? state.parcelas.some((p) => p.instrumentoId === alvo.inst.id && p.mes === comp.mes && p.ano === comp.ano)
            : mesesRollover(alvo.v.row.mesInicial, alvo.v.row.anoInicial, alvo.v.row.numParcelas).some((m) => m.mes === comp.mes && m.ano === comp.ano);
          if (!existe) { erros.push("O repasse não tem parcela em " + fmtCompetenciaTxt(comp.mes, comp.ano)); return; }
        }
        compensacoes.push({ ano: comp.ano, mes: comp.mes, valor: val });
      });
      if (new Set(compensacoes.map(compKey)).size !== compensacoes.length) erros.push("Competência repetida nas compensações");
      if (compensacoes.reduce((s, c) => s + c.valor, 0) - (valor || 0) > 0.005) erros.push("As compensações passam do valor adiantado");
      let dup = false;
      if (alvo && alvo.tipo === "real" && !erros.length) {
        const ja = state.adiantamentos.filter((a) => a.instrumentoId === alvo.inst.id && a.data === data && Math.abs(a.valor - valor) < 0.005 && normKey(a.fonte === "Outro" ? a.fonteOutro : a.fonte) === normKey(fonteOutro || fonte)).length;
        if (ehDuplicado("A|" + alvo.inst.id + "|" + data + "|" + valor.toFixed(2) + "|" + normKey(fonteOutro || fonte), ja)) { dup = true; avisos.push("Adiantamento idêntico já cadastrado — será ignorado"); }
      }
      adiantamentos.push({ linha, descRepasse, data, fonte, fonteOutro, valor, observacao, compensacoes, alvo, dup, avisos, valid: erros.length === 0 && !dup, erros });
    });
  }
  return { previstos, descontos, lancamentos, adiantamentos, fontes: fontesImp };
}

function confirmarImportacao() {
  if (!uiImportData) return;
  const previstosValidos = uiImportData.previstos.filter((p) => p.valid);
  const descontosValidos = uiImportData.descontos.filter((d) => d.valid);
  const lancamentosValidos = uiImportData.lancamentos.filter((l) => l.valid);
  const adiantamentosValidos = (uiImportData.adiantamentos || []).filter((a) => a.valid);
  const instPorLinha = new Map();
  const fontesValidas = (uiImportData.fontes || []).filter((x) => x.valid);
  fontesValidas.forEach((x) => state.fontes.push({ id: uid("fonte"), nome: x.nome, conta: x.conta, ativa: x.ativa }));
  atualizarFonteOpcoes();

  previstosValidos.forEach((row) => {
    if (!tiposDisponiveis().includes(row.tipo)) registrarTipoCustom(row.tipo);
    const inst = {
      id: uid("inst"), tipo: row.tipo, descricao: row.descricao, valorTotal: row.valorTotal,
      numParcelas: row.numParcelas, mesInicio: row.mesInicial, anoInicio: row.anoInicial,
      unidade: row.unidade, processoSei: row.processoSei, observacoes: row.observacoes,
    };
    instPorLinha.set(row, inst);
    state.instrumentos.push(inst);
    state.parcelas = state.parcelas.concat(gerarParcelas(inst));
  });
  function parcelaDe(row) {
    if (row.alvo.parcela) return row.alvo.parcela;
    const inst = instPorLinha.get(row.alvo.virtual.row);
    return inst ? state.parcelas.find((p) => p.instrumentoId === inst.id && p.mes === row.competencia.mes && p.ano === row.competencia.ano) : null;
  }

  let descOk = 0, lancOk = 0;
  descontosValidos.forEach((row) => {
    const p = parcelaDe(row); if (!p) return;
    if (!p.descontos) p.descontos = [];
    p.descontos.push({ id: uid("desc"), tipo: row.tipo, tipoOutro: row.tipoOutro, valor: row.valor });
    descOk++;
  });
  lancamentosValidos.forEach((row) => {
    const p = parcelaDe(row); if (!p) return;
    if (!p.lancamentos) p.lancamentos = [];
    p.lancamentos.push({ id: uid("lanc"), dataEfetivacao: row.dataEfetivacao, valorRecebido: row.valorRecebido, fonte: row.fonte, fonteOutro: row.fonteOutro });
    lancOk++;
  });

  let adiOk = 0;
  adiantamentosValidos.forEach((row) => {
    const instId = row.alvo.tipo === "real" ? row.alvo.inst.id : (instPorLinha.get(row.alvo.v.row) || {}).id;
    if (!instId) return;
    state.adiantamentos.push({ id: uid("adi"), instrumentoId: instId, data: row.data, fonte: row.fonte, fonteOutro: row.fonteOutro, valor: row.valor, observacao: row.observacao, compensacoes: row.compensacoes });
    adiOk++;
  });
  persistir();
  const ign = uiImportData.previstos.concat(uiImportData.descontos, uiImportData.lancamentos, uiImportData.adiantamentos || [], uiImportData.fontes || []).filter((r) => r.dup).length;
  uiImportResultado = { previstos: previstosValidos.length, descontos: descOk, lancamentos: lancOk, adiantamentos: adiOk, ignorados: ign };
  uiImportData = null;
  if (previstosValidos.length) state.anoAtual = previstosValidos[0].anoInicial;
  renderAll();
}

function tabelaImportHtml(titulo, linhas, colunas) {
  if (!linhas.length) return "";
  const validas = linhas.filter((l) => l.valid).length;
  const dups = linhas.filter((l) => l.dup).length;
  const rows = linhas.map((l) =>
    "<tr>" + "<td>" + (l.dup ? pill("Duplicado", "warn") : pill(l.valid ? "OK" : "Erro", l.valid ? "good" : "bad")) + "</td>" +
    "<td>" + l.linha + "</td>" +
    colunas.map((c) => "<td>" + esc(c.get(l)) + "</td>").join("") +
    '<td style="color:' + (l.dup ? "#b8480f" : "#c0432a") + ';font-size:11.5px;">' + esc(l.erros.concat(l.avisos || []).join("; ")) + "</td></tr>"
  ).join("");
  return '<div class="panel" style="margin-bottom:14px;"><div class="panel-header" style="display:flex;justify-content:space-between;">' +
    "<span>" + esc(titulo) + "</span><span>" + (dups ? pill(dups + " duplicada(s) — serão ignoradas", "warn") + " " : "") +
    pill(validas + " de " + linhas.length + " serão gravadas", validas === linhas.length ? "good" : "warn") + "</span></div>" +
    '<div style="overflow-x:auto;"><table><thead><tr><th>Status</th><th>Linha</th>' + colunas.map((c) => "<th>" + esc(c.label) + "</th>").join("") + "<th>Motivo</th></tr></thead>" +
    "<tbody>" + rows + "</tbody></table></div></div>";
}

function renderImportarView(topbar, content) {
  topbar.innerHTML = topbarHtml("Importação e Backup", "Suba dados de uma planilha Excel ou baixe um backup completo no mesmo formato", "");

  if (uiImportLibState === "erro") {
    content.innerHTML = '<div class="panel" style="padding:16px 18px;background:#fde7dc;border-color:#f0c7ba;">' +
      "Não foi possível carregar a biblioteca de leitura de Excel (falha ao acessar o CDN). Verifique sua conexão e tente novamente." +
      '<div style="margin-top:10px;"><button class="btn btn-dark" id="btn-retry-lib" type="button">Tentar novamente</button></div></div>';
    document.getElementById("btn-retry-lib").onclick = () => { uiImportLibState = "idle"; renderAll(); };
    return;
  }

  let html = '<div class="panel" style="padding:16px 18px;margin-bottom:16px;">' +
    '<div class="panel-header" style="padding:0 0 8px;border:none;">Backup dos dados</div>' +
    '<div style="font-size:12.5px;color:#58585a;margin-bottom:10px;">Gera um arquivo .xlsx com todos os anos, nas abas do modelo (Repasses Previstos, Descontos, Recebimentos e Adiantamentos). ' +
    "O mesmo arquivo pode ser enviado de volta na etapa 2. Itens que já existem são identificados como duplicados e ignorados.</div>" +
    '<button class="btn btn-dark" id="btn-backup" type="button"' + (uiImportLibState === "loading" ? " disabled" : "") + ">" + icon("download", 14) + "Baixar backup (.xlsx)</button>" +
    (uiBackupInfo ? '<div class="field-hint" style="margin-top:8px;">' + esc(uiBackupInfo) + "</div>" : "") +
    "</div>";

  html += '<div class="panel" style="padding:16px 18px;margin-bottom:16px;">' +
    '<div class="panel-header" style="padding:0 0 8px;border:none;">1. Baixe o modelo</div>' +
    '<div style="font-size:12.5px;color:#58585a;margin-bottom:10px;">Arquivo .xlsx com 4 abas: Repasses Previstos, Descontos, Recebimentos e Adiantamentos, já com um exemplo preenchido. ' +
    "Nas abas Descontos e Recebimentos, a coluna <b>" + COL_DESC_REPASSE + "</b> identifica o repasse (contrato ou termo aditivo).</div>" +
    '<button class="btn btn-ghost" id="btn-baixar-modelo" type="button">' + icon("download", 14) + "Baixar modelo (.xlsx)</button>" +
    "</div>";

  html += '<div class="panel" style="padding:16px 18px;margin-bottom:16px;">' +
    '<div class="panel-header" style="padding:0 0 8px;border:none;">2. Envie o arquivo preenchido (ou um backup)</div>' +
    '<input class="input" type="file" id="input-importar" accept=".xlsx,.xls" style="max-width:360px;"' + (uiImportLibState === "loading" ? " disabled" : "") + "/>" +
    (uiImportLibState === "loading" ? '<div class="field-hint" style="margin-top:6px;">Carregando leitor de Excel...</div>' : "") +
    "</div>";

  if (uiImportResultado) {
    html += '<div class="panel" style="padding:16px 18px;margin-bottom:16px;background:#eef7de;border-color:#d7e7b8;">' +
      "Importação concluída: " + uiImportResultado.previstos + " repasse(s) previsto(s), " + uiImportResultado.descontos + " desconto(s) e " + uiImportResultado.lancamentos + " recebimento(s) gravados." +
      (uiImportResultado.adiantamentos ? " " + uiImportResultado.adiantamentos + " adiantamento(s) também." : "") +
      (uiImportResultado.ignorados ? " " + uiImportResultado.ignorados + " linha(s) duplicada(s) foram ignoradas." : "") +
      "</div>";
  }

  if (uiImportData) {
    const todas = uiImportData.previstos.concat(uiImportData.descontos, uiImportData.lancamentos, uiImportData.adiantamentos || [], uiImportData.fontes || []);
    const totalValidas = todas.filter((r) => r.valid).length;
    const totalDups = todas.filter((r) => r.dup).length;
    if (totalDups) html += '<div class="panel" style="padding:12px 16px;margin-bottom:14px;background:#fff4e5;border-color:#f3d6a8;">Atenção: <b>' + totalDups +
      "</b> linha(s) já existem no sistema (ou se repetem no arquivo) e <b>não serão gravadas de novo</b>.</div>";
    const compTxt = (r) => (r.competencia ? fmtCompetenciaTxt(r.competencia.mes, r.competencia.ano) : "—");
    html += tabelaImportHtml("Fontes de Recurso", uiImportData.fontes || [], [{ label: "Fonte", get: (r) => r.nome }, { label: "Conta", get: (r) => r.conta }, { label: "Ativa", get: (r) => (r.ativa ? "Sim" : "Não") }]);
    html += tabelaImportHtml("Repasses Previstos", uiImportData.previstos, [
      { label: "Tipo", get: (r) => r.tipo }, { label: "Descrição", get: (r) => r.descricao },
      { label: "Valor Total", get: (r) => fmtCurrency(r.valorTotal) }, { label: "Parcelas", get: (r) => r.numParcelas },
      { label: "Início", get: (r) => (r.mesInicial ? MONTH_SHORT[r.mesInicial - 1] : "—") + "/" + (r.anoInicial || "—") },
      { label: "Unidade/Contrato", get: (r) => r.unidade },
    ]);
    html += tabelaImportHtml("Descontos", uiImportData.descontos, [
      { label: COL_DESC_REPASSE, get: (r) => r.descRepasse || r.unidade }, { label: "Competência", get: compTxt },
      { label: "Tipo", get: (r) => (r.tipo === "Outro" && r.tipoOutro ? r.tipoOutro : r.tipo) }, { label: "Valor", get: (r) => fmtCurrency(r.valor) },
    ]);
    html += tabelaImportHtml("Recebimentos", uiImportData.lancamentos, [
      { label: COL_DESC_REPASSE, get: (r) => r.descRepasse || r.unidade }, { label: "Competência", get: compTxt },
      { label: "Data Efetivação", get: (r) => fmtDateBR(r.dataEfetivacao) }, { label: "Valor Recebido", get: (r) => fmtCurrency(r.valorRecebido) }, { label: "Fonte", get: (r) => (r.fonte === "Outro" && r.fonteOutro ? r.fonteOutro : r.fonte) },
    ]);
    html += tabelaImportHtml("Adiantamentos", uiImportData.adiantamentos || [], [
      { label: COL_DESC_REPASSE, get: (r) => r.descRepasse }, { label: "Data", get: (r) => fmtDateBR(r.data) }, { label: "Valor", get: (r) => fmtCurrency(r.valor) },
      { label: "Fonte", get: (r) => (r.fonte === "Outro" && r.fonteOutro ? r.fonteOutro : r.fonte) },
      { label: "Compensações", get: (r) => r.compensacoes.map((c) => fmtCompetenciaTxt(c.mes, c.ano)).join(", ") },
    ]);
    html += '<div style="display:flex;gap:8px;">' +
      '<button class="btn btn-ghost" id="btn-cancelar-import" type="button">Cancelar</button>' +
      '<button class="btn btn-primary" id="btn-confirmar-import" type="button"' + (totalValidas === 0 ? " disabled" : "") + ">" + icon("check", 14) + "Confirmar importação (" + totalValidas + " linha" + (totalValidas === 1 ? "" : "s") + ")</button>" +
      "</div>";
  }

  content.innerHTML = html;

  const btnBackup = document.getElementById("btn-backup");
  if (btnBackup) btnBackup.onclick = gerarBackupXLSX;
  const btnModelo = document.getElementById("btn-baixar-modelo");
  if (btnModelo) btnModelo.onclick = gerarModeloXLSX;

  const inputImportar = document.getElementById("input-importar");
  if (inputImportar) inputImportar.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    loadSheetJS(() => {
      const reader = new FileReader();
      reader.onload = (ev) => {
        const wb = XLSX.read(new Uint8Array(ev.target.result), { type: "array", cellDates: true });
        uiImportResultado = null;
        uiImportData = parseArquivoImportacao(wb);
        renderAll();
      };
      reader.readAsArrayBuffer(file);
    });
  });

  const btnCancelar = document.getElementById("btn-cancelar-import");
  if (btnCancelar) btnCancelar.onclick = () => { uiImportData = null; renderAll(); };
  const btnConfirmar = document.getElementById("btn-confirmar-import");
  if (btnConfirmar) btnConfirmar.onclick = confirmarImportacao;
}

/* ============================ DADOS INICIAIS (apenas na primeira vez) ============================ */
function semearDadosIniciais() {
  if (localStorage.getItem(DB_KEY_INSTRUMENTOS) !== null) return;
  const contrato = {
    id: uid("inst"), tipo: "Contrato de Gestão (Original)", descricao: "Contrato de Gestão nº 001/2025 - HB",
    valorTotal: 1694889834.36, numParcelas: 12, mesInicio: 1, anoInicio: 2025,
    unidade: "CONTRATO 001 - HB", processoSei: "00060-00007134/2025-02",
    observacoes: "Repasse mensal do Contrato de Gestão original.",
  };
  const aditivo = {
    id: uid("inst"), tipo: "Termo Aditivo", descricao: "61º Termo Aditivo",
    valorTotal: 2684405.10, numParcelas: 1, mesInicio: 1, anoInicio: 2025,
    unidade: "CONTRATO 001 - HB", processoSei: "00060-00007134/2025-02", observacoes: "",
  };
  state.instrumentos = [contrato, aditivo];
  state.parcelas = gerarParcelas(contrato).concat(gerarParcelas(aditivo));
  state.tiposCustom = [];
  state.fontes = fontesPadrao();
  persistir();
}

/* ============================ INICIALIZAÇÃO ============================ */
async function init() {
  semearDadosIniciais();
  carregarEstado();
  if (!state.filters.lancMonthOpen) state.filters.lancMonthOpen = state.anoAtual + "-1";
  renderAll();

  if (SHEETS_API_URL) {
    const carregou = await carregarDeSheets();
    if (carregou) {
      state.anoAtual = anoComDadosMaisRecente();
      renderAll();
    } else {
      agendarSync(); // planilha vazia/config nova: envia os dados locais/seed pra lá
    }
    setInterval(sincronizarAgora, SYNC_INTERVAL_MS);
  }
}
init();
</script>
