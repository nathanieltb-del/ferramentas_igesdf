/* ---------- leitura de um arquivo .xlsx (zip + XML), sem biblioteca ---------- */
function lerDiretorioZip(bytes) {
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  let fim = -1;
  for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { fim = i; break; }
  if (fim < 0) throw new Error('Este arquivo não parece ser uma planilha do Excel (.xlsx). Abra no Excel e use "Salvar como" > "Pasta de Trabalho do Excel (.xlsx)".');
  const total = dv.getUint16(fim + 10, true);
  let p = dv.getUint32(fim + 16, true);
  const dec = new TextDecoder(), mapa = {};
  for (let i = 0; i < total; i++) {
    if (p + 46 > bytes.length || dv.getUint32(p, true) !== 0x02014b50) throw new Error('O arquivo está danificado. Salve a planilha de novo no Excel e tente outra vez.');
    const nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
    mapa[dec.decode(bytes.subarray(p + 46, p + 46 + nlen))] = { metodo: dv.getUint16(p + 10, true), tamanho: dv.getUint32(p + 20, true), deslocamento: dv.getUint32(p + 42, true) };
    p += 46 + nlen + elen + clen;
  }
  return mapa;
}
async function extrairDoZip(bytes, mapa, nome) {
  const e = mapa[nome];
  if (!e) return null;
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const inicio = e.deslocamento + 30 + dv.getUint16(e.deslocamento + 26, true) + dv.getUint16(e.deslocamento + 28, true);
  const dados = bytes.subarray(inicio, inicio + e.tamanho);
  if (e.metodo === 0) return new TextDecoder().decode(dados);
  if (e.metodo !== 8) throw new Error('O arquivo usa um formato de compactação que a tela não lê. Salve a planilha de novo no Excel.');
  if (typeof DecompressionStream === 'undefined') throw new Error('Este navegador é antigo demais para ler a planilha. Use uma versão atual do Chrome, Edge ou Firefox.');
  const fluxo = new Blob([dados]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new TextDecoder().decode(await new Response(fluxo).arrayBuffer());
}
function lerXml(texto) {
  const doc = new DOMParser().parseFromString(texto, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('O arquivo está danificado. Salve a planilha de novo no Excel e tente outra vez.');
  return doc;
}
const filhosPorNome = (no, nome) => [...no.children].filter(x => x.localName === nome);
function textoDeSi(si) {
  let t = '';
  [...si.children].forEach(f => {
    if (f.localName === 't') t += f.textContent;
    else if (f.localName === 'r') filhosPorNome(f, 't').forEach(x => { t += x.textContent; });
  });
  return t;
}
function colunaDaReferencia(ref) {
  let n = 0;
  for (const ch of String(ref).replace(/[^A-Za-z]/g, '').toUpperCase()) n = n * 26 + ch.charCodeAt(0) - 64;
  return n - 1;
}

// Devolve [{ nome, linhas: [[...], ...] }]. Célula de porcentagem (ex.: 4,65%) vira o texto "4,65%". Datas ficam como número de série do Excel (o Code.gs entende).
async function lerXlsx(buffer) {
  const bytes = new Uint8Array(buffer);
  const zip = lerDiretorioZip(bytes);
  const pegar = async nome => { const t = await extrairDoZip(bytes, zip, nome); return t === null ? null : lerXml(t); };
  const livro = await pegar('xl/workbook.xml');
  if (!livro) throw new Error('Este arquivo não parece ser uma planilha do Excel (.xlsx).');
  const rels = await pegar('xl/_rels/workbook.xml.rels');
  const alvos = {};
  if (rels) [...rels.getElementsByTagName('Relationship')].forEach(r => { alvos[r.getAttribute('Id')] = r.getAttribute('Target'); });
  const textos = [];
  const sst = await pegar('xl/sharedStrings.xml');
  if (sst) [...sst.getElementsByTagName('si')].forEach(si => textos.push(textoDeSi(si)));
  // estilos que formam porcentagem
  const ehPct = {};
  const est = await pegar('xl/styles.xml');
  if (est) {
    const formatos = {};
    [...est.getElementsByTagName('numFmt')].forEach(f => { formatos[f.getAttribute('numFmtId')] = f.getAttribute('formatCode') || ''; });
    const xfs = est.getElementsByTagName('cellXfs')[0];
    if (xfs) filhosPorNome(xfs, 'xf').forEach((xf, i) => {
      const id = xf.getAttribute('numFmtId');
      if (id === '9' || id === '10' || /%/.test((formatos[id] || '').replace(/"[^"]*"/g, ''))) ehPct[i] = true;
    });
  }
  const saida = [];
  for (const folha of [...livro.getElementsByTagName('sheet')]) {
    const nome = folha.getAttribute('name');
    const rid = folha.getAttribute('r:id') || folha.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
    let alvo = alvos[rid];
    if (!alvo) continue;
    alvo = alvo.charAt(0) === '/' ? alvo.slice(1) : 'xl/' + alvo;
    const doc = await pegar(alvo);
    if (!doc) continue;
    const linhas = [];
    const dados = doc.getElementsByTagName('sheetData')[0];
    if (dados) filhosPorNome(dados, 'row').forEach((row, k) => {
      const nl = Number(row.getAttribute('r')) || (k + 1);
      const lin = [];
      let seq = 0;
      filhosPorNome(row, 'c').forEach(c => {
        const ref = c.getAttribute('r');
        const col = ref ? colunaDaReferencia(ref) : seq;
        seq = col + 1;
        const tipo = c.getAttribute('t');
        const v = filhosPorNome(c, 'v')[0];
        let valor = '';
        if (tipo === 'inlineStr') valor = filhosPorNome(c, 'is').map(textoDeSi).join('');
        else if (v) {
          const bruto = v.textContent;
          if (tipo === 's') valor = textos[Number(bruto)] !== undefined ? textos[Number(bruto)] : '';
          else if (tipo === 'str') valor = bruto;
          else if (tipo === 'b') valor = bruto === '1' ? 'SIM' : 'NAO';
          else if (tipo === 'e') valor = '';
          else {
            const n = Number(bruto);
            if (bruto === '' || !isFinite(n)) valor = '';
            else if (ehPct[Number(c.getAttribute('s') || 0)]) valor = String(Number((n * 100).toFixed(8))).replace('.', ',') + '%';
            else valor = n;
          }
        }
        lin[col] = valor;
      });
      for (let i = 0; i < lin.length; i++) if (lin[i] === undefined) lin[i] = '';
      while (lin.length && lin[lin.length - 1] === '') lin.pop();
      while (linhas.length < nl - 1) linhas.push([]);
      linhas[nl - 1] = lin;
    });
    saida.push({ nome, linhas });
  }
  return saida;
}

/* ---------- a tela ---------- */
function textoLinhas(a) {
  if (!a.linhas || !a.linhas.length) return a.total > 1 ? ' (' + a.total + ' vezes)' : '';
  const resto = a.total - a.linhas.length;
  return ' (linha' + (a.linhas.length > 1 ? 's ' : ' ') + a.linhas.join(', ') + (resto > 0 ? ' e mais ' + resto : '') + ')';
}
const inteiroBr = n => Number(n).toLocaleString('pt-BR');

async function obterModeloImportacao() {
  if (!importar.modelo) importar.modelo = await chamar('importacao.modelo', {}, { semCache: true });
  return importar.modelo;
}

function telaImportar() {
  const resultado = h('div', { 'aria-live': 'polite' });
  const status = h('p', { class: 'ajuda', role: 'status', style: 'margin-top:10px' });
  const erroModelo = h('div');
  const entrada = h('input', { type: 'file', id: 'arquivo-importacao', accept: '.xlsx,' + MIME_XLSX });
  let dadosLidos = null, ignoradas = [], nomeArquivo = '';

  const botaoModelo = h('button', { type: 'button', class: 'botao', texto: 'Baixar o modelo (.xlsx)' });
  botaoModelo.addEventListener('click', () => enviar(botaoModelo, erroModelo, 'Preparando…', async () => {
    const modelo = await obterModeloImportacao();
    baixarBinario('modelo-importacao-notas-fiscais.xlsx', gerarModeloXlsx(modelo), MIME_XLSX);
    toque('Modelo baixado. Abra a aba "Leia-me" primeiro.');
  }));

  function mostrarErroGeral(texto) { resultado.replaceChildren(caixaAviso(texto)); status.textContent = ''; }

  entrada.addEventListener('change', async () => {
    const arquivo = entrada.files && entrada.files[0];
    if (!arquivo) return;
    resultado.replaceChildren(); dadosLidos = null;
    nomeArquivo = arquivo.name;
    if (!/\.xlsx$/i.test(arquivo.name)) { entrada.value = ''; mostrarErroGeral('Escolha um arquivo .xlsx (Excel). Se o seu arquivo é .xls ou .csv, abra no Excel e use "Salvar como" > "Pasta de Trabalho do Excel (.xlsx)".'); return; }
    if (arquivo.size > 20e6) { entrada.value = ''; mostrarErroGeral('O arquivo é grande demais (mais de 20 MB). Divida os dados em arquivos menores.'); return; }
    status.textContent = 'Lendo o arquivo…';
    marcarOcupado(1);
    try {
      const [modelo, planilhas] = await Promise.all([obterModeloImportacao(), arquivo.arrayBuffer().then(lerXlsx)]);
      const conhecidos = new Set(); modelo.abas.forEach(a => { conhecidos.add(normalizarNomeAba(a.aba)); conhecidos.add(normalizarNomeAba(a.titulo)); });
      const abas = {}; ignoradas = [];
      planilhas.forEach(pl => {
        const n = normalizarNomeAba(pl.nome);
        if (conhecidos.has(n)) abas[pl.nome] = pl.linhas;
        else if (n !== 'LEIA ME' && n !== 'LEIAME') ignoradas.push(pl.nome);
      });
      if (!Object.keys(abas).length) { mostrarErroGeral('Não encontrei nenhuma aba do modelo neste arquivo. As abas esperadas são: ' + modelo.abas.map(a => a.aba).join(', ') + '. Baixe o modelo e preencha nele.'); return; }
      if (JSON.stringify(abas).length > 3800000) { mostrarErroGeral('O arquivo tem dados demais para enviar de uma vez. Divida em arquivos menores (por exemplo, até 1.000 notas cada) e envie um de cada vez.'); return; }
      dadosLidos = abas;
      await conferir();
    } catch (e) {
      mostrarErroGeral(e.message);
    } finally {
      marcarOcupado(-1);
      entrada.value = '';   // permite escolher o mesmo arquivo de novo depois de corrigir
    }
  });

  async function conferir() {
    status.textContent = 'Conferindo “' + nomeArquivo + '”. Em planilhas grandes isso pode levar alguns segundos. Não feche esta tela.';
    resultado.replaceChildren();
    try {
      const r = await chamar('importacao.conferir', { abas: dadosLidos }, { semCache: true, limiteMs: 300000 });
      status.textContent = 'Arquivo conferido: ' + nomeArquivo + '.';
      desenharConferencia(r, false);
    } catch (e) {
      status.textContent = '';
      resultado.replaceChildren(caixaAviso(e.codigo === 'REDE' ? 'Não recebi a resposta do sistema. Nada foi gravado pela conferência. Tente de novo; se for um arquivo grande, divida-o em partes.' : e.message));
    }
  }

  function tabelaResumo(r, gravado) {
    const linhas = r.resumo.filter(x => x.enviada);
    const soma = k => linhas.reduce((s, x) => s + x[k], 0);
    const cab = gravado ? ['Aba', 'Linhas lidas', 'Gravados', 'Já existiam (pulados)'] : ['Aba', 'Linhas lidas', 'Novos', 'Já existem (serão pulados)', 'Com erro'];
    return h('div', { class: 'tabela-caixa' }, h('table', { class: 'tabela-imp' },
      h('thead', {}, h('tr', {}, cab.map((t, i) => h('th', { scope: 'col', class: i ? 'num' : '', texto: t })))),
      h('tbody', {}, linhas.map(x => h('tr', {},
        h('td', { class: 'principal', texto: x.aba }),
        h('td', { class: 'num', 'data-rotulo': 'Linhas lidas', texto: inteiroBr(x.linhas) }),
        h('td', { class: 'num', 'data-rotulo': gravado ? 'Gravados' : 'Novos', texto: inteiroBr(x.novos) }),
        h('td', { class: 'num', 'data-rotulo': 'Já existem', texto: inteiroBr(x.jaExistem) }),
        gravado ? null : h('td', { class: 'num' + (x.comErro ? ' com-erro' : ''), 'data-rotulo': 'Com erro', texto: inteiroBr(x.comErro) })))),
      h('tfoot', {}, h('tr', {},
        h('td', { class: 'principal', texto: 'Total' }),
        h('td', { class: 'num', 'data-rotulo': 'Linhas lidas', texto: inteiroBr(soma('linhas')) }),
        h('td', { class: 'num', 'data-rotulo': gravado ? 'Gravados' : 'Novos', texto: inteiroBr(soma('novos')) }),
        h('td', { class: 'num', 'data-rotulo': 'Já existem', texto: inteiroBr(soma('jaExistem')) }),
        gravado ? null : h('td', { class: 'num', 'data-rotulo': 'Com erro', texto: inteiroBr(soma('comErro')) })))));
  }

  function listaAvisos(r) {
    if (!r.avisos.length && !ignoradas.length) return null;
    return h('div', { class: 'imp-bloco' }, h('h3', { texto: 'Avisos' }), h('p', { class: 'ajuda', texto: 'Avisos não impedem a gravação. Leia com atenção.' }),
      h('ul', { class: 'imp-lista' },
        r.avisos.map(a => h('li', {}, h('strong', { texto: a.aba + ': ' }), a.texto + textoLinhas(a))),
        ignoradas.length ? h('li', {}, h('strong', { texto: 'Abas ignoradas: ' }), ignoradas.join(', ') + '. O sistema não usa estas abas.') : null));
  }

  function tabelaErros(r) {
    const ordem = {}; (importar.modelo ? importar.modelo.abas : []).forEach((a, i) => { ordem[a.aba] = i; });
    const lista = r.erros.map((e, i) => ({ e, i })).sort((x, y) => ((ordem[x.e.aba] === undefined ? 99 : ordem[x.e.aba]) - (ordem[y.e.aba] === undefined ? 99 : ordem[y.e.aba])) || ((x.e.linha || 0) - (y.e.linha || 0)) || (x.i - y.i)).map(x => x.e);
    return h('div', { class: 'imp-bloco' }, h('h3', { texto: 'Erros a corrigir' }),
      h('div', { class: 'tabela-caixa' }, h('table', { class: 'tabela-imp' },
        h('thead', {}, h('tr', {}, ['Aba', 'Linha', 'Coluna', 'O que fazer'].map((t, i) => h('th', { scope: 'col', class: i === 1 ? 'num' : '', texto: t })))),
        h('tbody', {}, lista.map(e => h('tr', {},
          h('td', { class: 'principal', 'data-rotulo': 'Aba', texto: e.aba }),
          h('td', { class: 'num', 'data-rotulo': 'Linha', texto: e.linha ? String(e.linha) : '—' }),
          h('td', { 'data-rotulo': 'Coluna', texto: e.coluna || '—' }),
          h('td', { class: 'texto-livre', 'data-rotulo': 'O que fazer', texto: e.texto })))))),
      r.errosOmitidos > 0 ? h('p', { class: 'ajuda', style: 'margin-top:8px', texto: 'Mostrando os ' + inteiroBr(r.erros.length) + ' primeiros erros. Há mais ' + inteiroBr(r.errosOmitidos) + '. Corrija estes e envie o arquivo de novo.' }) : null);
  }

  function desenharConferencia(r, depoisDeGravar) {
    const novos = r.resumo.reduce((s, x) => s + x.novos, 0);
    const blocos = [];
    if (r.totalErros > 0) {
      blocos.push(caixaAviso('Encontrei ' + inteiroBr(r.totalErros) + (r.totalErros === 1 ? ' erro' : ' erros') + '. NADA foi gravado. Corrija a planilha e escolha o arquivo de novo.'));
    } else if (r.gravado) {
      blocos.push(caixaAviso('Pronto! Gravei ' + inteiroBr(novos) + (novos === 1 ? ' registro novo.' : ' registros novos.') + (r.impostosDasNotas ? ' Foram calculadas ' + inteiroBr(r.impostosDasNotas) + ' linhas de impostos das notas.' : ''), 'ok'));
    } else if (!r.algoNovo) {
      blocos.push(caixaAviso('Não há nada novo para gravar: tudo o que está na planilha já existe no sistema.', 'info'));
    } else {
      blocos.push(caixaAviso('Tudo certo: nenhum erro. Se você gravar, entram ' + inteiroBr(novos) + (novos === 1 ? ' registro novo' : ' registros novos') + (r.impostosDasNotas ? ', com ' + inteiroBr(r.impostosDasNotas) + ' linhas de impostos das notas' : '') + '. Confira o resumo e os avisos antes.', 'ok'));
    }
    blocos.push(h('div', { class: 'imp-bloco' }, h('h3', { texto: r.gravado ? 'O que foi gravado' : 'Resumo da conferência' }), tabelaResumo(r, !!r.gravado)));
    if (r.totalErros > 0) blocos.push(tabelaErros(r));
    const av = listaAvisos(r); if (av) blocos.push(av);
    const acoes = h('div', { class: 'imp-acoes' });
    if (r.podeImportar && r.algoNovo && !r.gravado) {
      acoes.append(h('button', { type: 'button', class: 'botao', texto: 'Gravar no sistema…', onclick: () => confirmarGravacao(r, novos) }));
    }
    acoes.append(h('button', { type: 'button', class: 'botao claro', texto: r.gravado ? 'Importar outro arquivo' : 'Escolher o arquivo de novo', onclick: () => { resultado.replaceChildren(); status.textContent = ''; entrada.click(); } }));
    blocos.push(acoes);
    resultado.replaceChildren(...blocos);
    resultado.scrollIntoView({ block: 'nearest' });
  }

  function confirmarGravacao(r, novos) {
    janelaConfirmar('Gravar os dados no sistema?',
      'Vão entrar ' + inteiroBr(novos) + ' registros novos. O que já existe será pulado. Tudo entra de uma vez só: se algo falhar, nada é gravado. Para desfazer depois, é preciso inativar os registros um a um nas telas do sistema. Enquanto o sistema grava, outras pessoas podem ver "sistema ocupado" por alguns instantes. Em planilhas grandes, isso pode levar alguns segundos: não feche esta tela.',
      'Gravar agora', false, async () => {
        let g;
        try {
          g = await chamar('importacao.gravar', { abas: dadosLidos }, { semCache: true, limiteMs: 330000 });
        } catch (e) {
          if (e.codigo === 'REDE') throw new ErroApi('Não recebi a resposta do sistema. A gravação PODE ter terminado mesmo assim. Não envie de novo agora: espere 1 minuto, escolha o mesmo arquivo e confira. Se tudo aparecer como "já existe", a gravação terminou. Se nada aparecer como "já existe", nada foi gravado.', 'REDE');
          throw e;
        }
        esquecerMemoria();
        dadosLidos = g.gravado ? null : dadosLidos;
        status.textContent = g.gravado ? 'Importação concluída.' : 'Nada foi gravado.';
        desenharConferencia(g, true);
      });
  }

  const passo = (titulo, ...corpo) => h('section', { class: 'painel imp-passo' }, h('div', { class: 'painel-corpo' }, h('h2', { texto: titulo }), ...corpo));
  return h('div', {},
    cabecalho('Importar planilha', 'Traga dados de uma planilha do Excel para o sistema. O sistema confere tudo antes. Só grava se não houver nenhum erro.'),
    passo('1. Baixe o modelo', h('p', { texto: 'O modelo tem uma aba para cada assunto: impostos, fornecedores, serviços, oficinas, centros de custo, colaboradores, contratos, tributação e notas fiscais. A aba "Leia-me" explica cada coluna. Preencha só o que precisa.' }),
      h('div', { style: 'margin-top:14px' }, erroModelo, botaoModelo)),
    passo('2. Escolha a planilha preenchida',
      h('div', { class: 'campo' }, h('label', { for: 'arquivo-importacao', texto: 'Arquivo do Excel (.xlsx)' }), entrada,
        h('p', { class: 'ajuda', texto: 'Ao escolher o arquivo, o sistema lê e confere tudo. Nada é gravado nesta etapa.' })),
      status, resultado));
}

let listaUsuarios = [];

function telaUsuarios() {
  const area = h('div', { class: 'painel' });
  const topo = cabecalho('Usuários', 'Quem pode entrar no sistema e o que cada pessoa pode fazer.',
    h('button', { type: 'button', class: 'botao', texto: 'Novo usuário', onclick: () => janelaUsuario(null) }));
  const perfis = h('section', { class: 'painel', 'aria-label': 'Perfis' }, h('div', { class: 'painel-corpo' },
    h('h2', { texto: 'O que cada perfil pode fazer' }),
    h('dl', { class: 'lista-dados' }, ['CONSULTA', 'OPERADOR', 'GESTOR', 'ADMIN'].map(k =>
      h('div', { class: 'linha' }, h('dt', { texto: PERFIS[k].nome }), h('dd', { texto: PERFIS[k].texto }))))));
  const bloco = h('div', {}, topo, area, perfis);
  area.append(h('div', { class: 'vazio', texto: 'Carregando…' }));
  recarregarUsuarios(area);

async function recarregarUsuarios(area) {
  area = area || document.querySelector('#conteudo > div > .painel');
  try {
    const r = await chamar('usuarios.listar');
    listaUsuarios = r.usuarios;
    desenharUsuarios(area);
  } catch (e) {
    if (area && e.codigo !== 'NAO_AUTENTICADO') area.replaceChildren(h('div', { class: 'painel-corpo' }, caixaAviso(e.message),
      h('button', { type: 'button', class: 'botao claro', texto: 'Tentar de novo', onclick: () => recarregarUsuarios(area) })));
  }
}

function desenharUsuarios(area) {
  if (!area) return;
  if (!listaUsuarios.length) { area.replaceChildren(h('div', { class: 'vazio', texto: 'Nenhum usuário cadastrado. Use "Novo usuário".' })); return; }
  const meu = estado.usuario.ID;
  const linhas = listaUsuarios.map(u => {
    const eu = u.ID === meu;
    const acoes = h('td', { class: 'acoes' },
      h('button', { type: 'button', class: 'botao claro pequeno', texto: 'Editar', 'aria-label': 'Editar ' + u.NOME, onclick: () => janelaUsuario(u) }),
      eu ? null : h('button', { type: 'button', class: 'botao claro pequeno', texto: 'Redefinir senha', 'aria-label': 'Redefinir a senha de ' + u.NOME, onclick: () => confirmarRedefinir(u) }),
      eu ? null : (u.STATUS === 'ATIVO'
        ? h('button', { type: 'button', class: 'botao perigo pequeno', texto: 'Inativar', 'aria-label': 'Inativar ' + u.NOME, onclick: () => confirmarInativarUsuario(u) })
        : h('button', { type: 'button', class: 'botao claro pequeno', texto: 'Reativar', 'aria-label': 'Reativar ' + u.NOME, onclick: () => reativarUsuario(u) })));
    return h('tr', { class: u.STATUS === 'ATIVO' ? '' : 'linha-inativa' },
      h('td', { class: 'principal' }, h('div', { class: 'nome' }, u.NOME, eu ? [' ', h('span', { class: 'selo voce', texto: 'Você' })] : null), h('div', { class: 'email', texto: u.EMAIL })),
      h('td', { 'data-rotulo': 'Perfil', texto: nomePerfil(u.PERFIL) }),
      h('td', { 'data-rotulo': 'Situação' }, h('span', { class: 'selos' },
        h('span', { class: 'selo ' + (u.STATUS === 'ATIVO' ? 'ativo' : 'inativo'), texto: u.STATUS === 'ATIVO' ? 'Ativo' : 'Inativo' }),
        u.TROCAR_SENHA === 'SIM' ? h('span', { class: 'selo alerta', texto: 'Senha temporária' }) : null)),
      h('td', { class: 'data', 'data-rotulo': 'Último acesso', texto: dataHoraUsuario(u.ULTIMO_ACESSO) }),
      acoes);
  });
  area.replaceChildren(h('div', { class: 'tabela-caixa' }, h('table', {},
    h('thead', {}, h('tr', {}, ['Usuário', 'Perfil', 'Situação', 'Último acesso'].map(t => h('th', { scope: 'col', texto: t })), h('th', { scope: 'col' }, h('span', { class: 'so-leitor', texto: 'Ações' })))),
    h('tbody', {}, linhas))));
}

function janelaUsuario(u) {
  const novo = !u;
  const eu = !novo && u.ID === estado.usuario.ID;
  const erro = h('div');
  const nome = h('input', { id: 'u-nome', name: 'nome', required: true, autocomplete: 'off', value: novo ? '' : u.NOME });
  const email = h('input', { id: 'u-email', name: 'email', type: 'email', required: true, autocomplete: 'off', autocapitalize: 'none', value: novo ? '' : u.EMAIL });
  const perfil = h('select', { id: 'u-perfil', name: 'perfil', disabled: eu, 'aria-describedby': 'u-perfil-ajuda' },
    ['CONSULTA', 'OPERADOR', 'GESTOR', 'ADMIN'].map(k => h('option', { value: k, selected: !novo && u.PERFIL === k, texto: PERFIS[k].nome })));
  if (novo) perfil.value = 'OPERADOR';
  const explica = h('p', { class: 'ajuda', id: 'u-perfil-ajuda' });
  const atualizarTexto = () => { explica.textContent = PERFIS[perfil.value].texto + (eu ? ' Você não pode mudar o seu próprio perfil.' : ''); };
  perfil.addEventListener('change', atualizarTexto); atualizarTexto();
  const salvar = h('button', { type: 'submit', class: 'botao', texto: novo ? 'Criar usuário' : 'Salvar' });
  let janela;
  const form = h('form', { method: 'dialog', novalidate: true, onsubmit: ev => {
    ev.preventDefault();
    erro.replaceChildren();
    if (!nome.value.trim() || !email.value.trim()) { erro.append(caixaAviso('Informe o nome e o e-mail.')); return; }

/* =====================================================================
   AVISO DE PROCESSO NOVO NO DIÁRIO
   Quem tem um colaborador ligado ao seu usuário recebe um aviso na tela quando um processo
   é enviado para esse colaborador. O sistema pergunta ao servidor a cada minuto (consulta leve)
   enquanto a página está aberta. Se a pessoa permitir, o navegador também mostra o aviso do
   sistema quando a aba está em segundo plano. Ao entrar, o aviso conta o que chegou desde o
   último aviso visto. Quem não tem colaborador ligado não faz essa consulta.
   ===================================================================== */
const AVISOS = { ativo: false, relogio: null, vistos: new Set(), lista: [], primeira: true, colaborador: '', consultando: false };
const INTERVALO_AVISOS_MS = 60000;
const CHAVE_CONVITE_AVISO = 'igesdf.convite-aviso';

function iniciarAvisos() {
  if (AVISOS.ativo) return;
  AVISOS.ativo = true; AVISOS.primeira = true;
  pushOuvirRecados();
  consultarAvisos();
  AVISOS.relogio = setInterval(consultarAvisos, INTERVALO_AVISOS_MS);
  document.addEventListener('visibilitychange', aoVoltarParaAba);
}
function pararAvisos() {
  AVISOS.ativo = false; clearInterval(AVISOS.relogio); AVISOS.relogio = null;
  AVISOS.vistos.clear(); AVISOS.lista = []; AVISOS.primeira = true;
  document.removeEventListener('visibilitychange', aoVoltarParaAba);
  fecharAvisoProcessos();
  AVISOS.colaborador = ''; if (!MAPAAL.ativo) PUSH.ativo = false; atualizarBotaoPush();
}
function aoVoltarParaAba() { if (!document.hidden) consultarAvisos(); }
function fecharAvisoProcessos() { const a = document.getElementById('aviso-processos'); if (a) a.remove(); }
// Abre o Diário já com os processos novos (se já estava nele, lê de novo).
function abrirDiarioDoAviso() {
  if (rotaAtual() === 'diario') { esquecerMemoria(); desenharRota(); } else ir('diario');
}
const textoProcessos = n => n === 1 ? '1 processo' : n + ' processos';

async function consultarAvisos() {
  if (!AVISOS.ativo || !estado.sessao || AVISOS.consultando) return;
  AVISOS.consultando = true;
  try {
    const r = await chamarDireto('avisos.meus', {}, { discreto: true });
    if (!AVISOS.ativo) return;
    if (!r.vinculado) { pararAvisos(); return; }
    AVISOS.colaborador = r.colaborador || '';
    const eraPrimeira = AVISOS.primeira; AVISOS.primeira = false;
    if (eraPrimeira) { atualizarBotaoPush(); pushSincronizarEmSilencio(); }
    const novos = r.novos.filter(x => !AVISOS.vistos.has(x.ID + ':' + x.SEQ));
    if (novos.length) {
      novos.forEach(x => AVISOS.vistos.add(x.ID + ':' + x.SEQ));
      AVISOS.lista = AVISOS.lista.concat(novos);
      AVISOS.total = (AVISOS.total || 0) + Math.max(novos.length, eraPrimeira ? r.total : novos.length);
      mostrarAvisoProcessos(eraPrimeira);
      avisoDoNavegador(novos, r.total);
      try { await chamarDireto('avisos.visto', { ate: r.ate }, { discreto: true }); } catch (e) { /* o aviso já foi mostrado; na próxima volta o sistema não repete */ }
    } else if (r.total > 0) {
      try { await chamarDireto('avisos.visto', { ate: r.ate }, { discreto: true }); } catch (e) { /* tenta de novo na próxima volta */ }
    }
    if (eraPrimeira) convidarParaAvisoDoNavegador();
  } catch (e) {
    /* sem internet ou servidor ocupado: fica quieto e tenta no próximo minuto */
  } finally { AVISOS.consultando = false; }
}

/* ---------- Aviso no computador (push) ----------
   O navegador recebe o aviso mesmo com o sistema fechado (o navegador precisa estar aberto no computador).
   O aviso vai sem dado de processo: a mensagem fixa é escrita pelo arquivo sw.js.
   O endereço de entrega é guardado no servidor, ligado ao usuário. */
const PUSH = { ativo: false, trabalhando: false };
const pushSuportado = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && window.isSecureContext;
function pushBytes(b64url) {
  const p = (b64url + '='.repeat((4 - b64url.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/');
  const t = atob(p); const v = new Uint8Array(t.length);
  for (let i = 0; i < t.length; i++) v[i] = t.charCodeAt(i);
  return v;
}
function pushTexto(bytes) {
  let t = ''; const v = new Uint8Array(bytes);
  for (let i = 0; i < v.length; i++) t += String.fromCharCode(v[i]);
  return btoa(t).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
// Resultado: 'ligado' | 'negado' | 'pendente' | 'sem-suporte' | 'erro'
async function pushLigar(perguntar) {
  if (!pushSuportado()) return 'sem-suporte';
  if (Notification.permission === 'default' && perguntar) { try { await Notification.requestPermission(); } catch (e) { /* segue */ } }
  if (Notification.permission !== 'granted') return Notification.permission === 'denied' ? 'negado' : 'pendente';
  if (PUSH.trabalhando) return PUSH.ativo ? 'ligado' : 'erro';
  PUSH.trabalhando = true;
  try {
    const reg = await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    const info = await chamarDireto('push.obter', { endpoint: sub ? sub.endpoint : '' }, { discreto: true });
    if (!info.chave) return 'erro';
    if (sub && sub.options && sub.options.applicationServerKey && pushTexto(sub.options.applicationServerKey) !== info.chave) { await sub.unsubscribe(); sub = null; }
    let criou = false;
    if (!sub) { sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: pushBytes(info.chave) }); criou = true; }
    if (criou || !info.registrado) await chamarDireto('push.inscrever', { endpoint: sub.endpoint }, { discreto: true });
    PUSH.ativo = true; atualizarBotaoPush();
    return 'ligado';
  } catch (e) {
    return 'erro';
  } finally { PUSH.trabalhando = false; }
}
async function pushDesligar() {
  try {
    const reg = await navigator.serviceWorker.getRegistration('sw.js') || await navigator.serviceWorker.getRegistration();
    const sub = reg ? await reg.pushManager.getSubscription() : null;
    if (sub) { try { await chamarDireto('push.cancelar', { endpoint: sub.endpoint }, { discreto: true }); } catch (e) { /* sai do aparelho mesmo assim */ } await sub.unsubscribe(); }
    PUSH.ativo = false; atualizarBotaoPush();
    return true;
  } catch (e) { return false; }
}
const MENSAGEM_PUSH = {
  ligado: 'Pronto. Este computador vai mostrar um aviso quando chegar processo no Diário ou quando um prazo do Mapa estiver perto, mesmo com o sistema fechado.',
  negado: 'O navegador bloqueou os avisos. Libere no cadeado ao lado do endereço e tente de novo.',
  pendente: 'Os avisos continuam desligados. Clique em "Permitir" quando o navegador perguntar.',
  'sem-suporte': 'Este navegador não permite aviso com o sistema fechado. Você ainda vê o aviso aqui na tela.',
  erro: 'Não consegui ligar agora. Tente de novo em instantes.'
};
function atualizarBotaoPush() {
  const b = document.getElementById('botao-push'); if (!b) return;
  document.getElementById('area-push').hidden = !(((AVISOS.ativo && AVISOS.colaborador) || MAPAAL.ativo) && pushSuportado());
  b.textContent = PUSH.ativo ? 'Avisos neste computador: ligados' : 'Ligar avisos neste computador';
  b.setAttribute('aria-pressed', String(PUSH.ativo));
  document.getElementById('botao-push-teste').hidden = !PUSH.ativo;
}
async function aoClicarBotaoPush() {
  if (PUSH.ativo) { toque((await pushDesligar()) ? 'Avisos desligados neste computador.' : 'Não consegui desligar agora. Tente de novo.', 5000); return; }
  toque(MENSAGEM_PUSH[await pushLigar(true)], 6000);
}
// Manda um aviso de teste para os computadores da própria pessoa e mostra o que o serviço do navegador respondeu.
async function aoClicarTestarPush() {
  const b = document.getElementById('botao-push-teste'); if (b.disabled) return;
  b.disabled = true;
  try {
    const r = await chamarDireto('push.testar', {}, { discreto: true });
    const lista = r.resultados || [];
    const bons = lista.filter(x => x.status >= 200 && x.status < 300).length;
    const velhos = lista.filter(x => x.status === 404 || x.status === 410).length;
    if (bons > 0) {
      const quem = lista[0].servico.indexOf('windows') >= 0 ? 'ao Windows' : lista[0].servico.indexOf('googleapis') >= 0 ? 'ao Google' : 'ao serviço do navegador';
      const velhosTxt = velhos ? ' ' + (velhos === 1 ? 'Um registro antigo deste usuário já tinha vencido e foi retirado.' : velhos + ' registros antigos deste usuário já tinham vencido e foram retirados.') : '';
      toque('Aviso de teste entregue ' + quem + '. Conferindo o navegador…', 5000);
      toque('Aviso de teste entregue ' + quem + '. ' + await diagnosticoDoAviso() + velhosTxt, 25000);
    }
    else toque('O serviço do navegador não aceitou o aviso (' + (lista.filter(x => x.status < 200 || x.status >= 300).map(x => x.status + ' em ' + x.servico).join('; ') || 'sem resposta') + '). Avise o administrador do sistema.', 12000);
  } catch (e) {
    toque(e && e.message ? e.message : 'Não consegui testar agora. Tente de novo.', 8000);
  } finally { b.disabled = false; }
}
// Depois do teste, confere dentro do navegador onde o aviso pode ter parado.
const VERSAO_SW_ESPERADA = '4';
async function diagnosticoDoAviso() {
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    if (!reg || !reg.active) return 'O arquivo do aviso (sw.js) não está ativo neste navegador. Feche todas as abas do sistema e abra de novo.';
    const versao = await new Promise(resolve => {
      const canal = new MessageChannel(); const t = setTimeout(() => resolve(''), 1500);
      canal.port1.onmessage = ev => { clearTimeout(t); resolve(String((ev.data && ev.data.versao) || '')); };
      reg.active.postMessage({ tipo: 'versao' }, [canal.port2]);
    });
    if (versao !== VERSAO_SW_ESPERADA) return 'O navegador ainda usa uma versão antiga do arquivo do aviso (sw.js). Feche TODAS as abas do sistema, abra de novo (Ctrl+F5) e teste outra vez.';
    await new Promise(r => setTimeout(r, 3500));
    const abertos = await reg.getNotifications({ tag: 'aviso-igesdf' });
    if (abertos.length) return 'O navegador criou o aviso. Se ele não apareceu na tela, abra Configurações do Windows > Sistema > Notificações e ligue o seu navegador. Veja também o modo "Foco" ou "Não incomodar".';
    return 'O navegador não tem nenhum aviso aberto. Se você já viu e fechou, está tudo certo. Se não viu, me envie esta mensagem e o nome do navegador.';
  } catch (e) { return 'Não consegui conferir o aviso agora.'; }
}
// Quando o navegador já deixou (permissão dada antes), liga sozinho e em silêncio.
function pushSincronizarEmSilencio() {
  try { if (pushSuportado() && Notification.permission === 'granted') pushLigar(false).then(atualizarBotaoPush); } catch (e) { /* segue */ }
}
// Recados do sw.js: "chegou processo" (consulta na hora) e "clicaram no aviso" (abre o Diário).
function pushOuvirRecados() {
  try {
    if (!('serviceWorker' in navigator)) return;
    navigator.serviceWorker.onmessage = ev => {
      const t = ev && ev.data && ev.data.tipo;
      if (t === 'push-diario') consultarAvisos();
      else if (t === 'push-aviso') { consultarAvisos(); consultarAlertasMapa(false); }
      else if (t === 'abrir-aviso') { consultarAvisos(); consultarAlertasMapa(false); }
      else if (t === 'abrir-diario') { consultarAvisos(); abrirDiarioDoAviso(); }
    };
  } catch (e) { /* segue */ }
}

function mostrarAvisoProcessos(desdeOUltimo) {
  fecharAvisoProcessos();
  const n = AVISOS.total || AVISOS.lista.length;
  const titulo = desdeOUltimo ? 'Desde o último aviso, ' + (n === 1 ? 'chegou 1 processo para você' : 'chegaram ' + n + ' processos para você') : (n === 1 ? 'Chegou 1 processo para você' : 'Chegaram ' + n + ' processos para você');
  const itens = AVISOS.lista.slice().reverse();
  const caixa = h('section', { id: 'aviso-processos', role: 'alert', 'aria-live': 'assertive', 'aria-labelledby': 'aviso-processos-titulo' },
    h('h2', { id: 'aviso-processos-titulo', texto: titulo }),
    h('p', { class: 'ajuda', texto: 'No Diário, em nome de ' + (AVISOS.colaborador || 'você') + '.' }),
    h('ul', { 'aria-label': 'Processos novos' }, itens.map(x => h('li', {}, h('strong', { texto: x.PROCESSO_SEI }), (x.FORNECEDOR || 'Fornecedor não informado') + ' • ' + dataBr(x.DATA)))),
    itens.length < n ? h('p', { class: 'ajuda', texto: 'Mostrando os ' + itens.length + ' mais recentes. Veja todos no Diário.' }) : null,
    h('div', { class: 'acoes' },
      h('button', { type: 'button', class: 'botao', texto: 'Ver no Diário', onclick: () => { AVISOS.lista = []; AVISOS.total = 0; fecharAvisoProcessos(); abrirDiarioDoAviso(); } }),
      h('button', { type: 'button', class: 'botao claro', texto: 'Fechar', onclick: () => { AVISOS.lista = []; AVISOS.total = 0; fecharAvisoProcessos(); } })));
  document.body.append(caixa);
}

// Aviso do sistema (fora da página). Só aparece se a pessoa permitiu e a aba não está à vista.
function avisoDoNavegador(novos, total) {
  try {
    if (!('Notification' in window) || Notification.permission !== 'granted' || !document.hidden) return;
    const corpo = novos.length === 1 && total <= 1 ? 'O processo ' + novos[0].PROCESSO_SEI + ' foi para você.' : textoProcessos(Math.max(total, novos.length)) + ' novos foram para você.';
    const aviso = new Notification('IGESDF • Diário de processos', { body: corpo, tag: 'diario-igesdf' });
    aviso.onclick = () => { window.focus(); abrirDiarioDoAviso(); aviso.close(); };
  } catch (e) { /* o navegador não deixou: a tela já avisou */ }
}

// Pergunta uma vez (por navegador) se a pessoa quer o aviso do navegador. A resposta vale para sempre, até ela mudar nas configurações.
function convidarParaAvisoDoNavegador() {
  try {
    if (!('Notification' in window) || Notification.permission !== 'default') return;
    if (localStorage.getItem(CHAVE_CONVITE_AVISO) === 'nao') return;
  } catch (e) { return; }
  if (document.getElementById('convite-aviso')) return;
  const fechar = lembrar => { try { if (lembrar) localStorage.setItem(CHAVE_CONVITE_AVISO, 'nao'); } catch (e) { /* segue */ } const c = document.getElementById('convite-aviso'); if (c) c.remove(); };
  const convite = h('div', { id: 'convite-aviso', class: 'aviso-toque', role: 'status', style: 'font-weight:500' },
    h('p', { style: 'margin:0 0 8px', texto: 'Quer receber um aviso neste computador quando chegar processo para você ou quando um prazo estiver perto, mesmo com o sistema fechado?' }),
    h('div', { class: 'acoes', style: 'display:flex;gap:8px;flex-wrap:wrap' },
      h('button', { type: 'button', class: 'botao claro pequeno', texto: 'Ativar o aviso', onclick: async () => {
        fechar(false);
        if (pushSuportado()) { toque(MENSAGEM_PUSH[await pushLigar(true)], 6000); return; }
        try { await Notification.requestPermission(); } catch (e) { /* segue */ }
        toque(Notification.permission === 'granted' ? 'Pronto. O navegador vai avisar quando chegar processo, com o sistema aberto em outra aba.' : 'Sem o aviso do navegador. Você ainda vê o aviso aqui na tela.', 6000);
      } }),
      h('button', { type: 'button', class: 'botao claro pequeno', texto: 'Agora não', onclick: () => fechar(false) }),
      h('button', { type: 'button', class: 'botao claro pequeno', texto: 'Não perguntar mais', onclick: () => fechar(true) })));
  document.body.append(convite);
}

// Linha extra no rodapé só quando a função do Supabase está numa versão diferente da tela (ex.: a tela foi publicada e a função ainda não foi colada).
function textoVersaoFuncao() {
  const f = estado.versaoFuncao;

function desenharRota() {
  const alvo = document.getElementById('conteudo');

  const rota = rotaAtual();

  });
  document.querySelectorAll('.menu [data-grupo]').forEach(g => { g.hidden = !(rota === g.dataset.grupo || rota.startsWith(g.dataset.grupo + '/')); });

  let conteudo;
  const itemMenu = rota.startsWith('manutencao/') ? MENU.find(m => m.rota === 'manutencao').filhos.find(f => f.rota === rota) : null;
  const rotaFornecedor = /^manutencao\/fornecedores\/([A-Z]{3}-\d{5})$/.exec(rota);

  } else if (itemMenu && itemMenu.cadastro) {
    conteudo = telaCadastro(itemMenu.cadastro);
  } else if (rota === 'admin') {
    conteudo = MODO_LOCAL ? telaAdministracaoLocal() : (pode('ADMIN') ? telaUsuarios() : semPermissao());
  } else if (rota === 'importar') {
    conteudo = MODO_LOCAL ? semPermissao() : (pode('ADMIN') ? telaImportar() : semPermissao());
  } else if (rota === 'backup') {
    conteudo = MODO_LOCAL ? semPermissao() : (pode('ADMIN') ? telaBackup() : semPermissao());
  } else if (rota === 'uso') {
    ir('manutencao/painel'); return;
  } else if (rota === 'relatorios') {
    conteudo = telaRelatorios();
  } else if (rota === 'dashboard') {

  } else if (rota === 'diario') {

  } else if (rota === 'mapa' || rota === 'mapa/painel') {
    conteudo = telaMapaPainel();
  } else if (rota === 'mapa/processos') {
    conteudo = telaMapaProcessos();
  } else if (rota === 'mapa/alertas') {
    conteudo = telaMapaProcessos('alertas');
  } else if (rota === 'notas') {

  } else if (/^notas\/NF-\d{5}\/editar$/.test(rota)) {

/* =====================================================================
   CADASTROS DA MANUTENÇÃO (Etapa 4) e TRIBUTAÇÃO (Etapa 5)
   Uma tela só serve os 6 cadastros. Ela se monta a partir da "definição"
   que o Code.gs envia (campos, tipos, listas de escolha).
   ===================================================================== */
const semAcento = t => String(t === null || t === undefined ? '' : t).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const soDigitos = t => String(t === null || t === undefined ? '' : t).replace(/\D/g, '');

function textoPct(v) { return v === '' || v === null ? '' : (Math.round(Number(v) * 1e6) / 1e4).toLocaleString('pt-BR', { maximumFractionDigits: 4 }); }
function lerPct(texto) {
  const n = Number(String(texto).trim().replace('%', '').replace(/\./g, '').replace(',', '.'));
  if (!isFinite(n) || n < 0 || n > 100) return null;
  return Number((n / 100).toFixed(6));
}
function textoMoedaCampo(v) { return v === '' || v === null ? '' : String(v).replace('.', ','); }

// Texto mostrado na tabela para cada tipo de campo.
function mostrarValor(campo, valor, referencias) {
  if (valor === '' || valor === null || valor === undefined) return '—';
  switch (campo.tipo) {
    case 'moeda': return Number(valor).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    case 'pct': return textoPct(valor) + '%';
    case 'data': return String(valor).split('-').reverse().join('/');
    case 'sn': return valor === 'SIM' ? 'Sim' : 'Não';
    default: break;
  }
  if (campo.opcoes) { const o = campo.opcoes.find(x => x.valor === valor); return o ? o.rotulo : valor; }
  if (campo.ref) { const o = (referencias[campo.n] || []).find(x => x.id === valor); return o ? o.rotulo : valor; }
  return String(valor);
}

/* =====================================================================
   PAGINAÇÃO (usada em todas as listas)
   Mostra 10 por página. A pessoa pode escolher 10, 25, 50 ou 100.
   ===================================================================== */
const OPCOES_POR_PAGINA = [10, 25, 50, 100];
function paginador(aoMudar, padrao) {
  const estado = { pagina: 1, porPagina: padrao || 10 };
  const el = h('div', { class: 'paginacao' });
  let focoPendente = null;

  function botao(texto, pagina, extra) {
    return h('button', Object.assign({ type: 'button', class: 'pg', 'data-foco': 'p' + pagina, texto,
      onclick: () => { focoPendente = 'p' + pagina; estado.pagina = pagina; aoMudar(); } }, extra || {}));
  }
  function numeros(atual, total) {
    // 1 … 4 5 6 … 20  (sempre mostra a primeira, a última e as vizinhas da atual)
    const mostrar = new Set([1, total, atual - 1, atual, atual + 1]);
    const lista = [...mostrar].filter(n => n >= 1 && n <= total).sort((a, b) => a - b);
    const saida = []; let anterior = 0;
    lista.forEach(n => {
      if (n - anterior > 1) saida.push(h('span', { class: 'reticencias', 'aria-hidden': 'true', texto: '…' }));
      saida.push(botao(String(n), n, n === atual ? { 'aria-current': 'page', 'aria-label': 'Página ' + n + ', página atual' } : { 'aria-label': 'Ir para a página ' + n }));
      anterior = n;
    });
    return saida;
  }
  function desenhar(total, paginas, inicio) {
    const fim = Math.min(total, inicio + estado.porPagina);
    const seletor = h('select', { id: 'por-pagina-' + Math.random().toString(36).slice(2, 7), 'aria-label': 'Registros por página',
      onchange: ev => { estado.porPagina = Number(ev.target.value); estado.pagina = 1; focoPendente = 'por'; aoMudar(); } },
      OPCOES_POR_PAGINA.map(n => h('option', { value: n, selected: n === estado.porPagina, texto: n })));
    seletor.setAttribute('data-foco', 'por');
    el.replaceChildren(...[
      h('div', { class: 'por-pagina' }, h('span', { texto: 'Por página:' }), seletor),
      h('div', { class: 'faixa-info', role: 'status', texto: total === 0 ? 'Nenhum registro' : 'Mostrando ' + (inicio + 1) + ' a ' + fim + ' de ' + total }),
      paginas > 1 ? h('nav', { 'aria-label': 'Páginas' },
        h('button', { type: 'button', class: 'pg', texto: 'Anterior', disabled: estado.pagina <= 1, 'data-foco': 'ant', onclick: () => { focoPendente = estado.pagina - 1 > 1 ? 'ant' : 'p1'; estado.pagina--; aoMudar(); } }),
        numeros(estado.pagina, paginas),
        h('button', { type: 'button', class: 'pg', texto: 'Próxima', disabled: estado.pagina >= paginas, 'data-foco': 'prox', onclick: () => { focoPendente = estado.pagina + 1 < paginas ? 'prox' : 'p' + paginas; estado.pagina++; aoMudar(); } })) : null].filter(Boolean));
    if (focoPendente) { const alvo = el.querySelector('[data-foco="' + focoPendente + '"]'); if (alvo && !alvo.disabled) alvo.focus(); focoPendente = null; }
  }
  return {
    el, estado,
    inicio() { estado.pagina = 1; },
    // Recebe a lista inteira e devolve só a página atual (e redesenha os controles).
    fatiar(lista) {
      const total = lista.length;
      const paginas = Math.max(1, Math.ceil(total / estado.porPagina));
      if (estado.pagina > paginas) estado.pagina = paginas;
      const inicio = (estado.pagina - 1) * estado.porPagina;
      desenhar(total, paginas, inicio);
      return lista.slice(inicio, inicio + estado.porPagina);
    }
  };
}

/* ---------- escolha de vários itens (serviços do fornecedor) ---------- */
function campoVarios(o) {
  const escolhidos = new Set(o.valores || []);
  const disponiveis = [];
  const chips = h('ul', { class: 'chips', 'aria-label': o.nomeLista || 'Escolhidos' });
  const rotuloDe = id => { const x = o.opcoes.find(y => y.id === id); return x ? x.rotulo + (x.ativo ? '' : ' (inativo)') : id; };
  function atualizar() {
    disponiveis.splice(0, disponiveis.length, ...o.opcoes.filter(x => !escolhidos.has(x.id)));
    chips.replaceChildren(...[...escolhidos].map(id => h('li', { class: 'chip' }, h('span', { texto: rotuloDe(id) }),
      h('button', { type: 'button', 'aria-label': 'Tirar ' + rotuloDe(id), texto: '×', onclick: () => { escolhidos.delete(id); atualizar(); } }))));
    chips.hidden = escolhidos.size === 0;
  }
  const combo = comboBusca({ id: o.id, opcoes: disponiveis, valor: '', placeholder: o.placeholder, aoEscolher: id => {
    if (!id) return;
    escolhidos.add(id); atualizar(); combo.value = ''; combo.entrada.value = ''; combo.entrada.focus();
  } });
  atualizar();
  const caixa = h('div', {}, combo, chips);
  caixa.valores = () => [...escolhidos];
  caixa.entrada = combo.entrada;
  return caixa;
}

// "Novo fornecedor", mas "Nova oficina".
const novoDe = def => (['oficina', 'etiqueta', 'unidade', 'fase'].includes(def.singular) ? 'Nova ' : 'Novo ') + def.singular;

/* =====================================================================
   FORMULÁRIO EM JANELA (serve para qualquer cadastro, a partir da "definição")
   Campos com "mostrarSe" só aparecem quando outro campo tem certo valor.
   ===================================================================== */
function abrirFormulario(o) {
  const def = o.def, r = o.registro, novo = !r;
  const erro = h('div');
  const entradas = {}, caixas = {};
  const grupos = def.campos.map(c => {
    const id = 'c-' + c.n;
    let entrada;
    const valor = novo ? (c.padrao || '') : r[c.n];
    if (c.ref) {
      const opcoes = ((o.referencias || {})[c.n] || []).filter(x => x.ativo || x.id === valor);
      entrada = h('select', { id, name: c.n }, h('option', { value: '', texto: c.obrigatorio ? 'Escolha…' : '— nenhum —' }),
        opcoes.map(x => h('option', { value: x.id, selected: x.id === valor, texto: x.rotulo + (x.ativo ? '' : ' (inativo)') })));
      if (!novo && c.n === 'CENTRO_PAI_ID') entrada.querySelectorAll('option').forEach(x => { if (x.value === r.ID) x.remove(); });
    } else if (c.tipo === 'sn') {
      entrada = h('select', { id, name: c.n }, h('option', { value: '', texto: c.obrigatorio ? 'Escolha…' : '— não informado —' }),
        [['SIM', 'Sim'], ['NAO', 'Não']].map(([v, t]) => h('option', { value: v, selected: v === valor, texto: t })));
    } else if (c.opcoes) {
      entrada = h('select', { id, name: c.n }, h('option', { value: '', texto: c.obrigatorio ? 'Escolha…' : '— não informado —' }),
        c.opcoes.map(x => h('option', { value: x.valor, selected: x.valor === valor, texto: x.rotulo })));
      if (novo && c.obrigatorio && c.opcoes.length === 1) entrada.value = c.opcoes[0].valor;
    } else if (c.tipo === 'data') {
      entrada = h('input', { id, name: c.n, type: 'date', value: valor });
    } else if (c.tipo === 'pct') {
      entrada = h('input', { id, name: c.n, type: 'text', inputmode: 'decimal', autocomplete: 'off', placeholder: 'Ex.: 4,65', value: textoPct(valor) });
    } else if (c.tipo === 'moeda') {
      entrada = h('input', { id, name: c.n, type: 'text', inputmode: 'decimal', autocomplete: 'off', placeholder: 'Ex.: 1234,56', value: textoMoedaCampo(valor) });
    } else if (c.tipo === 'numero') {
      entrada = h('input', { id, name: c.n, type: 'text', inputmode: 'numeric', autocomplete: 'off', value: valor });
    } else {
      entrada = h('input', { id, name: c.n, type: 'text', autocomplete: 'off', value: valor });
    }
    entradas[c.n] = entrada;
    const largo = !c.ref && c.tipo === 'texto' && ['OBJETO', 'ENDERECO', 'CONTATOS', 'DESCRICAO', 'PENDENCIA', 'NOME', 'RAZAO_SOCIAL', 'ROTULO', 'REGRA_CALCULO'].includes(c.n);
    const caixa = h('div', { class: 'campo' + (largo ? ' inteiro' : '') },
      h('label', { for: id }, c.rotulo, c.obrigatorio ? h('span', { class: 'obrig', texto: ' (obrigatório)' }) : null),
      entrada, c.ajuda ? h('p', { class: 'ajuda', texto: c.ajuda }) : null);
    caixas[c.n] = caixa;
    return caixa;
  });

  // Fornecedor e oficina: um ou mais serviços, obrigatório.
  let servicosCampo = null;
  const deQuem = def.chave === 'oficinas' ? 'da oficina' : 'do fornecedor';
  if (def.chave === 'fornecedores' || def.chave === 'oficinas') {
    servicosCampo = campoVarios({ id: 'c-SERVICOS', opcoes: (o.referencias || {}).SERVICOS || [], valores: novo ? [] : (r.SERVICOS || []),
      placeholder: 'Digite o código ou a descrição do serviço…', nomeLista: 'Serviços ' + deQuem });
    grupos.push(h('div', { class: 'campo inteiro' },
      h('label', { for: 'c-SERVICOS' }, 'Serviços ' + deQuem, h('span', { class: 'obrig', texto: ' (obrigatório)' })),
      servicosCampo, h('p', { class: 'ajuda', texto: def.chave === 'oficinas'
        ? 'Escolha um ou mais. Ao registrar a nota, a oficina só aparece para estes serviços.'
        : 'Escolha um ou mais. Ao registrar a nota, só dá para usar estes serviços.' })));
  }

  // Mostra ou esconde os campos que dependem de outro.
  function ajustarCampos() {
    def.campos.forEach(c => {
      if (!c.mostrarSe) return;
      caixas[c.n].hidden = !c.mostrarSe.valores.includes(entradas[c.mostrarSe.campo].value);
    });
  }
  def.campos.forEach(c => { if (c.mostrarSe) entradas[c.mostrarSe.campo].addEventListener('change', ajustarCampos); });
  ajustarCampos();

  const salvar = h('button', { type: 'submit', class: 'botao', texto: novo ? 'Incluir' : 'Salvar' });
  let janela;
  const form = h('form', { method: 'dialog', novalidate: true, onsubmit: ev => {
    ev.preventDefault();
    erro.replaceChildren();
    const envio = {};
    for (const c of def.campos) {
      if (caixas[c.n].hidden) { envio[c.n] = ''; continue; }
      const bruto = entradas[c.n].value.trim();
      if (c.tipo === 'pct' && bruto !== '') {
        const f = lerPct(bruto);
        if (f === null) { erro.append(caixaAviso(c.rotulo + ': informe um percentual entre 0 e 100. Exemplo: 4,65.')); entradas[c.n].focus(); return; }
        envio[c.n] = f;
      } else {

/* =====================================================================
   NOTAS FISCAIS (Etapa 6)
   Os impostos são calculados pelo sistema, com a regra do fornecedor.
   A tela só mostra a conta: valor bruto → base → alíquota → imposto → valor líquido.
   Situação da nota: Pendente (ainda não lançada) ou Lançada (já lançada no MV).
   ===================================================================== */
const moedaBr = n => (n === '' || n === null || n === undefined) ? '—' : Number(n).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const dataBr = iso => iso ? String(iso).split('-').reverse().join('/') : '—';
const competenciaBr = c => c ? String(c).split('-').reverse().join('/') : '—';
function hojeIso() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function somarDiasIso(iso, dias) {
  const p = String(iso).split('-').map(Number);
  const d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + dias));
  return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0');
}
const DIAS_VENCIMENTO = 30;
const NOMES_SITUACAO = { PENDENTE: 'Pendente', LANCADA: 'Lançada' };
const seloNota = n => h('span', { class: 'selos' },
  h('span', { class: 'selo ' + (n.SITUACAO === 'LANCADA' ? 'ativo' : 'alerta'), texto: NOMES_SITUACAO[n.SITUACAO] || n.SITUACAO }),
  n.STATUS === 'INATIVO' ? h('span', { class: 'selo inativo', texto: 'Inativa' }) : null);
const rotuloDe = (refs, campo, id) => { const o = ((refs || {})[campo] || []).find(x => x.id === id); return o ? o.rotulo : (id || ''); };
const razaoDe = rotulo => String(rotulo).split(' — ').slice(1).join(' — ') || rotulo;

// Mesmo texto que o sistema grava em "Histórico para o MV" (a tela mostra antes de salvar).
function historicoMvTexto(sei, contrato, competencia, atesto) {
  let t = 'PROCESSO: ' + sei;
  if (contrato) t += ' - CONTRATO ' + contrato;
  if (competencia) t += ' - COMP. SERVIÇO ' + competencia.split('-').reverse().join('/');
  if (atesto) t += ' - ATESTO ' + atesto.split('-').reverse().join('/');
  return t;
}
// Coloca o processo SEI no formato 00000-00000000/0000-00 enquanto a pessoa digita.
function mascaraSei(texto) {
  const d = String(texto).replace(/\D/g, '').slice(0, 19);
  return d.slice(0, 5) + (d.length > 5 ? '-' + d.slice(5, 13) : '') + (d.length > 13 ? '/' + d.slice(13, 17) : '') + (d.length > 17 ? '-' + d.slice(17, 19) : '');
}

async function copiarTexto(texto) {
  try { await navigator.clipboard.writeText(texto); return true; }
  catch (e) {
    try {
      const a = h('textarea', { style: 'position:fixed;left:-9999px;top:0', 'aria-hidden': 'true' });
      a.value = texto; document.body.append(a); a.select();
      const ok = document.execCommand('copy'); a.remove(); return ok;
    } catch (e2) { return false; }
  }
}

// Botão pequeno ao lado do número do SEI: copia o número como aparece na tela.
function botaoCopiarSei(sei) {
  const b = h('button', { type: 'button', class: 'botao-copiar', title: 'Copiar o número do SEI', 'aria-label': 'Copiar o número do SEI ' + sei }, icone('copiar'));
  b.addEventListener('click', async ev => {
    ev.stopPropagation();
    const feito = await copiarTexto(sei);
    toque(feito ? 'Número do SEI copiado: ' + sei : 'Não consegui copiar. Selecione o número e copie.', 3500);
    if (feito) { b.replaceChildren(icone('certo')); b.setAttribute('aria-label', 'Número do SEI copiado'); setTimeout(() => { b.replaceChildren(icone('copiar')); b.setAttribute('aria-label', 'Copiar o número do SEI ' + sei); }, 1500); }
  });
  return b;
}

/* ---------- campo com busca: a pessoa digita e escolhe na lista ---------- */
function comboBusca(o) {
  let escolhido = o.valor || '';
  let ativo = -1, mostrados = [];
  const idLista = o.id + '-lista';
  const entrada = h('input', { type: 'text', id: o.id, role: 'combobox', 'aria-expanded': 'false', 'aria-autocomplete': 'list', 'aria-controls': idLista, autocomplete: 'off', placeholder: o.placeholder || 'Digite para procurar…' });
  const lista = h('ul', { class: 'combo-lista', role: 'listbox', id: idLista, hidden: true });
  const caixa = h('div', { class: 'combo' }, entrada, lista);
  const rotuloAtual = () => { const x = o.opcoes.find(y => y.id === escolhido); return x ? x.rotulo : ''; };
  const casa = (rotulo, q) => {
    const texto = semAcento(rotulo), qd = soDigitos(q);
    return semAcento(q).split(/\s+/).filter(Boolean).every(t => texto.includes(t)) || (qd.length >= 3 && soDigitos(rotulo).includes(qd));
  };
  function fechar() { lista.hidden = true; entrada.setAttribute('aria-expanded', 'false'); ativo = -1; }
  function abrir() {
    const q = entrada.value.trim();
    const todos = o.opcoes.filter(x => x.ativo || x.id === escolhido);
    const filtrados = (!q || (escolhido && entrada.value === rotuloAtual())) ? todos : todos.filter(x => casa(x.rotulo, q));
    mostrados = filtrados.slice(0, 60); ativo = -1;
    lista.replaceChildren(...(mostrados.length
      ? mostrados.map((x, i) => h('li', { role: 'option', id: idLista + '-' + i, 'aria-selected': 'false', texto: x.rotulo + (x.ativo ? '' : ' (inativo)'),
          onmousedown: ev => { ev.preventDefault(); escolher(x); } }))
      : [h('li', { class: 'combo-vazio', role: 'presentation', texto: 'Nada encontrado. Confira o que você digitou.' })]));
    if (filtrados.length > 60) lista.append(h('li', { class: 'combo-vazio', role: 'presentation', texto: 'Mostrando 60 de ' + filtrados.length + '. Continue digitando para filtrar.' }));
    lista.hidden = false; entrada.setAttribute('aria-expanded', 'true');
  }
  function marcar(i) {
    ativo = i;
    [...lista.querySelectorAll('[role=option]')].forEach((li, k) => { li.setAttribute('aria-selected', k === i ? 'true' : 'false'); if (k === i) { entrada.setAttribute('aria-activedescendant', li.id); li.scrollIntoView({ block: 'nearest' }); } });
  }
  function escolher(x) { escolhido = x.id; entrada.value = x.rotulo; fechar(); if (o.aoEscolher) o.aoEscolher(x.id); }
  entrada.addEventListener('input', () => { if (escolhido) { escolhido = ''; if (o.aoEscolher) o.aoEscolher(''); } abrir(); });
  entrada.addEventListener('focus', () => { if (!entrada.readOnly && !entrada.disabled) { abrir(); } });
  entrada.addEventListener('keydown', ev => {
    if (ev.key === 'ArrowDown') { ev.preventDefault(); if (lista.hidden) abrir(); marcar(Math.min(mostrados.length - 1, ativo + 1)); }
    else if (ev.key === 'ArrowUp') { ev.preventDefault(); marcar(Math.max(0, ativo - 1)); }
    else if (ev.key === 'Enter' && !lista.hidden && ativo >= 0) { ev.preventDefault(); escolher(mostrados[ativo]); }
    else if (ev.key === 'Escape' && !lista.hidden) { ev.stopPropagation(); fechar(); }
  });
  entrada.addEventListener('blur', () => {
    // Se a pessoa digitou o texto inteiro e saiu do campo, aceita; se sobrou só uma opção, escolhe essa.
    if (!escolhido && entrada.value.trim()) {
      const exatos = o.opcoes.filter(x => (x.ativo) && semAcento(x.rotulo) === semAcento(entrada.value.trim()));
      if (exatos.length === 1) { escolher(exatos[0]); return; }
    }
    fechar();
  });
  if (escolhido) entrada.value = rotuloAtual();
  // O resto do formulário lê e grava "value" e "disabled" no elemento do campo.
  Object.defineProperty(caixa, 'value', { get: () => escolhido, set: id => { escolhido = id || ''; entrada.value = rotuloAtual(); } });
  Object.defineProperty(caixa, 'disabled', { get: () => entrada.disabled, set: b => { entrada.disabled = !!b; } });
  caixa.dataset.combo = '1'; caixa.entrada = entrada;
  return caixa;
}

/* ---------- tela com os dados para lançar no MV (uma "planilha" na vertical, com botão de copiar) ---------- */

    setTimeout(() => { if (botao.isConnected) botao.textContent = antes; }, 1600);
  };
  const linhas = d.campos.map(c => {
    const botao = h('button', { type: 'button', class: 'botao claro pequeno', texto: 'Copiar', disabled: c.valor === '' ? true : null, 'aria-label': 'Copiar ' + c.rotulo });

      h('div', { class: 'mv-valor' }, h('span', { class: 'mv-numero', texto: c.valor === '' ? '—' : c.valor }), c.descricao ? h('span', { class: 'mv-descricao', texto: ' - ' + c.descricao }) : null), botao);
  });
  const tudo = h('button', { type: 'button', class: 'botao', texto: 'Copiar tudo' });
  tudo.addEventListener('click', () => copiarEste(d.campos.map(c => c.rotulo + '\t' + c.valor).join('\n'), tudo));
  const lancar = d.nota.SITUACAO === 'PENDENTE' && pode('OPERADOR') ? h('button', { type: 'button', class: 'botao claro', texto: 'Marcar como lançada' }) : null;
  let janela;
  if (lancar) lancar.addEventListener('click', () => {

    acaoRapida({ titulo: 'Situação da nota ' + d.nota.NUMERO_NF, id, patch: { SITUACAO: 'LANCADA' }, aviso: 'Nota marcada como lançada.',

      h('div', { class: 'painel' }, h('div', { class: 'painel-corpo' }, h('h2', { texto: 'Dados da nota' }), erroForm, grade)),
      h('div', { class: 'painel' }, painelConta),

    bloco.replaceChildren(voltar, cabecalho(novo ? 'Nova nota fiscal' : 'Editar a nota ' + nota.NUMERO_NF, novo ? 'Escolha o fornecedor e o serviço. Os impostos são calculados pela tributação do fornecedor.' : null), form);

    mostrarConta({ vazio: 'Escolha o fornecedor e informe o valor bruto para ver o cálculo dos impostos.' });

/* =====================================================================
   DIÁRIO
   Todo dia chegam processos. Aqui a pessoa registra cada um (Nº do SEI, data, fornecedor)
   e o sistema distribui entre os colaboradores: quem tem menos processos no mês recebe primeiro;
   em caso de empate, vai para quem recebeu há mais tempo. A situação (Pendente / Lançada)
   é a mesma nas notas e no Diário, ligada pelo Nº do SEI.
   ===================================================================== */
function telaDiario() {
  let dados = null, cargas = null, montada = false, seq = 0;
  const presentes = new Set();
  const filtro = { de: hojeIso(), ate: hojeIso(), colaborador: '', situacao: 'TODAS', texto: '', inativos: false };
  const pag = paginador(() => desenharLinhas(), 25);

  const botaoExcel = h('button', { type: 'button', class: 'botao', texto: 'Baixar Excel', disabled: true, onclick: () => baixar('xlsx') });
  const botaoPdf = h('button', { type: 'button', class: 'botao claro', texto: 'Baixar PDF', disabled: true, onclick: () => baixar('pdf') });
  const topo = h('div'), caixaLista = h('div', { class: 'painel' }, h('div', { class: 'vazio', texto: 'Carregando…' }));
  const bloco = h('div', {}, cabecalho('Diário', 'Registre os processos que chegam, distribua entre os colaboradores e acompanhe o lançamento no MV.', h('div', { class: 'acoes-cab' }, botaoPdf, botaoExcel)), topo, caixaLista);

  const nomeColab = id => { const o = ((dados.referencias || {}).COLABORADOR_ID || []).find(x => x.id === id); return o ? String(o.rotulo).split(' — ').slice(-1)[0] : (id || ''); };
  const nomeForn = id => razaoDe(rotuloDe(dados.referencias, 'FORNECEDOR_ID', id));
  const colabAtivos = () => ((dados.referencias || {}).COLABORADOR_ID || []).filter(o => o.ativo);

  /* ----- registrar ----- */
  const erroRegistro = h('div'), dicaFila = h('p', { class: 'ajuda', role: 'status', 'aria-live': 'polite' }), painelQuem = h('div', { class: 'painel-corpo' });
  let campoSei, campoData, campoForn, campoColab, campoRateio, campoRepet, blocoRepet;

  function opcoesFornecedor() {
    return ((dados.referencias || {}).FORNECEDOR_ID || []).map(o => ({ id: o.id, ativo: o.ativo, rotulo: razaoDe(o.rotulo) + ' — ' + String(o.rotulo).split(' — ')[0] }));
  }
  // Quem marca vários nomes seguidos gera uma única consulta (espera 300 ms depois do último clique).
  let esperaCargas = null;

  async function atualizarCargas() {
    const minha = ++seq;
    try {
      const r = await chamar('diario.cargas', { data: (campoData && campoData.value) || hojeIso(), presentes: [...presentes] });
      if (minha !== seq) return;

    } catch (e) { toque(e.message, 5000); }
  }
  function desenharQuem() {
    const mesTxt = cargas.mes ? cargas.mes.split('-').reverse().join('/') : '';
    const lista = cargas.colaboradores;
    if (lista.length === 0) {
      painelQuem.replaceChildren(h('h2', { texto: 'Quem recebe hoje' }),
        caixaAviso('Ainda não há colaboradores. Cadastre-os para distribuir os processos.', 'info'),
        h('a', { class: 'botao claro pequeno', href: '#/manutencao/colaboradores', texto: 'Cadastrar colaboradores' }));
      dicaFila.textContent = ''; return;
    }
    painelQuem.replaceChildren(h('h2', { texto: 'Quem recebe hoje' }),
      h('p', { class: 'ajuda', style: 'margin:-4px 0 10px', texto: 'Desmarque quem não recebe processos hoje (folga, férias, reunião). Vale só enquanto esta tela estiver aberta.' }),
      h('ul', { class: 'quem-lista' }, lista.map(c => {
        const marca = h('input', { type: 'checkbox', id: 'quem-' + c.ID, checked: c.RECEBE ? true : null });
        marca.addEventListener('change', () => { if (marca.checked) presentes.add(c.ID); else presentes.delete(c.ID); agendarCargas(); });
        return h('li', {}, h('label', { for: 'quem-' + c.ID }, marca, h('span', { texto: c.NOME })),
          c.PROXIMO ? h('span', { class: 'selo ativo', texto: 'Próximo' }) : null,
          h('span', { class: 'carga', title: 'Processos recebidos em ' + mesTxt, texto: c.CARGA + (c.CARGA === 1 ? ' processo' : ' processos') }));
      })),
      h('p', { class: 'ajuda', style: 'margin-top:10px', texto: 'Contagem do mês ' + mesTxt + '. Regra: recebe quem tem menos processos no mês; em caso de empate, quem recebeu há mais tempo.' }));
    const prox = lista.find(c => c.PROXIMO);

  }
  function aplicarRascunhoDiario() {

  function montarRegistro() {
    campoSei = h('input', { type: 'text', id: 'd-PROCESSO_SEI', inputmode: 'numeric', maxlength: '22', autocomplete: 'off', placeholder: '04016-00130700/2026-57' });

      ...colabAtivos().map(o => h('option', { value: o.id, texto: String(o.rotulo).split(' — ').slice(-1)[0] })));
    campoRateio = h('input', { type: 'checkbox', id: 'd-RATEIO' });

    blocoRepet = h('div', { class: 'campo', hidden: true }, h('label', { for: 'd-REPETICOES', texto: 'Número de repetições (de 2 a 50)' }), campoRepet,
      h('p', { class: 'ajuda', texto: 'O processo vira uma linha para cada repetição. Cada linha vai para quem tem menos processos no mês, entre os marcados em "Quem recebe hoje".' }));
    const salvar = h('button', { type: 'submit', class: 'botao', texto: 'Registrar e distribuir' });

    const form = h('form', { novalidate: true, onsubmit: ev => {
      ev.preventDefault();
      const fornecedor = campoForn.value;
      if (!fornecedor && campoForn.entrada.value.trim()) { erroRegistro.replaceChildren(caixaAviso('Escolha o fornecedor na lista que aparece ao digitar.')); campoForn.entrada.focus(); return; }
      const faltam = [];
      if (!campoSei.value.trim()) faltam.push('Nº do SEI');
      if (!campoData.value) faltam.push('Data do processo');
      if (!fornecedor) faltam.push('Fornecedor');
      if (faltam.length) { erroRegistro.replaceChildren(caixaAviso('Preencha: ' + faltam.join(', ') + '.')); return; }
      if (soDigitos(campoSei.value).length !== 19) { erroRegistro.replaceChildren(caixaAviso('O Nº do SEI está incompleto. Use o formato 00000-00000000/0000-00.')); campoSei.focus(); return; }

      erroRegistro.replaceChildren();
      const valores = { sei: campoSei.value.trim(), data: campoData.value, fornecedor, colaborador: campoColab.value, rateio, repeticoes: rateio ? repeticoes : '' };
      const quemRecebe = [...presentes];

/* =====================================================================
   MAPA DE PROCESSOS (versão 2.0)
   Controla os processos do setor: fase, prazo, responsável, alertas e indicadores.
   - Painel: o que está vencido, o que vence em breve, quadros por responsável, tipo e fase.
   - Processos: lista com filtros, semáforo de prazo, cadastro, edição e exclusão.
   - Alertas: lista dos processos vencidos e a vencer; popup ao entrar no sistema e aviso no computador (push).
   Os dados vêm de mapa.listar. Cada pessoa escolhe os próprios dias de alerta em "Meus alertas".
   A fase de cada processo pertence a um grupo: Em curso (gera alerta), Suspenso ou Encerrado.
   ===================================================================== */
// Filtro que o Painel passa para a lista de Processos (some depois de usado).
let mapaFiltroInicial = null;

const nomeSemEmail = rotulo => String(rotulo || '').replace(/ \([^()]*\)$/, '');
const mapaAberto = r => r.STATUS === 'ATIVO' && r.GRUPO === 'EM_CURSO';
const MAPA_PRIORIDADES = [['ALTA', 'Alta'], ['MEDIA', 'Média'], ['BAIXA', 'Baixa']];
const mapaNomePrioridade = v => (MAPA_PRIORIDADES.find(x => x[0] === v) || ['', ''])[1];
const MAPA_GRUPOS = { EM_CURSO: 'Em curso', SUSPENSO: 'Suspenso', ENCERRADO: 'Encerrado' };

// "Venceu há 2 dias", "Vence hoje", "Vence em 3 dias". Sem prazo: "Sem prazo".
function mapaTextoPrazo(r) {
  if (r.DIAS === null || r.DIAS === undefined) return 'Sem prazo';
  const n = Math.abs(r.DIAS);
  if (r.DIAS < 0) return 'Venceu há ' + n + (n === 1 ? ' dia' : ' dias');
  if (r.DIAS === 0) return 'Vence hoje';
  if (r.DIAS === 1) return 'Vence amanhã';
  return 'Vence em ' + r.DIAS + ' dias';
}
// Selo do semáforo. A cor ajuda, mas o texto sempre diz a mesma coisa.
function mapaSelo(r) {
  switch (r.SEMAFORO) {
    case 'VERMELHO': return h('span', { class: 'selo vermelho', texto: mapaTextoPrazo(r) });
    case 'AMARELO': return h('span', { class: 'selo amarelo', texto: mapaTextoPrazo(r) });
    case 'VERDE': return h('span', { class: 'selo verde', texto: mapaTextoPrazo(r) });
    case 'SEM_PRAZO': return h('span', { class: 'selo', texto: 'Sem prazo' });
    case 'SUSPENSO': return h('span', { class: 'selo inativo', texto: 'Suspenso' });
    case 'FECHADO': return h('span', { class: 'selo inativo', texto: r.DATA_CONCLUSAO ? 'Encerrado em ' + dataBr(r.DATA_CONCLUSAO) : 'Encerrado' });
    default: return h('span', { class: 'selo inativo', texto: 'Inativo' });
  }
}
function mapaNomeRef(dados, chave, id) {
  const o = ((dados.referencias || {})[chave] || []).find(x => x.id === id);
  return o ? (chave === 'USUARIOS' ? nomeSemEmail(o.rotulo) : o.rotulo) : (chave === 'USUARIOS' ? (id || '') : '');
}
const mapaNomeUsuario = (dados, id) => mapaNomeRef(dados, 'USUARIOS', id);
const mapaNomeEtiqueta = (dados, id) => mapaNomeRef(dados, 'ETIQUETAS', id);
function mapaNomeFase(dados, id) {
  const o = (dados.fases || []).find(x => x.id === id);
  return o ? o.rotulo : '';
}

/* ---------- Itens que o usuário cria na hora (tipo, unidade, fase, etiqueta) ---------- */
const MAPA_ITENS = {
  tipo: { chave: 'TIPOS', nome: 'tipo de processo', um: 'um', titulo: 'Novo tipo de processo', rotulo: 'Nome do tipo', exemplo: 'Ex.: Gerencial' },
  unidade: { chave: 'UNIDADES', nome: 'unidade', um: 'uma', titulo: 'Nova unidade', rotulo: 'Sigla da unidade', exemplo: 'Ex.: NUCON' },
  fase: { chave: null, nome: 'fase', um: 'uma', titulo: 'Nova fase', rotulo: 'Nome da fase', exemplo: 'Ex.: Aguardando assinatura' },
  etiqueta: { chave: 'ETIQUETAS', nome: 'etiqueta', um: 'uma', titulo: 'Nova etiqueta do SEI', rotulo: 'Nome da etiqueta', exemplo: 'Escreva como aparece no SEI' }
};
// Lista atual de um tipo de item (as fases ficam em dados.fases; as outras listas, em dados.referencias).
function mapaItensDe(dados, item) { return item === 'fase' ? (dados.fases || []) : ((dados.referencias || {})[MAPA_ITENS[item].chave] || []); }
function mapaGuardarItens(dados, item, lista) {
  if (item === 'fase') dados.fases = lista; else { dados.referencias = dados.referencias || {}; dados.referencias[MAPA_ITENS[item].chave] = lista; }
}
// Janela pequena: pede o nome (e, para fase, o grupo) e cria o item. Depois devolve o id para a lista já escolher o novo item.
function mapaJanelaNovoItem(dados, item, aoCriar) {

  const salvar = h('button', { type: 'submit', class: 'botao', texto: 'Criar' });

    h('div', { class: 'jan-pe' }, h('button', { type: 'button', class: 'botao claro', texto: 'Cancelar', onclick: () => janela.close() }), salvar));
  janela = abrirJanela(form);

// Carrega o Mapa uma vez para as duas telas.
async function mapaCarregar() { return chamar('mapa.listar', {}, { semCache: true }); }

/* ---------- Relatórios do Mapa (Excel e PDF, feitos na tela com os mesmos filtros) ---------- */
// Texto da situação do prazo (o mesmo do selo colorido da tela).
function mapaTextoSituacao(r) {
  switch (r.SEMAFORO) {
    case 'VERMELHO': case 'AMARELO': case 'VERDE': return mapaTextoPrazo(r);
    case 'SEM_PRAZO': return 'Sem prazo';
    case 'SUSPENSO': return 'Suspenso';
    case 'FECHADO': return r.DATA_CONCLUSAO ? 'Encerrado em ' + dataBr(r.DATA_CONCLUSAO) : 'Encerrado';
    default: return 'Inativo';
  }
}
// Colunas do relatório de processos. "pdf: false" = só entra no Excel (o PDF é uma folha A4 deitada e não comporta tudo).
function mapaColunasLista(dados) {
  const nomes = ids => (ids || []).map(id => mapaNomeUsuario(dados, id)).join(', ');
  return [
    { t: 'Prazo', f: r => r.PRAZO && r.SEM_PRAZO !== 'SIM' ? dataBr(r.PRAZO) : '—' },
    { t: 'Situação do prazo', f: r => mapaTextoSituacao(r) },
    { t: 'Nº do SEI', f: r => r.NUMERO_SEI },
    { t: 'Assunto', f: r => r.ASSUNTO },
    { t: 'Tipo de processo', f: r => mapaNomeRef(dados, 'TIPOS', r.TIPO_ID) },
    { t: 'Unidade', f: r => mapaNomeRef(dados, 'UNIDADES', r.UNIDADE_ID) },
    { t: 'Fase', f: r => mapaNomeFase(dados, r.FASE_ID) },
    { t: 'Prioridade', f: r => mapaNomePrioridade(r.PRIORIDADE) },
    { t: 'Responsável', f: r => r.RESPONSAVEL_ID ? mapaNomeUsuario(dados, r.RESPONSAVEL_ID) : 'Sem responsável' },
    { t: 'Etiqueta do SEI', f: r => mapaNomeEtiqueta(dados, r.ETIQUETA_ID) },
    { t: 'Acompanhantes', f: r => nomes(r.ACOMPANHANTES), pdf: false },
    { t: 'Data de abertura', f: r => r.DATA_RECEBIMENTO ? dataBr(r.DATA_RECEBIMENTO) : '', pdf: false },
    { t: 'Data de conclusão', f: r => r.DATA_CONCLUSAO ? dataBr(r.DATA_CONCLUSAO) : '', pdf: false },
    { t: 'Palavra-chave', f: r => r.PALAVRA_CHAVE || '', pdf: false },
    { t: 'Observação', f: r => r.OBSERVACAO || '', pdf: false },
    { t: 'Cadastro', f: r => r.STATUS === 'ATIVO' ? 'Ativo' : 'Inativo', pdf: false }
  ];
}
// Texto dos filtros usados na tela, para o cabeçalho do relatório.
function mapaDescricaoFiltros(dados, f) {
  const partes = [];
  const fasesTxt = { ABERTAS: 'Em curso', VIVOS: 'Em curso e suspensos', SUSPENSO: 'Suspensos', ENCERRADO: 'Encerrados', TODAS: 'Todas' };
  partes.push('Fase: ' + (fasesTxt[f.fase] || mapaNomeFase(dados, f.fase) || f.fase));
  const prazos = { CRITICOS: 'vencidos e a vencer', VENCIDOS: 'vencidos', BREVE: 'vencem em breve', NO_PRAZO: 'no prazo', SEM_PRAZO: 'sem prazo' };
  if (f.prazo) partes.push('Prazo: ' + prazos[f.prazo]);
  if (f.responsavel) partes.push('Responsável: ' + (f.responsavel === 'NENHUM' ? 'sem responsável' : f.responsavel === 'MEUS' ? 'os meus' : mapaNomeUsuario(dados, f.responsavel)));
  if (f.tipo) partes.push('Tipo: ' + (f.tipo === 'NENHUM' ? 'sem tipo' : mapaNomeRef(dados, 'TIPOS', f.tipo)));
  if (f.unidade) partes.push('Unidade: ' + (f.unidade === 'NENHUM' ? 'sem unidade' : mapaNomeRef(dados, 'UNIDADES', f.unidade)));
  if (f.prioridade) partes.push('Prioridade: ' + mapaNomePrioridade(f.prioridade));
  if (f.etiqueta) partes.push('Etiqueta: ' + (f.etiqueta === 'NENHUM' ? 'sem etiqueta' : mapaNomeEtiqueta(dados, f.etiqueta)));
  if (String(f.texto || '').trim()) partes.push('Busca: ' + String(f.texto).trim());
  if (f.inativos) partes.push('com inativos');
  return partes.join(' • ');
}
// Gera o arquivo da lista que a tela mostra agora (mesmos filtros e mesma ordem).
function mapaBaixarLista(formato, dados, lista, descricao, alertas) {
  const colunas = mapaColunasLista(dados).filter(c => formato === 'xlsx' || c.pdf !== false);
  const n = lista.length;
  return baixarTabela(formato, {
    arquivo: alertas ? 'mapa-alertas' : 'mapa-processos', aba: alertas ? 'Alertas de prazo' : 'Processos',
    titulo: alertas ? 'IGESDF — Mapa de processos: alertas de prazo' : 'IGESDF — Mapa de processos',
    info: ['Filtros: ' + descricao, 'Quantidade: ' + n + (n === 1 ? ' processo' : ' processos')],
    colunas: colunas.map(c => ({ t: c.t })), linhas: lista.map(r => colunas.map(c => c.f(r))),
    total: ['Total: ' + n + (n === 1 ? ' processo' : ' processos')].concat(colunas.slice(1).map(() => null))
  });
}
// Os dois botões de relatório que ficam no alto das telas do Mapa.

}
function mapaTentar(formato, trabalho) {

function telaMapaPainel() {

  // Quadro com uma linha por item e um botão que abre a lista já filtrada.
  function quadro(titulo, colunas, linhas, rotuloCol) {

    const tab = h('div', { class: 'tabela-caixa' }, h('table', { class: 'tabela-notas tabela-mapa' },
      h('thead', {}, h('tr', {}, [rotuloCol].concat(colunas).map(t => h('th', { scope: 'col', texto: t })), h('th', { scope: 'col' }, h('span', { class: 'so-leitor', texto: 'Ações' })))),
