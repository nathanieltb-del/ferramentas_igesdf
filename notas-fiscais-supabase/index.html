/* =====================================================================
   CADASTROS DA MANUTENÇÃO (Etapa 4) e TRIBUTAÇÃO (Etapa 5)
   Uma tela só serve os 6 cadastros. Ela se monta a partir da "definição"
   que o Code.gs envia (campos, tipos, listas de escolha).
   ===================================================================== */
const semAcento = t => String(t === null || t === undefined ? '' : t).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const soDigitos = t => String(t === null || t === undefined ? '' : t).replace(/\D/g, '');

function textoPct(v) { return v === '' || v === null ? '' : (Math.round(Number(v) * 1e6) / 1e4).toLocaleString('pt-BR', { maximumFractionDigits: 4 }); }
function lerPct(texto) {
  const n = Number(String(texto).trim().replace('%', '').replace(/\./g, '').replace(',', '.'));
  if (!isFinite(n) || n < 0 || n > 100) return null;
  return Number((n / 100).toFixed(6));
}
function textoMoedaCampo(v) { return v === '' || v === null ? '' : String(v).replace('.', ','); }

// Texto mostrado na tabela para cada tipo de campo.
function mostrarValor(campo, valor, referencias) {
  if (valor === '' || valor === null || valor === undefined) return '—';
  switch (campo.tipo) {
    case 'moeda': return Number(valor).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    case 'pct': return textoPct(valor) + '%';
    case 'data': return String(valor).split('-').reverse().join('/');
    case 'sn': return valor === 'SIM' ? 'Sim' : 'Não';
    default: break;
  }
  if (campo.opcoes) { const o = campo.opcoes.find(x => x.valor === valor); return o ? o.rotulo : valor; }
  if (campo.ref) { const o = (referencias[campo.n] || []).find(x => x.id === valor); return o ? o.rotulo : valor; }
  return String(valor);
}

/* =====================================================================
   PAGINAÇÃO (usada em todas as listas)
   Mostra 10 por página. A pessoa pode escolher 10, 25, 50 ou 100.
   ===================================================================== */
const OPCOES_POR_PAGINA = [10, 25, 50, 100];
function paginador(aoMudar, padrao) {
  const estado = { pagina: 1, porPagina: padrao || 10 };
  const el = h('div', { class: 'paginacao' });
  let focoPendente = null;

  function botao(texto, pagina, extra) {
    return h('button', Object.assign({ type: 'button', class: 'pg', 'data-foco': 'p' + pagina, texto,
      onclick: () => { focoPendente = 'p' + pagina; estado.pagina = pagina; aoMudar(); } }, extra || {}));
  }
  function numeros(atual, total) {
    // 1 … 4 5 6 … 20  (sempre mostra a primeira, a última e as vizinhas da atual)
    const mostrar = new Set([1, total, atual - 1, atual, atual + 1]);
    const lista = [...mostrar].filter(n => n >= 1 && n <= total).sort((a, b) => a - b);
    const saida = []; let anterior = 0;
    lista.forEach(n => {
      if (n - anterior > 1) saida.push(h('span', { class: 'reticencias', 'aria-hidden': 'true', texto: '…' }));
      saida.push(botao(String(n), n, n === atual ? { 'aria-current': 'page', 'aria-label': 'Página ' + n + ', página atual' } : { 'aria-label': 'Ir para a página ' + n }));
      anterior = n;
    });
    return saida;
  }
  function desenhar(total, paginas, inicio) {
    const fim = Math.min(total, inicio + estado.porPagina);
    const seletor = h('select', { id: 'por-pagina-' + Math.random().toString(36).slice(2, 7), 'aria-label': 'Registros por página',
      onchange: ev => { estado.porPagina = Number(ev.target.value); estado.pagina = 1; focoPendente = 'por'; aoMudar(); } },
      OPCOES_POR_PAGINA.map(n => h('option', { value: n, selected: n === estado.porPagina, texto: n })));
    seletor.setAttribute('data-foco', 'por');
    el.replaceChildren(...[
      h('div', { class: 'por-pagina' }, h('span', { texto: 'Por página:' }), seletor),
      h('div', { class: 'faixa-info', role: 'status', texto: total === 0 ? 'Nenhum registro' : 'Mostrando ' + (inicio + 1) + ' a ' + fim + ' de ' + total }),
      paginas > 1 ? h('nav', { 'aria-label': 'Páginas' },
        h('button', { type: 'button', class: 'pg', texto: 'Anterior', disabled: estado.pagina <= 1, 'data-foco': 'ant', onclick: () => { focoPendente = estado.pagina - 1 > 1 ? 'ant' : 'p1'; estado.pagina--; aoMudar(); } }),
        numeros(estado.pagina, paginas),
        h('button', { type: 'button', class: 'pg', texto: 'Próxima', disabled: estado.pagina >= paginas, 'data-foco': 'prox', onclick: () => { focoPendente = estado.pagina + 1 < paginas ? 'prox' : 'p' + paginas; estado.pagina++; aoMudar(); } })) : null].filter(Boolean));
    if (focoPendente) { const alvo = el.querySelector('[data-foco="' + focoPendente + '"]'); if (alvo && !alvo.disabled) alvo.focus(); focoPendente = null; }
  }
  return {
    el, estado,
    inicio() { estado.pagina = 1; },
    // Recebe a lista inteira e devolve só a página atual (e redesenha os controles).
    fatiar(lista) {
      const total = lista.length;
      const paginas = Math.max(1, Math.ceil(total / estado.porPagina));
      if (estado.pagina > paginas) estado.pagina = paginas;
      const inicio = (estado.pagina - 1) * estado.porPagina;
      desenhar(total, paginas, inicio);
      return lista.slice(inicio, inicio + estado.porPagina);
    }
  };
}

/* =====================================================================
   FORMULÁRIO EM JANELA (serve para qualquer cadastro, a partir da "definição")
   Campos com "mostrarSe" só aparecem quando outro campo tem certo valor.
   ===================================================================== */
function abrirFormulario(o) {
  const def = o.def, r = o.registro, novo = !r;
  const erro = h('div');
  const entradas = {}, caixas = {};
  const grupos = def.campos.map(c => {
    const id = 'c-' + c.n;
    let entrada;
    const valor = novo ? (c.padrao || '') : r[c.n];
    if (c.ref) {
      const opcoes = ((o.referencias || {})[c.n] || []).filter(x => x.ativo || x.id === valor);
      entrada = h('select', { id, name: c.n }, h('option', { value: '', texto: c.obrigatorio ? 'Escolha…' : '— nenhum —' }),
        opcoes.map(x => h('option', { value: x.id, selected: x.id === valor, texto: x.rotulo + (x.ativo ? '' : ' (inativo)') })));
      if (!novo && c.n === 'CENTRO_PAI_ID') entrada.querySelectorAll('option').forEach(x => { if (x.value === r.ID) x.remove(); });
    } else if (c.tipo === 'sn') {
      entrada = h('select', { id, name: c.n }, h('option', { value: '', texto: c.obrigatorio ? 'Escolha…' : '— não informado —' }),
        [['SIM', 'Sim'], ['NAO', 'Não']].map(([v, t]) => h('option', { value: v, selected: v === valor, texto: t })));
    } else if (c.opcoes) {
      entrada = h('select', { id, name: c.n }, h('option', { value: '', texto: c.obrigatorio ? 'Escolha…' : '— não informado —' }),
        c.opcoes.map(x => h('option', { value: x.valor, selected: x.valor === valor, texto: x.rotulo })));
      if (novo && c.obrigatorio && c.opcoes.length === 1) entrada.value = c.opcoes[0].valor;
    } else if (c.tipo === 'data') {
      entrada = h('input', { id, name: c.n, type: 'date', value: valor });
    } else if (c.tipo === 'pct') {
      entrada = h('input', { id, name: c.n, type: 'text', inputmode: 'decimal', autocomplete: 'off', placeholder: 'Ex.: 4,65', value: textoPct(valor) });
    } else if (c.tipo === 'moeda') {
      entrada = h('input', { id, name: c.n, type: 'text', inputmode: 'decimal', autocomplete: 'off', placeholder: 'Ex.: 1234,56', value: textoMoedaCampo(valor) });
    } else if (c.tipo === 'numero') {
      entrada = h('input', { id, name: c.n, type: 'text', inputmode: 'numeric', autocomplete: 'off', value: valor });
    } else {
      entrada = h('input', { id, name: c.n, type: 'text', autocomplete: 'off', value: valor });
    }
    entradas[c.n] = entrada;
    const largo = !c.ref && c.tipo === 'texto' && ['OBJETO', 'ENDERECO', 'CONTATOS', 'DESCRICAO', 'PENDENCIA', 'NOME', 'RAZAO_SOCIAL', 'ROTULO', 'REGRA_CALCULO'].includes(c.n);
    const caixa = h('div', { class: 'campo' + (largo ? ' inteiro' : '') },
      h('label', { for: id }, c.rotulo, c.obrigatorio ? h('span', { class: 'obrig', texto: ' (obrigatório)' }) : null),
      entrada, c.ajuda ? h('p', { class: 'ajuda', texto: c.ajuda }) : null);
    caixas[c.n] = caixa;
    return caixa;
  });

  // Mostra ou esconde os campos que dependem de outro.
  function ajustarCampos() {
    def.campos.forEach(c => {
      if (!c.mostrarSe) return;
      caixas[c.n].hidden = !c.mostrarSe.valores.includes(entradas[c.mostrarSe.campo].value);
    });
  }
  def.campos.forEach(c => { if (c.mostrarSe) entradas[c.mostrarSe.campo].addEventListener('change', ajustarCampos); });
  ajustarCampos();

  const salvar = h('button', { type: 'submit', class: 'botao', texto: novo ? 'Incluir' : 'Salvar' });
  let janela;
  const form = h('form', { method: 'dialog', novalidate: true, onsubmit: ev => {
    ev.preventDefault();
    erro.replaceChildren();
    const envio = {};
    for (const c of def.campos) {
      if (caixas[c.n].hidden) { envio[c.n] = ''; continue; }
      const bruto = entradas[c.n].value.trim();
      if (c.tipo === 'pct' && bruto !== '') {
        const f = lerPct(bruto);
        if (f === null) { erro.append(caixaAviso(c.rotulo + ': informe um percentual entre 0 e 100. Exemplo: 4,65.')); entradas[c.n].focus(); return; }
        envio[c.n] = f;
      } else {
        envio[c.n] = bruto;
      }
      if (c.obrigatorio && bruto === '') { erro.append(caixaAviso('Preencha o campo "' + c.rotulo + '".')); entradas[c.n].focus(); return; }
    }
    enviar(salvar, erro, 'Salvando…', async () => {
      await o.salvar(envio);
      janela.close();
      if (o.depois) await o.depois();
      toque(novo ? 'Incluído.' : 'Alterações salvas.');
    });
  } },
    h('div', { class: 'jan-corpo' }, h('h2', { texto: o.titulo || (novo ? 'Novo ' + def.singular : 'Editar ' + def.singular) }), o.texto ? h('p', { class: 'ajuda-janela', texto: o.texto }) : null, erro, h('div', { class: 'grade-campos' }, grupos)),
    h('div', { class: 'jan-pe' }, h('button', { type: 'button', class: 'botao claro', texto: 'Cancelar', onclick: () => janela.close() }), salvar));
  janela = abrirJanela(form, 'larga');
  const primeiro = form.querySelector('input, select'); if (primeiro) primeiro.focus();
}

// Abas da tela de Fornecedores: o cadastro e a tributação de todos eles.

function telaCadastro(chave) {
  let dados = null;
  const topo = h('div', { class: 'cabecalho' }, h('div', {}, h('h1', { texto: 'Carregando…' })));
  const caixa = h('div', { class: 'painel' }, h('div', { class: 'vazio', texto: 'Carregando…' }));
  const bloco = h('div', {}, topo, chave === 'fornecedores' ? abasFornecedores('manutencao/fornecedores') : null, caixa);
  const filtro = { texto: '', situacao: 'ATIVO' };
  const pag = paginador(() => atualizarLinhas());
  let atualizarLinhas = () => {};

  async function carregar() {
    try {
      dados = await chamar('cadastros.listar', { cadastro: chave });
      desenhar();
    } catch (e) {
      caixa.replaceChildren(h('div', { class: 'painel-corpo' }, caixaAviso(e.message),
        h('button', { type: 'button', class: 'botao claro', texto: 'Tentar de novo', onclick: () => { caixa.replaceChildren(h('div', { class: 'vazio', texto: 'Carregando…' })); carregar(); } })));
    }
  }

  function achar(r) {
    const q = semAcento(filtro.texto).trim();
    if (!q) return true;
    const qd = soDigitos(q);
    return dados.definicao.busca.some(n => semAcento(r[n]).includes(q) || (qd.length >= 3 && soDigitos(r[n]).includes(qd)));
  }

  function selosDe(r) {
    const def = dados.definicao;
    const lista = [h('span', { class: 'selo ' + (r.STATUS === 'ATIVO' ? 'ativo' : 'inativo'), texto: r.STATUS === 'ATIVO' ? 'Ativo' : 'Inativo' })];
    def.avisos.forEach(a => {
      const v = r[a.campo];
      if ((a.igual !== undefined && v === a.igual) || (a.naoVazio && v)) lista.push(h('span', { class: 'selo alerta', texto: a.texto, title: a.naoVazio ? String(v) : '' }));
    });
    return h('span', { class: 'selos' }, lista);
  }

  function desenhar() {
    const def = dados.definicao;
    const gravar = pode('GESTOR');
    topo.replaceChildren(h('div', {}, h('h1', { texto: def.titulo }), h('p', { texto: gravar ? 'Consulte, inclua, altere e inative. Nada é apagado.' : 'Consulta. Quem altera os cadastros é o gestor ou o administrador.' })),
      gravar ? h('button', { type: 'button', class: 'botao', texto: 'Novo ' + def.singular, onclick: () => janelaCadastro(null) }) : null);
    const campoPorNome = {}; def.campos.forEach(c => { campoPorNome[c.n] = c; });
    const colunas = def.lista.map(n => campoPorNome[n]);

    const busca = h('input', { type: 'search', id: 'busca-cad', placeholder: 'Pesquisar…', autocomplete: 'off', 'aria-label': 'Pesquisar em ' + def.titulo, value: filtro.texto });
    const situacao = h('select', { 'aria-label': 'Situação', onchange: ev => { filtro.situacao = ev.target.value; pag.inicio(); atualizarLinhas(); } },
      [['ATIVO', 'Só ativos'], ['INATIVO', 'Só inativos'], ['TODOS', 'Todos']].map(([v, t]) => h('option', { value: v, selected: filtro.situacao === v, texto: t })));
    const contagem = h('span', { class: 'contagem', role: 'status' });
    busca.addEventListener('input', () => { filtro.texto = busca.value; pag.inicio(); atualizarLinhas(); });
    const corpoTabela = h('tbody');
    const vazio = h('div', { class: 'vazio', hidden: true });
    const tabela = h('div', { class: 'tabela-caixa' }, h('table', {},
      h('thead', {}, h('tr', {}, colunas.map(c => h('th', { scope: 'col', texto: c.rotulo })), h('th', { scope: 'col', texto: 'Situação' }), h('th', { scope: 'col' }, h('span', { class: 'so-leitor', texto: 'Ações' })))),
      corpoTabela));

    atualizarLinhas = function () {
      const visiveis = dados.registros.filter(r => (filtro.situacao === 'TODOS' || r.STATUS === filtro.situacao) && achar(r));
      const pagina = pag.fatiar(visiveis);
      corpoTabela.replaceChildren(...pagina.map(r => {
        const nome = mostrarValor(colunas[0], r[colunas[0].n], dados.referencias);
        return h('tr', {},

/* =====================================================================
   NOTAS FISCAIS (Etapa 6)
   Os impostos são calculados pelo sistema, com a regra do fornecedor.
   A tela só mostra a conta: valor bruto → base → alíquota → imposto → valor líquido.
   Situação da nota: Pendente (ainda não lançada) ou Lançada (já lançada no MV).

const moedaBr = n => (n === '' || n === null || n === undefined) ? '—' : Number(n).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const dataBr = iso => iso ? String(iso).split('-').reverse().join('/') : '—';
const competenciaBr = c => c ? String(c).split('-').reverse().join('/') : '—';
function hojeIso() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function somarDiasIso(iso, dias) {
  const p = String(iso).split('-').map(Number);
  const d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + dias));
  return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0');
}
const DIAS_VENCIMENTO = 30;
const NOMES_SITUACAO = { PENDENTE: 'Pendente', LANCADA: 'Lançada' };
const seloNota = n => h('span', { class: 'selos' },
  h('span', { class: 'selo ' + (n.SITUACAO === 'LANCADA' ? 'ativo' : 'alerta'), texto: NOMES_SITUACAO[n.SITUACAO] || n.SITUACAO }),
  n.STATUS === 'INATIVO' ? h('span', { class: 'selo inativo', texto: 'Inativa' }) : null);
const rotuloDe = (refs, campo, id) => { const o = ((refs || {})[campo] || []).find(x => x.id === id); return o ? o.rotulo : (id || ''); };
const razaoDe = rotulo => String(rotulo).split(' — ').slice(1).join(' — ') || rotulo;

// Mesmo texto que o sistema grava em "Histórico para o MV" (a tela mostra antes de salvar).
function historicoMvTexto(sei, contrato, competencia, atesto) {
  let t = 'PROCESSO: ' + sei;
  if (contrato) t += ' - CONTRATO ' + contrato;
  if (competencia) t += ' - COMP. SERVIÇO ' + competencia.split('-').reverse().join('/');
  if (atesto) t += ' - ATESTO ' + atesto.split('-').reverse().join('/');
  return t;
}
// Coloca o processo SEI no formato 00000-00000000/0000-00 enquanto a pessoa digita.
function mascaraSei(texto) {
  const d = String(texto).replace(/\D/g, '').slice(0, 19);
  return d.slice(0, 5) + (d.length > 5 ? '-' + d.slice(5, 13) : '') + (d.length > 13 ? '/' + d.slice(13, 17) : '') + (d.length > 17 ? '-' + d.slice(17, 19) : '');
}

async function copiarTexto(texto) {
  try { await navigator.clipboard.writeText(texto); return true; }
  catch (e) {
    try {
      const a = h('textarea', { style: 'position:fixed;left:-9999px;top:0', 'aria-hidden': 'true' });
      a.value = texto; document.body.append(a); a.select();
      const ok = document.execCommand('copy'); a.remove(); return ok;
    } catch (e2) { return false; }
  }
}

/* ---------- campo com busca: a pessoa digita e escolhe na lista ---------- */
function comboBusca(o) {
  let escolhido = o.valor || '';
  let ativo = -1, mostrados = [];
  const idLista = o.id + '-lista';
  const entrada = h('input', { type: 'text', id: o.id, role: 'combobox', 'aria-expanded': 'false', 'aria-autocomplete': 'list', 'aria-controls': idLista, autocomplete: 'off', placeholder: o.placeholder || 'Digite para procurar…' });
  const lista = h('ul', { class: 'combo-lista', role: 'listbox', id: idLista, hidden: true });
  const caixa = h('div', { class: 'combo' }, entrada, lista);
  const rotuloAtual = () => { const x = o.opcoes.find(y => y.id === escolhido); return x ? x.rotulo : ''; };
  const casa = (rotulo, q) => {
    const texto = semAcento(rotulo), qd = soDigitos(q);
    return semAcento(q).split(/\s+/).filter(Boolean).every(t => texto.includes(t)) || (qd.length >= 3 && soDigitos(rotulo).includes(qd));
  };
  function fechar() { lista.hidden = true; entrada.setAttribute('aria-expanded', 'false'); ativo = -1; }
  function abrir() {
    const q = entrada.value.trim();
    const todos = o.opcoes.filter(x => x.ativo || x.id === escolhido);
    const filtrados = (!q || (escolhido && entrada.value === rotuloAtual())) ? todos : todos.filter(x => casa(x.rotulo, q));
    mostrados = filtrados.slice(0, 60); ativo = -1;
    lista.replaceChildren(...(mostrados.length
      ? mostrados.map((x, i) => h('li', { role: 'option', id: idLista + '-' + i, 'aria-selected': 'false', texto: x.rotulo + (x.ativo ? '' : ' (inativo)'),
          onmousedown: ev => { ev.preventDefault(); escolher(x); } }))
      : [h('li', { class: 'combo-vazio', role: 'presentation', texto: 'Nada encontrado. Confira o que você digitou.' })]));
    if (filtrados.length > 60) lista.append(h('li', { class: 'combo-vazio', role: 'presentation', texto: 'Mostrando 60 de ' + filtrados.length + '. Continue digitando para filtrar.' }));
    lista.hidden = false; entrada.setAttribute('aria-expanded', 'true');
  }
  function marcar(i) {
    ativo = i;
    [...lista.querySelectorAll('[role=option]')].forEach((li, k) => { li.setAttribute('aria-selected', k === i ? 'true' : 'false'); if (k === i) { entrada.setAttribute('aria-activedescendant', li.id); li.scrollIntoView({ block: 'nearest' }); } });
  }
  function escolher(x) { escolhido = x.id; entrada.value = x.rotulo; fechar(); if (o.aoEscolher) o.aoEscolher(x.id); }
  entrada.addEventListener('input', () => { if (escolhido) { escolhido = ''; if (o.aoEscolher) o.aoEscolher(''); } abrir(); });
  entrada.addEventListener('focus', () => { if (!entrada.readOnly && !entrada.disabled) { abrir(); } });
  entrada.addEventListener('keydown', ev => {
    if (ev.key === 'ArrowDown') { ev.preventDefault(); if (lista.hidden) abrir(); marcar(Math.min(mostrados.length - 1, ativo + 1)); }
    else if (ev.key === 'ArrowUp') { ev.preventDefault(); marcar(Math.max(0, ativo - 1)); }
    else if (ev.key === 'Enter' && !lista.hidden && ativo >= 0) { ev.preventDefault(); escolher(mostrados[ativo]); }
    else if (ev.key === 'Escape' && !lista.hidden) { ev.stopPropagation(); fechar(); }
  });
  entrada.addEventListener('blur', () => {
    // Se a pessoa digitou o texto inteiro e saiu do campo, aceita; se sobrou só uma opção, escolhe essa.
    if (!escolhido && entrada.value.trim()) {
      const exatos = o.opcoes.filter(x => (x.ativo) && semAcento(x.rotulo) === semAcento(entrada.value.trim()));
      if (exatos.length === 1) { escolher(exatos[0]); return; }
    }
    fechar();
  });
  if (escolhido) entrada.value = rotuloAtual();
  // O resto do formulário lê e grava "value" e "disabled" no elemento do campo.
  Object.defineProperty(caixa, 'value', { get: () => escolhido, set: id => { escolhido = id || ''; entrada.value = rotuloAtual(); } });
  Object.defineProperty(caixa, 'disabled', { get: () => entrada.disabled, set: b => { entrada.disabled = !!b; } });
  caixa.dataset.combo = '1'; caixa.entrada = entrada;
  return caixa;
}

/* ---------- lista ---------- */
function telaNotas() {
  let dados = null;
  const filtro = { texto: '', situacao: 'TODAS', competencia: '', fornecedor: '', inativas: false };
  const pag = paginador(() => desenharLinhas(), 25);
  const caixa = h('div', { class: 'painel' }, h('div', { class: 'vazio', texto: 'Carregando…' }));
  const bloco = h('div', {}, cabecalho('Notas fiscais', 'Registre as notas, confira as retenções e prepare o lançamento no MV.',
    pode('OPERADOR') ? h('button', { type: 'button', class: 'botao', texto: 'Nova nota', onclick: () => ir('notas/nova') }) : null), caixa);
  const corpo = h('tbody'), vazio = h('div', { class: 'vazio', hidden: true }), contagem = h('span', { class: 'contagem', role: 'status' });
  const totais = h('div', { class: 'totais', 'aria-live': 'polite' });
  let tabela;

  function achar(n) {
    if (!filtro.inativas && n.STATUS !== 'ATIVO') return false;
    if (filtro.situacao !== 'TODAS' && n.SITUACAO !== filtro.situacao) return false;
    if (filtro.competencia && n.COMPETENCIA !== filtro.competencia) return false;
    if (filtro.fornecedor && n.FORNECEDOR_ID !== filtro.fornecedor) return false;
    const q = semAcento(filtro.texto).trim();
    if (!q) return true;
    const qd = soDigitos(q);
    const forn = rotuloDe(dados.referencias, 'FORNECEDOR_ID', n.FORNECEDOR_ID);
    return semAcento([n.NUMERO_NF, n.PROCESSO_SEI, n.CONTRATO, forn, rotuloDe(dados.referencias, 'SERVICO_ID', n.SERVICO_ID), n.OBSERVACOES].join(' ')).includes(q) || (qd.length >= 3 && soDigitos(forn + ' ' + n.PROCESSO_SEI).includes(qd));
  }

  // "Excluir" tira a nota da lista e dos relatórios, mas guarda o registro. Dá para restaurar em "Mostrar inativas".
  function excluir(n) {
    janelaConfirmar('Excluir a nota ' + n.NUMERO_NF + '?', 'A nota sai da lista e dos relatórios, mas continua guardada. Para vê-la ou restaurá-la, marque "Mostrar inativas".', 'Excluir', true,
      async () => { await chamar('notas.inativar', { ID: n.ID }); await carregar(); toque('Nota excluída.'); });
  }
  async function restaurar(n) {
    try { await chamar('notas.reativar', { ID: n.ID }); await carregar(); toque('Nota restaurada.'); } catch (e) { toque(e.message, 5000); }
  }

  function desenharLinhas() {
    const visiveis = dados.registros.filter(achar);
    const pagina = pag.fatiar(visiveis);
    corpo.replaceChildren(...pagina.map(n => {
      const forn = razaoDe(rotuloDe(dados.referencias, 'FORNECEDOR_ID', n.FORNECEDOR_ID));
      const imp = sigla => { const i = (n.impostos || []).find(x => x.SIGLA === sigla); return i ? moedaBr(i.VALOR_IMPOSTO) : '—'; };
      const detalhe = (n.impostos || []).length ? (n.impostos || []).map(i => i.SIGLA + ' ' + moedaBr(i.VALOR_IMPOSTO)).join(' · ') : 'Sem retenção';
      return h('tr', { class: n.STATUS === 'ATIVO' ? '' : 'linha-inativa' },
        h('td', { class: 'principal data' }, h('a', { href: '#/notas/' + n.ID, class: 'ligacao', 'aria-label': 'Ver a nota ' + n.NUMERO_NF + ' de ' + forn, texto: n.NUMERO_NF })),
        h('td', { 'data-rotulo': 'Processo SEI', class: 'data sei', texto: n.PROCESSO_SEI || '—' }),
        h('td', { 'data-rotulo': 'Fornecedor', class: 'forn', title: forn, texto: forn }),
        h('td', { 'data-rotulo': 'Competência', class: 'data', texto: competenciaBr(n.COMPETENCIA) }),
        h('td', { 'data-rotulo': 'Valor bruto', class: 'num', texto: moedaBr(n.VALOR_BRUTO) }),
        ...['INSS', 'IRRF', 'ISS', 'CSRF'].map(sg => h('td', { 'data-rotulo': sg, class: 'num imp', texto: imp(sg) })),
        h('td', { 'data-rotulo': 'Retenções', class: 'num ret-total', title: detalhe, texto: moedaBr(n.TOTAL_RETENCOES) }),
        h('td', { 'data-rotulo': 'Valor líquido', class: 'num liq', texto: moedaBr(n.VALOR_LIQUIDO) }),
        h('td', { 'data-rotulo': 'Situação' }, seloNota(n)),
        h('td', { class: 'acoes' },
          h('button', { type: 'button', class: 'botao claro pequeno', texto: 'MV', title: 'Dados para lançar no MV', 'aria-label': 'Dados do MV da nota ' + n.NUMERO_NF, onclick: () => abrirDadosMv(n.ID, carregar) }),
          !pode('OPERADOR') ? null : [n.STATUS === 'ATIVO' ? h('button', { type: 'button', class: 'botao claro pequeno', texto: 'Editar', 'aria-label': 'Editar a nota ' + n.NUMERO_NF, onclick: () => ir('notas/' + n.ID + '/editar') }) : null,
          n.STATUS === 'ATIVO'
            ? h('button', { type: 'button', class: 'botao perigo pequeno', texto: 'Excluir', 'aria-label': 'Excluir a nota ' + n.NUMERO_NF, onclick: () => excluir(n) })
            : h('button', { type: 'button', class: 'botao claro pequeno', texto: 'Restaurar', 'aria-label': 'Restaurar a nota ' + n.NUMERO_NF, onclick: () => restaurar(n) })]));
    }));
    tabela.hidden = visiveis.length === 0; vazio.hidden = visiveis.length !== 0;
    vazio.textContent = dados.registros.length === 0 ? (pode('OPERADOR') ? 'Nenhuma nota registrada ainda. Use "Nova nota".' : 'Nenhuma nota registrada ainda.') : 'Nenhuma nota com este filtro.';
    contagem.textContent = visiveis.length + (visiveis.length === 1 ? ' nota' : ' notas');
    const soma = campo => Math.round(visiveis.reduce((s, n) => s + Number(n[campo] || 0), 0) * 100) / 100;
    totais.replaceChildren(
      h('span', {}, h('strong', { texto: 'Valor bruto: ' }), moedaBr(soma('VALOR_BRUTO'))),
      h('span', {}, h('strong', { texto: 'Retenções: ' }), moedaBr(soma('TOTAL_RETENCOES'))),
      h('span', {}, h('strong', { texto: 'Valor líquido: ' }), moedaBr(soma('VALOR_LIQUIDO'))));
  }

  async function carregar() {
    try {
      dados = await chamar('notas.listar', {});
      const comps = [...new Set(dados.registros.map(n => n.COMPETENCIA).filter(Boolean))].sort().reverse();
      const forns = [...new Set(dados.registros.map(n => n.FORNECEDOR_ID))].map(id => [id, razaoDe(rotuloDe(dados.referencias, 'FORNECEDOR_ID', id))]).sort((a, b) => a[1].localeCompare(b[1], 'pt-BR'));
      const busca = h('input', { type: 'search', placeholder: 'Pesquisar número, fornecedor, contrato ou processo SEI…', autocomplete: 'off', 'aria-label': 'Pesquisar notas', value: filtro.texto });
      busca.addEventListener('input', () => { filtro.texto = busca.value; pag.inicio(); desenharLinhas(); });
      const sel = (rotulo, valor, opcoes, aoMudar) => h('select', { 'aria-label': rotulo, onchange: ev => { aoMudar(ev.target.value); pag.inicio(); desenharLinhas(); } },
        opcoes.map(([v, t]) => h('option', { value: v, selected: v === valor, texto: t })));
      const inativas = h('input', { type: 'checkbox', id: 'ver-inativas', checked: filtro.inativas ? true : null });
      inativas.addEventListener('change', () => { filtro.inativas = inativas.checked; pag.inicio(); desenharLinhas(); });
      tabela = h('div', { class: 'tabela-caixa' }, h('table', { class: 'tabela-notas' },
        h('thead', {}, h('tr', {}, [['Nº da NF', ''], ['Processo SEI', ''], ['Fornecedor', ''], ['Competência', ''], ['Valor bruto', 'num'], ['INSS', 'num imp'], ['IRRF', 'num imp'], ['ISS', 'num imp'], ['CSRF', 'num imp'], ['Retenções', 'num'], ['Valor líquido', 'num liq'], ['Situação', '']].map(([t, c]) => h('th', { scope: 'col', class: c, texto: t })), h('th', { scope: 'col' }, h('span', { class: 'so-leitor', texto: 'Ações' })))), corpo));
      caixa.replaceChildren(
        h('div', { class: 'filtros filtros-notas' },
          h('div', { class: 'busca' }, busca),
          sel('Situação', filtro.situacao, [['TODAS', 'Todas as situações'], ['PENDENTE', 'Pendentes'], ['LANCADA', 'Lançadas']], v => { filtro.situacao = v; }),
          sel('Competência', filtro.competencia, [['', 'Todas as competências']].concat(comps.map(c => [c, competenciaBr(c)])), v => { filtro.competencia = v; }),
          sel('Fornecedor', filtro.fornecedor, [['', 'Todos os fornecedores']].concat(forns), v => { filtro.fornecedor = v; }),
          h('label', { class: 'marcar', for: 'ver-inativas' }, inativas, 'Mostrar inativas'),
          contagem),
        totais, tabela, vazio, pag.el);
      desenharLinhas();
    } catch (e) {
      caixa.replaceChildren(h('div', { class: 'painel-corpo' }, caixaAviso(e.message), h('button', { type: 'button', class: 'botao claro', texto: 'Tentar de novo', onclick: carregar })));
    }
  }
  carregar();
  return bloco;
}

/* ---------- tela com os dados para lançar no MV (uma "planilha" na vertical, com botão de copiar) ---------- */
async function abrirDadosMv(id, depois) {
  let d;
  try { d = await chamar('notas.mv', { ID: id }); } catch (e) { toque(e.message, 5000); return; }
  const erro = h('div');
  const copiarEste = async (valor, botao) => {
    const ok = await copiarTexto(valor);
    const antes = botao.textContent;
    botao.textContent = ok ? 'Copiado' : 'Não copiou';
    setTimeout(() => { if (botao.isConnected) botao.textContent = antes; }, 1600);
  };
  const linhas = d.campos.map(c => {
    const botao = h('button', { type: 'button', class: 'botao claro pequeno', texto: 'Copiar', disabled: c.valor === '' ? true : null, 'aria-label': 'Copiar ' + c.rotulo });
    botao.addEventListener('click', () => copiarEste(c.valor, botao));
    return h('div', { class: 'mv-linha' }, h('div', { class: 'mv-campo', texto: c.rotulo }),
      h('div', { class: 'mv-valor' }, h('span', { class: 'mv-numero', texto: c.valor === '' ? '—' : c.valor }), c.descricao ? h('span', { class: 'mv-descricao', texto: ' - ' + c.descricao }) : null), botao);
  });
  const tudo = h('button', { type: 'button', class: 'botao', texto: 'Copiar tudo' });
  tudo.addEventListener('click', () => copiarEste(d.campos.map(c => c.rotulo + '\t' + c.valor).join('\n'), tudo));
  const lancar = d.nota.SITUACAO === 'PENDENTE' && pode('OPERADOR') ? h('button', { type: 'button', class: 'botao claro', texto: 'Marcar como lançada' }) : null;
  let janela;
  if (lancar) lancar.addEventListener('click', () => enviar(lancar, erro, 'Salvando…', async () => {
    await chamar('notas.situacao', { ID: id, situacao: 'LANCADA' }); janela.close(); toque('Nota marcada como lançada.'); if (depois) await depois();
  }));
  janela = abrirJanela(h('div', {},
    h('div', { class: 'jan-corpo' }, h('h2', { texto: 'Dados para lançar no MV — NF ' + d.nota.NUMERO_NF }),
      h('p', { class: 'ajuda-janela', texto: 'Copie cada campo e cole no SoulMV, na ordem em que aparecem aqui. Nos códigos, o botão copia só o número; a descrição fica ao lado só para conferir.' }), erro,
      d.avisos.map(a => caixaAviso(a)),
      h('div', { class: 'mv-planilha', role: 'list', 'aria-label': 'Campos para o MV' }, linhas)),
    h('div', { class: 'jan-pe' }, lancar, h('button', { type: 'button', class: 'botao claro', texto: 'Fechar', onclick: () => janela.close() }), tudo)), 'larga mv');
}

}

      if (nota) d.impostos.filter(i => i.ORIGEM_BASE === 'MANUAL' && i.SIGLA !== 'CSRF').forEach(i => { bases[i.SIGLA] = String(i.BASE_CALCULO).replace('.', ','); });
      if (nota) trib = await chamar('tributacao.listar', { fornecedorId: nota.FORNECEDOR_ID });
      if (nota && trib && trib.fornecedor.SIMPLES === 'SIM') { const iss = d.impostos.find(i => i.SIGLA === 'ISS'); if (iss) aliqIss = textoPct(iss.ALIQUOTA); }
      vencAuto = !nota || !nota.VENCIMENTO || (nota.DATA_ATESTO && nota.VENCIMENTO === somarDiasIso(nota.DATA_ATESTO, DIAS_VENCIMENTO));
      const devolvido = rascunhoNota && rascunhoNota.id === (id || '') ? rascunhoNota : null;
      if (devolvido) {   // um envio que falhou voltou para cá: os dados digitados são devolvidos
        rascunhoNota = null;
        nota = Object.assign({}, nota || {}, devolvido.dados); bases = devolvido.bases || {}; aliqIss = devolvido.aliquotaIss || ''; vencAuto = false;
        if (novo && nota.FORNECEDOR_ID) trib = await chamar('tributacao.listar', { fornecedorId: nota.FORNECEDOR_ID });
        erroForm.replaceChildren(caixaAviso((devolvido.erro || 'Esta nota não foi salva.') + ' Corrija e tente de novo.'));
      }
      desenhar();
      if (nota) calcular(0);
    } catch (e) {
      bloco.replaceChildren(voltar, h('div', { class: 'painel' }, h('div', { class: 'painel-corpo' }, caixaAviso(e.message), h('button', { type: 'button', class: 'botao claro', texto: 'Tentar de novo', onclick: carregar }))));
    }
  }

  const opcoes = (lista, atual, vazioTexto) => [h('option', { value: '', texto: vazioTexto })].concat((lista || []).filter(o => o.ativo || o.id === atual).map(o => h('option', { value: o.id, selected: o.id === atual, texto: o.rotulo + (o.ativo ? '' : ' (inativo)') })));
  function campo(n, rotulo, entrada, opc) {
    if (!entrada.dataset.combo) entrada.id = 'n-' + n;
    campos[n] = entrada;
    return h('div', { class: 'campo' + (opc && opc.inteiro ? ' inteiro' : '') },
      h('label', { for: 'n-' + n }, rotulo, opc && opc.obrig ? h('span', { class: 'obrig', texto: ' (obrigatório)' }) : null), entrada,
      opc && opc.ajuda ? h('p', { class: 'ajuda', texto: opc.ajuda }) : null);
  }
  const v = n => nota ? (nota[n] === undefined || nota[n] === null ? '' : nota[n]) : '';
  const texto = (n, extra) => h('input', Object.assign({ type: 'text', autocomplete: 'off', value: v(n) }, extra || {}));
  const dinheiroEntrada = n => h('input', { type: 'text', inputmode: 'decimal', autocomplete: 'off', placeholder: 'Ex.: 1234,56', value: v(n) === '' ? '' : String(v(n)).replace('.', ',') });

  // Aviso quando o fornecedor não tem imposto ativo: a nota é aceita, mas sem retenção.
  function avisarSemImposto() {
    semImposto.replaceChildren();
    if (trib && !trib.impostos.some(i => i.STATUS === 'ATIVO')) {
      semImposto.append(caixaAviso('Este fornecedor ainda não tem imposto ativo cadastrado. A nota ficará sem retenção.'),
        h('a', { class: 'botao claro pequeno', href: '#/manutencao/fornecedores/' + trib.fornecedor.ID, texto: 'Abrir a tributação do fornecedor' }));
    }
  }
  // O serviço e a oficina que o fornecedor costuma ter servem só de sugestão: nada é trocado se já estiver preenchido.
  function sugerirServicoEOficina(servicoEscolhido) {
    if (!trib || !trib.vinculos.length) return;
    if (!servicoEscolhido) {
      if (!campos.SERVICO_ID.value && trib.vinculos.length === 1) campos.SERVICO_ID.value = trib.vinculos[0].SERVICO_ID;
    }
    const sid = campos.SERVICO_ID.value;
    const meus = trib.vinculos.filter(x => x.SERVICO_ID === sid && x.OFICINA_ID);
    if (!campos.OFICINA_ID.value && meus.length === 1) campos.OFICINA_ID.value = meus[0].OFICINA_ID;
  }
  async function aoEscolherFornecedor(fid) {
    trib = null; bases = {}; aliqIss = '';

  // Fornecedor optante pelo Simples Nacional: o analista informa a alíquota do ISS e a base do ISS fica bloqueada.
  const ehSimples = () => !!(trib && trib.fornecedor && trib.fornecedor.SIMPLES === 'SIM');
  function atualizarSimples() {
    const simples = ehSimples();

  function agendar() { calcular(300); }
  function calcular(espera) {
    clearTimeout(temporizador);
    temporizador = setTimeout(async () => {
      const minha = ++seq;
      if (!campos.FORNECEDOR_ID.value) { mostrarConta({ vazio: 'Escolha o fornecedor e informe o valor bruto para ver o cálculo dos impostos.' }); return; }
      try {
        const r = await chamar('notas.calcular', { ID: id || '', dados: { VALOR_BRUTO: campos.VALOR_BRUTO.value, DEDUCOES_INSS: campos.DEDUCOES_INSS.value, FORNECEDOR_ID: campos.FORNECEDOR_ID.value, DATA_EMISSAO: campos.DATA_EMISSAO.value }, bases: Object.assign({}, bases), aliquotaIss: ehSimples() ? aliqIss : '' });
        if (minha !== seq) return;
        mostrarConta(r);
      } catch (e) { if (minha === seq) mostrarConta({ problema: e.message }); }
    }, espera);
  }
  const numeroPtBr = x => Number(x).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  // Bases de cálculo, logo abaixo do valor bruto. IRRF, ISS e INSS vêm preenchidas e podem ser alteradas.
  // A CSRF é sempre o valor bruto da nota.
  const BASES_TELA = [
    { sigla: 'INSS', rotulo: 'Base do INSS (R$)', ajuda: 'Valor bruto menos as deduções do INSS. Você pode alterar.' },
    { sigla: 'IRRF', rotulo: 'Base do IRRF (R$)', ajuda: 'Vem com o valor bruto. Você pode alterar.' },
    { sigla: 'ISS', rotulo: 'Base do ISS (R$)', ajuda: 'Vem com o valor bruto. Você pode alterar. Se o fornecedor é do Simples Nacional, fica bloqueada.' },
    { sigla: 'CSRF', rotulo: 'Base da CSRF (R$)', ajuda: 'Sempre o valor bruto da nota. Não pode ser alterada.', fixa: true }

  const baseCampos = {};
  function campoAliquotaIss() {

  function campoDeBase(b) {

  // Preenche as quatro bases com o resultado do cálculo, sem atrapalhar quem está digitando.
  function atualizarBases(r) {
    const itens = {}; (r.itens || []).forEach(i => { itens[i.SIGLA] = i; });
    const calculou = !!r.itens;
    BASES_TELA.forEach(b => {

      const i = itens[b.sigla], alterada = bases[b.sigla] !== undefined;

  function mostrarConta(r) {

        h('tbody', {}, r.itens.map(i => h('tr', {},

          h('td', { class: 'num forte', 'data-rotulo': 'Valor do imposto' }, i.BASE_CALCULO === null ? '—' : moedaBr(i.VALOR_IMPOSTO), i.AVISO ? h('div', { class: 'aviso-linha', texto: i.AVISO }) : null)))))));

  function atualizarHistorico() {
    const sei = campos.PROCESSO_SEI.value.trim();
    campos.HISTORICO_MV.value = sei ? historicoMvTexto(sei, campos.CONTRATO.value.trim(), campos.COMPETENCIA.value, campos.DATA_ATESTO.value) : '';
  }
  // Vencimento: atesto + 30 dias, enquanto a pessoa não digitar outro valor.
  function atualizarVencimento() {

  function desenhar() {

    const servico = comboBusca({ id: 'n-SERVICO_ID', opcoes: ref.SERVICO_ID || [], valor: v('SERVICO_ID'), placeholder: 'Digite o código ou a descrição do serviço…', aoEscolher: sid => { if (novo && sid) sugerirServicoEOficina(true); } });

    sei.addEventListener('input', () => { const p = mascaraSei(sei.value); if (p !== sei.value) sei.value = p; atualizarHistorico(); });
    const grade = h('div', { class: 'grade-campos' },
      campo('PROCESSO_SEI', 'Processo SEI', sei, { obrig: true, ajuda: 'Formato: 00000-00000000/0000-00' }),
      campo('NUMERO_NF', 'Número da NF', texto('NUMERO_NF'), { obrig: true }),
      campo('FORNECEDOR_ID', 'Fornecedor', forn, { obrig: true, inteiro: true, ajuda: novo ? 'Digite parte do nome ou do CNPJ e escolha na lista. Os impostos vêm da tributação do fornecedor.' : 'O fornecedor não pode ser trocado. Para outro fornecedor, inative esta nota e registre uma nova.' }),
      h('div', { class: 'inteiro', style: 'grid-column:1/-1' }, semImposto),
      campo('SERVICO_ID', 'Serviço', servico, { obrig: true, inteiro: true, ajuda: 'Digite o código ou a descrição e escolha na lista. O serviço vai para o lançamento no MV e não muda os impostos.' }),
      campo('VALOR_BRUTO', 'Valor bruto (R$)', dinheiroEntrada('VALOR_BRUTO'), { obrig: true }),
      campo('DEDUCOES_INSS', 'Deduções do INSS (R$)', dinheiroEntrada('DEDUCOES_INSS'), { ajuda: 'Se houver, reduzem só a base do INSS.' }),
      ...BASES_TELA.map(campoDeBase),
      campoAliquotaIss(),
      campo('CONTRATO', 'Contrato', texto('CONTRATO', { placeholder: 'Ex.: 161/2021' }), { ajuda: 'Digite só o número do contrato. Vai para o histórico do MV.' }),
      campo('OFICINA_ID', 'Oficina', h('select', {}, ...opcoes(ref.OFICINA_ID, v('OFICINA_ID'), '— escolha —'))),
      campo('CENTRO_CUSTO_ID', 'Centro de custo', centro, { obrig: true, ajuda: 'Digite para procurar.' }),
      campo('COMPETENCIA', 'Competência do serviço', h('input', { type: 'month', value: v('COMPETENCIA'), placeholder: 'aaaa-mm' }), { obrig: true, ajuda: 'Mês em que o serviço foi prestado.' }),
      campo('DATA_EMISSAO', 'Data de emissão', h('input', { type: 'date', value: v('DATA_EMISSAO') }), { obrig: true }),
      campo('DATA_ATESTO', 'Data do atesto', h('input', { type: 'date', value: v('DATA_ATESTO') })),
      campo('VENCIMENTO', 'Vencimento', h('input', { type: 'date', value: v('VENCIMENTO') }), { ajuda: 'Preenchido com o atesto mais 30 dias. Você pode alterar.' }),
      campo('SITUACAO', 'Situação', h('select', {}, h('option', { value: 'PENDENTE', selected: v('SITUACAO') !== 'LANCADA', texto: 'Pendente' }), h('option', { value: 'LANCADA', selected: v('SITUACAO') === 'LANCADA', texto: 'Lançada' })), { ajuda: 'Lançada = já lançada no MV.' }),
      campo('HISTORICO_MV', 'Histórico para o MV (gerado automaticamente)', h('textarea', { rows: '2', readonly: true }, v('HISTORICO_MV')), { inteiro: true, ajuda: 'Montado com o processo, o contrato, a competência e o atesto.' }),
      campo('OBSERVACOES', 'Observações', h('textarea', { rows: '3' }, v('OBSERVACOES')), { inteiro: true }));
    ['VALOR_BRUTO', 'DEDUCOES_INSS'].forEach(n => campos[n].addEventListener('input', agendar));
    campos.DATA_EMISSAO.addEventListener('change', agendar);

    campos.COMPETENCIA.addEventListener('input', atualizarHistorico);
    campos.COMPETENCIA.addEventListener('change', atualizarHistorico);

        .forEach(n => { envio[n] = campos[n].value.trim(); });

    if (!novo) campos.FORNECEDOR_ID.disabled = true;

/* =====================================================================
   DIÁRIO
   Todo dia chegam processos. Aqui a pessoa registra cada um (Nº do SEI, data, fornecedor)
   e o sistema distribui entre os colaboradores: quem tem menos processos no mês recebe primeiro;
   em caso de empate, vai para quem recebeu há mais tempo. A situação (Pendente / Lançada)
   é a mesma nas notas e no Diário, ligada pelo Nº do SEI.
   ===================================================================== */
function telaDiario() {
  let dados = null, cargas = null, montada = false, seq = 0;
  const presentes = new Set();

  }

  notas.forEach(n => { if (!grupos.has(n.FORNECEDOR_ID)) grupos.set(n.FORNECEDOR_ID, []); grupos.get(n.FORNECEDOR_ID).push(n); });

// Parte o texto em linhas que cabem na largura. Passando do limite de linhas, a última termina com "…".
function quebrarTextoPdf(texto, largura, negrito, tam, maxLinhas) {
  const palavras = textoPdf(texto).split(' ').filter(p => p !== '');

    linhas.push(atual); atual = ''; empurrar(p);

  if (atual !== '' || linhas.length === 0) linhas.push(atual);

    while (ultima.length > 1 && !cabe(ultima + '…')) ultima = ultima.slice(0, -1);

// o = { titulo, info: [textos], colunas: [{ t, tipo }], linhas: [[...]], total: [...] | null, rodape }
// Dinheiro (tipo 'moeda') e inteiros (tipo 'int') ficam à direita. Texto longo quebra em até 2 linhas.
function gerarPdf(o) {

  const util = PW - 2 * MX, nCol = o.colunas.length;
  const dinheiro = v => (v === null || v === undefined || v === '') ? '' : Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmt = (c, v) => c.tipo === 'moeda' ? dinheiro(v) : (v === null || v === undefined ? '' : String(v));
  const dir = c => c.tipo === 'moeda' || c.tipo === 'int';
  // largura de cada coluna: números ficam do tamanho certo; o texto divide o que sobra
  const ideal = o.colunas.map((c, i) => {
    let m = larguraPdf(c.t, true, TAM) * (dir(c) || c.t.length <= 12 ? 1 : 0.6);
    c.t.split(' ').forEach(p => { m = Math.max(m, larguraPdf(p, true, TAM)); });
    let cheio = 0;
    o.linhas.concat(o.total ? [o.total] : []).forEach(l => { cheio = Math.max(cheio, larguraPdf(fmt(c, l[i]), false, TAM) * 1.04, 0); });
    const nat = dir(c) ? Math.max(m, cheio) : Math.max(m, Math.min(cheio, 230));
    return { minimo: Math.ceil(m + 2 * PAD), natural: Math.ceil(Math.max(nat, m) + 2 * PAD) };
  });
  let larg = ideal.map(x => x.natural);
  const soma = () => larg.reduce((a, b) => a + b, 0);
  if (soma() > util) {
    // encolhe só as colunas de texto, em proporção ao que passa do mínimo
    const folga = o.colunas.map((c, i) => dir(c) ? 0 : ideal[i].natural - ideal[i].minimo);
    const excesso = soma() - util, totalFolga = folga.reduce((a, b) => a + b, 0);
    larg = larg.map((w, i) => totalFolga > 0 ? w - excesso * folga[i] / totalFolga : w);
    if (soma() > util) { const f = util / soma(); larg = larg.map(w => w * f); }   // último recurso: tudo proporcional
  } else {
    const extra = util - soma(), peso = o.colunas.map((c, i) => dir(c) ? 0 : ideal[i].natural), pT = peso.reduce((a, b) => a + b, 0);

  const linhasDe = (l, negrito) => l.map((v, i) => quebrarTextoPdf(fmt(o.colunas[i], v), larg[i] - 2 * PAD, negrito, TAM, 2));

    const ls = linhasDe(l, false), h = alturaLinhas(ls);

  });

    corrente.itens.push({ ls, h, y: corrente.y, total: true }); corrente.y += h;
  }

    const c = [];
    const topo = np === 0 ? topoTabelaPrimeira : topoTabelaOutras;
    const Y = y => numeroPdf(PH - y);   // y medido de cima para baixo
    const texto = (t, x, yBase, negrito, tam, cor) => c.push('BT /F' + (negrito ? 2 : 1) + ' ' + tam + ' Tf ' + corPdf(cor || '1B2A33') + ' rg ' + numeroPdf(x) + ' ' + Y(yBase) + ' Td ' + literalPdf(t) + ' Tj ET');
    texto(np === 0 ? o.titulo : o.titulo + ' (continuação)', MX, MT + 12, true, np === 0 ? 14 : 11, '153F58');
    if (np === 0) o.info.forEach((t, i) => texto(t, MX, MT + 28 + i * 11, false, 8.5, '55656F'));
    // cabeçalho da tabela
    c.push(corPdf('1E5B7B') + ' rg ' + numeroPdf(MX) + ' ' + Y(topo + alturaCab) + ' ' + numeroPdf(util) + ' ' + numeroPdf(alturaCab) + ' re f');

      const w = larguraPdf(t, true, TAM), x = dir(o.colunas[i]) ? xs[i] + larg[i] - PAD - w : xs[i] + PAD;
      texto(t, x, topo + 2.6 + ENT * (k + 1) - 2.2, true, TAM, 'FFFFFF');
    }));
    pg.itens.forEach(it => {
      if (it.total) {
        c.push(corPdf('E8EEF2') + ' rg ' + numeroPdf(MX) + ' ' + Y(it.y + it.h) + ' ' + numeroPdf(util) + ' ' + numeroPdf(it.h) + ' re f');
        c.push(corPdf('8FA3AF') + ' RG 0.8 w ' + numeroPdf(MX) + ' ' + Y(it.y) + ' m ' + numeroPdf(MX + util) + ' ' + Y(it.y) + ' l S');
      } else {
        if (it.zebra) c.push(corPdf('F4F7F9') + ' rg ' + numeroPdf(MX) + ' ' + Y(it.y + it.h) + ' ' + numeroPdf(util) + ' ' + numeroPdf(it.h) + ' re f');
        c.push(corPdf('DCE3E8') + ' RG 0.4 w ' + numeroPdf(MX) + ' ' + Y(it.y + it.h) + ' m ' + numeroPdf(MX + util) + ' ' + Y(it.y + it.h) + ' l S');
      }
      it.ls.forEach((ls, i) => ls.forEach((t, k) => {
        const w = larguraPdf(t, !!it.total, TAM), x = dir(o.colunas[i]) ? xs[i] + larg[i] - PAD - w : xs[i] + PAD;
        texto(t, x, it.y + 2.6 + ENT * (k + 1) - 2.2, !!it.total, TAM);
      }));
    });
    texto(geradoEm, MX, PH - 20, false, 7.5, '55656F');
    const pag = 'Página ' + (np + 1) + ' de ' + paginas.length;
    texto(pag, MX + util - larguraPdf(pag, false, 7.5), PH - 20, false, 7.5, '55656F');
    return c.join('\n');
  });

  // monta o arquivo: 1 catálogo, 2 páginas, 3 e 4 fontes, 5 informações, depois (página, conteúdo) de cada folha
  const objetos = [];
  const add = txt => { objetos.push(txt); return objetos.length; };
  add('<< /Type /Catalog /Pages 2 0 R >>');
  add('<< /Type /Pages /Kids [' + paginas.map((_, i) => (6 + i * 2) + ' 0 R').join(' ') + '] /Count ' + paginas.length + ' >>');
  add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  add('<< /Title ' + literalPdf(o.titulo.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\x20-\x7E]/g, '-')) + ' /Producer (Sistema de Notas Fiscais de Servicos) >>');
  conteudos.forEach((cont, i) => {
    add('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + PW + ' ' + PH + '] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ' + (7 + i * 2) + ' 0 R >>');
    add('<< /Length ' + cont.length + ' >>\nstream\n' + cont + '\nendstream');
  });
  let saida = '%PDF-1.4\n%\xE2\xE3\xCF\xD3\n'; const desloc = [];
  objetos.forEach((t, i) => { desloc.push(saida.length); saida += (i + 1) + ' 0 obj\n' + t + '\nendobj\n'; });
  const xref = saida.length;
  saida += 'xref\n0 ' + (objetos.length + 1) + '\n0000000000 65535 f \n' + desloc.map(d => ('0000000000' + d).slice(-10) + ' 00000 n \n').join('') +
    'trailer\n<< /Size ' + (objetos.length + 1) + ' /Root 1 0 R /Info 5 0 R >>\nstartxref\n' + xref + '\n%%EOF\n';
  const bytes = new Uint8Array(saida.length);
  for (let i = 0; i < saida.length; i++) bytes[i] = saida.charCodeAt(i) & 255;

}

// Data e hora de hoje, em português, para os arquivos gerados.
function agoraBr() {

  return { iso: a.getFullYear() + '-' + p2(a.getMonth() + 1) + '-' + p2(a.getDate()), texto: p2(a.getDate()) + '/' + p2(a.getMonth() + 1) + '/' + a.getFullYear() + ' às ' + p2(a.getHours()) + ':' + p2(a.getMinutes()) };
}
// Baixa a tabela em Excel ou em PDF. o = { titulo, info, colunas, linhas, total, aba, arquivo }
function baixarTabela(formato, o) {
  const ag = agoraBr();
  if (formato === 'pdf') {
    baixarBinario(o.arquivo + '-' + ag.iso + '.pdf', gerarPdf({ titulo: o.titulo, info: o.info.concat(o.colunas.some(c => c.tipo === 'moeda') ? ['Valores em R$.'] : []), colunas: o.colunas, linhas: o.linhas, total: o.total, rodape: 'Gerado em ' + ag.texto }), 'application/pdf');
    return 'PDF gerado.';
  }
  baixarBinario(o.arquivo + '-' + ag.iso + '.xlsx', gerarXlsx({ aba: o.aba || 'Relatório', titulo: o.titulo, info: o.info.concat(['Gerado em ' + ag.texto]), colunas: o.colunas, linhas: o.linhas, total: o.total }), 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');

}

function telaRelatorios() {

    const fmt = v => filtro.periodoPor === 'COMPETENCIA' ? competenciaBr(v) : dataBr(v);
    if (filtro.de && filtro.ate) partes.push(rotuloPeriodo + ' de ' + fmt(filtro.de) + ' até ' + fmt(filtro.ate));
    else if (filtro.de) partes.push(rotuloPeriodo + ' a partir de ' + fmt(filtro.de));
    else if (filtro.ate) partes.push(rotuloPeriodo + ' até ' + fmt(filtro.ate));
    if (filtro.fornecedor) partes.push('Fornecedor: ' + razaoDe(rotuloDe(dados.referencias, 'FORNECEDOR_ID', filtro.fornecedor)));

      campoRel(mes ? 'De (mês/ano)' : 'De', 'rel-de', entradaData('rel-de', 'de')),
      campoRel(mes ? 'Até (mês/ano)' : 'Até', 'rel-ate', entradaData('rel-ate', 'ate')),

      h('button', { type: 'button', class: 'botao claro', texto: 'Limpar filtros', onclick: () => { Object.assign(filtro, { periodoPor: 'COMPETENCIA', de: '', ate: '', fornecedor: '', situacao: 'TODAS' }); pag.inicio(); desenharFiltros(); desenharResultado(); } })));
  }

        h('div', { class: 'vazio', role: 'status', texto: dados.registros.some(n => n.STATUS === 'ATIVO') ? 'Nenhuma nota com estes filtros. Mude o período ou use "Limpar filtros".' : 'Ainda não há notas registradas.' }));

        h('tbody', {}, pagina.map(l => h('tr', {}, l.map((v, i) => celula(rel.colunas[i], v, i))))),

      painelResultado.replaceChildren(h('div', { class: 'painel-corpo' }, caixaAviso(e.message), h('button', { type: 'button', class: 'botao claro', texto: 'Tentar de novo', onclick: () => ir('relatorios') })));
    }

    else if (filtro.ate) partes.push(rotuloPeriodo + ': até ' + fmt(filtro.ate));
    if (filtro.fornecedor) partes.push('Fornecedor: ' + razaoDe(rotuloDe(dados.referencias, 'FORNECEDOR_ID', filtro.fornecedor)));
    if (filtro.situacao !== 'TODAS') partes.push('Situação no MV: ' + (filtro.situacao === 'LANCADA' ? 'lançadas' : 'pendentes'));
    return partes.length ? partes.join(' • ') : 'Todo o período, todos os fornecedores.';
  }

  function desenharFiltros() {
    const mes = filtro.periodoPor === 'COMPETENCIA', tipo = mes ? 'month' : 'date';
    const aoMudar = () => desenharResultado();
    const periodo = h('select', { id: 'dash-periodo', onchange: ev => { filtro.periodoPor = ev.target.value; filtro.de = ''; filtro.ate = ''; desenharFiltros(); aoMudar(); } },
      PERIODOS_RELATORIO.map(p => h('option', { value: p[0], selected: p[0] === filtro.periodoPor, texto: p[1] })));
    const entradaData = (id, chave) => { const e = h('input', { type: tipo, id, value: filtro[chave] }); ['input', 'change'].forEach(ev => e.addEventListener(ev, () => { filtro[chave] = e.value; aoMudar(); })); return e; };
    const ids = [...new Set(dados.registros.filter(n => n.STATUS === 'ATIVO').map(n => n.FORNECEDOR_ID))];
    const opcoes = ids.map(id => { const r = rotuloDe(dados.referencias, 'FORNECEDOR_ID', id); return { id, ativo: true, rotulo: razaoDe(r) + ' — ' + String(r).split(' — ')[0] }; }).sort((a, b) => a.rotulo.localeCompare(b.rotulo, 'pt-BR'));
    const forn = comboBusca({ id: 'dash-fornecedor', opcoes, valor: filtro.fornecedor, placeholder: 'Todos. Digite para escolher um.', aoEscolher: id => { filtro.fornecedor = id; aoMudar(); } });
    const campoDe = (rotulo, para, entrada, classe) => h('div', { class: 'campo ' + (classe || '') }, h('label', { for: para, texto: rotulo }), entrada);
    const sit = h('select', { id: 'dash-situacao', onchange: ev => { filtro.situacao = ev.target.value; aoMudar(); } },
      [['TODAS', 'Todas'], ['PENDENTE', 'Pendentes'], ['LANCADA', 'Lançadas']].map(([v, t]) => h('option', { value: v, selected: v === filtro.situacao, texto: t })));
    // Atalhos de período: valem para o tipo de período escolhido (competência ou datas).
    const hoje = new Date(), p2 = n => String(n).padStart(2, '0');
    const mesDe = (ano, m0) => { const d = new Date(ano, m0, 1); return d.getFullYear() + '-' + p2(d.getMonth() + 1); };
    const ultimoDia = ym => { const [a, m] = ym.split('-').map(Number); return ym + '-' + p2(new Date(a, m, 0).getDate()); };
    const atalho = (texto, ymDe, ymAte) => h('button', { type: 'button', class: 'botao claro pequeno', texto, onclick: () => {
      filtro.de = ymDe === '' ? '' : (mes ? ymDe : ymDe + '-01'); filtro.ate = ymAte === '' ? '' : (mes ? ymAte : ultimoDia(ymAte));
      desenharFiltros(); aoMudar(); } });
    const este = mesDe(hoje.getFullYear(), hoje.getMonth()), passado = mesDe(hoje.getFullYear(), hoje.getMonth() - 1);
    painelFiltros.replaceChildren(h('div', { class: 'filtros-rel' },
      campoDe('Filtrar o período por', 'dash-periodo', periodo),
      campoDe(mes ? 'De (mês/ano)' : 'De', 'dash-de', entradaData('dash-de', 'de')),
      campoDe(mes ? 'Até (mês/ano)' : 'Até', 'dash-ate', entradaData('dash-ate', 'ate')),
      h('div', { class: 'campo atalhos-data' }, h('span', { class: 'rotulo-falso', texto: 'Período rápido' }),
        h('div', { class: 'atalhos-botoes' }, atalho('Este mês', este, este), atalho('Mês passado', passado, passado), atalho('Este ano', hoje.getFullYear() + '-01', hoje.getFullYear() + '-12'), atalho('Tudo', '', ''))),
      campoDe('Fornecedor', 'dash-fornecedor', forn, 'largo'),
      campoDe('Situação no MV', 'dash-situacao', sit),
      h('button', { type: 'button', class: 'botao claro', texto: 'Limpar filtros', onclick: () => { Object.assign(filtro, { periodoPor: 'COMPETENCIA', de: '', ate: '', fornecedor: '', situacao: 'TODAS' }); desenharFiltros(); desenharResultado(); } })));
  }

  // Lista com barras: o comprimento da barra mostra o valor bruto em relação ao maior da lista.
  function listaBarras(colunas, linhas, maior) {
    return h('div', { class: 'tabela-caixa' }, h('table', { class: 'tabela-dash' },
      h('thead', {}, h('tr', {}, colunas.map(c => h('th', { scope: 'col', class: c.num ? 'num' : '', texto: c.t })))),
      h('tbody', {}, linhas.map(l => {
        const barra = h('span', { class: 'barra-cheia' }); barra.style.width = (maior > 0 ? Math.max(2, Math.round(l.valor / maior * 100)) : 0) + '%';
        return h('tr', {},
          h('td', { class: 'principal dash-nome', title: l.nome }, h('div', { class: 'dash-texto', texto: l.nome }), h('div', { class: 'barra', 'aria-hidden': 'true' }, barra)),
          h('td', { class: 'num', 'data-rotulo': 'Notas', texto: String(l.notas) }),
          h('td', { class: 'num', 'data-rotulo': 'Valor bruto', texto: moedaBr(l.valor) }),
          h('td', { class: 'num', 'data-rotulo': 'Retenções', texto: moedaBr(l.ret) }),
          h('td', { class: 'num', 'data-rotulo': 'Valor líquido', texto: moedaBr(l.liq) }));
      }))));
  }

  function desenharResultado() {
    const todasAtivas = dados.registros.filter(n => n.STATUS === 'ATIVO');
    if (todasAtivas.length === 0) {
      area.replaceChildren(h('div', { class: 'painel' }, h('div', { class: 'vazio', role: 'status' }, 'Ainda não há notas registradas. ', pode('OPERADOR') ? [h('a', { class: 'ligacao', href: '#/notas/nova', texto: 'Registre a primeira nota' }), '.'] : null)));
      return;
    }
    const notas = filtrarNotasRelatorio(dados.registros, filtro);
    const bruto = somarRel(notas, n => n.VALOR_BRUTO), ret = somarRel(notas, n => n.TOTAL_RETENCOES), liq = somarRel(notas, n => n.VALOR_LIQUIDO);
    const pend = notas.filter(n => n.SITUACAO !== 'LANCADA');
    const kpi = (nome, valor, apoio, classe) => h('div', { class: 'kpi ' + (classe || '') }, h('div', { class: 'kpi-nome', texto: nome }), h('div', { class: 'kpi-valor', texto: valor }), apoio ? h('div', { class: 'kpi-apoio', texto: apoio }) : null);
    const kpis = h('div', { class: 'kpis', role: 'group', 'aria-label': 'Indicadores' },
      kpi('Total de notas', String(notas.length), notas.length ? nomeNotas(notas.length - pend.length) + ' lançadas' : ''),
      kpi('Valor bruto', moedaBr(bruto), ''),
      kpi('Retenções', moedaBr(ret), bruto > 0 ? 'Equivale a ' + (Math.round(ret / bruto * 1000) / 10).toLocaleString('pt-BR') + '% do valor bruto' : ''),
      kpi('Valor líquido', moedaBr(liq), ''),
      kpi('Pendentes no MV', String(pend.length), pend.length ? 'Valor bruto: ' + moedaBr(somarRel(pend, n => n.VALOR_BRUTO)) : 'Nada pendente', pend.length ? 'kpi-alerta' : ''));
    const cab = h('div', { class: 'painel-corpo', style: 'padding:12px 18px' }, h('p', { class: 'ajuda-janela', style: 'margin:0', role: 'status', texto: descricaoFiltros() }));
    if (notas.length === 0) {
      area.replaceChildren(h('div', { class: 'painel' }, cab, h('div', { class: 'vazio', role: 'status', texto: 'Nenhuma nota com estes filtros. Mude o período ou use "Limpar filtros".' })));
      return;
    }
    const porCompetencia = new Map(), porFornecedor = new Map();
    notas.forEach(n => {
      const c = n.COMPETENCIA || ''; if (!porCompetencia.has(c)) porCompetencia.set(c, []); porCompetencia.get(c).push(n);
      if (!porFornecedor.has(n.FORNECEDOR_ID)) porFornecedor.set(n.FORNECEDOR_ID, []); porFornecedor.get(n.FORNECEDOR_ID).push(n);
    });
    const resumir = (nome, l) => ({ nome, notas: l.length, valor: somarRel(l, n => n.VALOR_BRUTO), ret: somarRel(l, n => n.TOTAL_RETENCOES), liq: somarRel(l, n => n.VALOR_LIQUIDO) });
    const comps = [...porCompetencia.entries()].sort((a, b) => String(b[0]).localeCompare(String(a[0]))).map(([c, l]) => resumir(c ? competenciaBr(c) : 'Sem competência', l));
    const compsMostradas = comps.slice(0, 12);
    const forns = [...porFornecedor.entries()].map(([id, l]) => resumir(razaoDe(rotuloDe(dados.referencias, 'FORNECEDOR_ID', id)), l)).sort((a, b) => b.valor - a.valor || a.nome.localeCompare(b.nome, 'pt-BR'));
    const fornsMostrados = forns.slice(0, 10);
    const maior = lista => lista.reduce((m, x) => Math.max(m, x.valor), 0);
    area.replaceChildren(
      h('div', { class: 'painel' }, cab, kpis),
      h('div', { class: 'dash-listas' },
        h('section', { class: 'painel', 'aria-label': 'Notas por competência' }, h('div', { class: 'painel-corpo', style: 'padding-bottom:6px' }, h('h2', { texto: 'Notas por competência' }),
          comps.length > compsMostradas.length ? h('p', { class: 'ajuda-janela', style: 'margin:0', texto: 'Mostrando as ' + compsMostradas.length + ' competências mais recentes de ' + comps.length + '.' }) : null),
          listaBarras([{ t: 'Competência' }, { t: 'Notas', num: true }, { t: 'Valor bruto', num: true }, { t: 'Retenções', num: true }, { t: 'Valor líquido', num: true }], compsMostradas, maior(compsMostradas))),
        h('section', { class: 'painel', 'aria-label': 'Notas por fornecedor' }, h('div', { class: 'painel-corpo', style: 'padding-bottom:6px' }, h('h2', { texto: 'Notas por fornecedor' }),
          h('p', { class: 'ajuda-janela', style: 'margin:0' }, forns.length > fornsMostrados.length ? 'Os ' + fornsMostrados.length + ' fornecedores com maior valor bruto, de ' + forns.length + '. ' : 'Do maior para o menor valor bruto. ', h('a', { class: 'ligacao', href: '#/relatorios', texto: 'Ver todos nos relatórios' }), '.')),
          listaBarras([{ t: 'Fornecedor' }, { t: 'Notas', num: true }, { t: 'Valor bruto', num: true }, { t: 'Retenções', num: true }, { t: 'Valor líquido', num: true }], fornsMostrados, maior(fornsMostrados)))));
  }

  (async function carregar() {
    try {
      dados = await chamar('notas.listar', {});
      desenharFiltros(); desenharResultado();
    } catch (e) {
      area.replaceChildren(h('div', { class: 'painel' }, h('div', { class: 'painel-corpo' }, caixaAviso(e.message), h('button', { type: 'button', class: 'botao claro', texto: 'Tentar de novo', onclick: () => ir('dashboard') }))));
    }
  })();
  return bloco;
}

/* =====================================================================
   ADMINISTRAÇÃO: backup dos dados
   ===================================================================== */
/* =====================================================================
   INÍCIO
   ===================================================================== */
window.addEventListener('hashchange', desenharRota);
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') fecharMenu(); });

document.addEventListener('visibilitychange', () => {
  if (!MODO_LOCAL && !document.hidden && estado.sessao && estado.sessao.expiraEm * 1000 < Date.now()) encerrar('Sua sessão terminou. Entre de novo.');
});

(function iniciar() {
  if (MODO_LOCAL) {
    telaSistema();
    if (banco.aviso) toque(banco.aviso, 12000);
    return;
  }
  if (!enderecoValido()) { telaSemEndereco(); return; }
  let guardada = null;
  try { guardada = JSON.parse(sessionStorage.getItem(CHAVE_SESSAO) || 'null'); } catch (e) { guardada = null; }
  if (guardada && guardada.token && guardada.expiraEm * 1000 > Date.now()) {
    guardarSessao(guardada.token, guardada.expiraEm);
    document.getElementById('raiz').replaceChildren(h('div', { class: 'entrada' }, h('p', { role: 'status', texto: 'Carregando…' })));
    carregarUsuario();
  } else {
    telaLogin({});
  }
})();
})();
</script>
