# Mantém o Sistema de Notas Fiscais ativo no plano gratuito do Supabase.
# O plano gratuito pausa o projeto depois de cerca de 7 dias sem uso.
# Todo dia, esta rotina faz uma consulta mínima ao banco (não envia nem mostra nenhum dado).
# Não usa senha, chave nem segredo: o endereço abaixo é público e só responde "vivo".
name: Manter o Supabase ativo

on:
  schedule:
    - cron: '23 12 * * *'   # todos os dias, às 9h23 no horário de Brasília
  workflow_dispatch: {}     # permite rodar à mão, na aba Actions

permissions: {}

jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Consultar o sistema
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 60 \
            "https://gstkfryfsfyglunvamkc.supabase.co/functions/v1/nf?vivo=1"
